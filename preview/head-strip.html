<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Head strip — job and lead cards</title>
<!-- The SHIPPED files, nothing re-typed: this harness exists so the head strip
     can be looked at, at both widths, without a signed-in app.
       node preview/serve.js   ->   http://localhost:8765/head-strip.html -->
<link rel="stylesheet" href="css/workspace-layout.css" />
<style>
  :root{
    --bg:#0e1118; --panel:#151923; --panel-2:#1b2030; --border:#2a2f3e;
    --card-bg:#12151f; --text:#e6e9f2; --muted:#8b93a7; --text-dim:#7f8699;
    --accent:#4f8cff; --green:#34d399; --red:#f87171;
    --font-mono:ui-monospace,monospace;
  }
  body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif;margin:0;padding:24px;}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px;}
  .frame{border:1px dashed #39405a;margin-bottom:6px;}
  .headrow{display:flex;align-items:center;gap:8px;padding:8px 10px;}
  iframe{border:1px dashed #39405a;background:var(--bg);}
</style>
</head>
<body>
  <h2>Job head strip — full width, with the back control beside it</h2>
  <div class="frame">
    <div class="headrow">
      <button class="p86-head-back" title="Back to jobs list" aria-label="Back to jobs list">&larr;</button>
      <div style="flex:1 1 auto;min-width:0;" id="job-wide"></div>
    </div>
  </div>

  <!-- The fold is a @media (max-width:820px) rule, so it answers the VIEWPORT.
       A 420px div inside a 1500px window is not a phone — it squeezes the grid
       instead of folding it, which is how the first version of this harness
       managed to show a broken layout that does not exist. The iframe gives the
       rule a window to measure. -->
  <h2>Job head strip — phone fold (a real 420px viewport)</h2>
  <iframe id="job-narrow" src="head-strip-one.html" style="width:420px;height:330px;"></iframe>

  <h2>Lead head strip — full width</h2>
  <div class="frame" id="lead-wide"></div>

  <h2>Job card — sidebar column shape (unchanged)</h2>
  <div class="frame" style="max-width:300px;" id="job-column"></div>

<script src="js/agx-icons.js"></script>
<script src="js/maps-link.js"></script>
<script src="js/entity-card.js"></script>
<script src="head-strip-data.js"></script>
<script>
  var C = window.p86EntityCard, H = window.HARNESS;
  document.getElementById('job-wide').innerHTML = C.render(H.JOB, { compact: true, strip: true });
  document.getElementById('lead-wide').innerHTML = C.render(H.LEAD, { compact: true, strip: true });
  document.getElementById('job-column').innerHTML = C.render(H.JOB, { compact: true });
</script>
</body>
</html>
