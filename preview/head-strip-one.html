<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Head strip — one card</title>
<!-- The job strip alone, so head-strip.html can load it in an iframe narrow
     enough for the @media (max-width:820px) fold to actually fire. -->
<link rel="stylesheet" href="css/workspace-layout.css" />
<style>
  :root{
    --bg:#0e1118; --panel:#151923; --panel-2:#1b2030; --border:#2a2f3e;
    --card-bg:#12151f; --text:#e6e9f2; --muted:#8b93a7; --text-dim:#7f8699;
    --accent:#4f8cff; --green:#34d399; --red:#f87171;
    --font-mono:ui-monospace,monospace;
  }
  body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif;margin:0;padding:10px;}
  .headrow{display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>
  <div class="headrow">
    <button class="p86-head-back" title="Back to jobs list" aria-label="Back to jobs list">&larr;</button>
    <div style="flex:1 1 auto;min-width:0;" id="one"></div>
  </div>
<script src="js/agx-icons.js"></script>
<script src="js/maps-link.js"></script>
<script src="js/entity-card.js"></script>
<script src="head-strip-data.js"></script>
<script>
  document.getElementById('one').innerHTML =
    window.p86EntityCard.render(window.HARNESS.JOB, { compact: true, strip: true });
</script>
</body>
</html>
