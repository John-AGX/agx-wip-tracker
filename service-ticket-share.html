<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Work Order</title>

<!-- This URL carries a CREDENTIAL in its path. The server sets these as
     headers too; they are repeated here so the page is correct even if it is
     ever served another way. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />

<!--
  ══════════════════════════════════════════════════════════════════════════
  SERVICE TICKET — the public work-order page.

  THE HOUSE RULE: a guest surface COPIES the app's markup, classes and tokens
  and NEVER links the app's code. Every real renderer in the SPA takes an id
  and reaches for app state itself, so loading one onto a page outside the app
  drags the whole app in behind it — along with its auth assumptions.

  This file therefore links ZERO scripts and ZERO stylesheets. Everything is
  inline. js/report-document.js is the ONE sanctioned exception in this repo
  and it earned that by being provably pure; nothing here needs it.

  WRITE CONTROLS ARE GATED ON THE SERVER'S ANSWER, NEVER ON THIS PAGE.
  The field-report card renders only when the read returned scope 'respond'
  (or better) and the work order is still live. That gate is a COURTESY: the
  server re-derives the scope from the stored share row on every single
  request, so hiding a box here changes nothing about what is permitted. A
  view-only link renders no control at all, and a link whose scope is later
  narrowed stops working immediately whatever this page last drew.

  What a guest may write is a CLOSED SET of four keys — name, checklist,
  note, status — and the server NAMES each one rather than looping over the
  body, so a column added to service_tickets later cannot become writable by
  a stranger just because it exists. 'propose' (editing the scope itself,
  landing as a pending revision) arrives with its door in S6.

  1.29: Flag a problem posts its own closed set (category, note, task_id,
  client_ref, photos_expected, name) to its own door, and its photos go
  through the same upload queue as every other photo on this page.
  ══════════════════════════════════════════════════════════════════════════
-->

<style>
  /* The crew's phone first: a 390px screen in a truck, often in sun, one
     thumb. Tokens follow the approved work-order mock (dark is the default,
     light re-derives the same roles). */
  :root {
    --bg: #0e1116;
    --card: #161b22;
    --sub: #131820;
    --border: #262d38;
    --line: #30363d;
    --text: #e6edf3;
    --text-2: #c9d1d9;
    --dim: #8b949e;
    --accent: #2f81f7;
    /* Text on a filled button or pill: the accent (Navigate, Download the
       takeoff, the current step, Save report, Send revision) and the green
       (Mark work complete, Mark Bldg complete). White on #2f81f7 is 3.75:1
       and on #2ea043 3.37:1, under the 4.5:1 that 10-15px text needs; the
       page ground is 5.05:1 and 5.61:1. Light mode swaps it back to white:
       5.19:1 on #0969da, 5.08:1 on #1a7f37. */
    --on-accent: #0e1116;
    --accent-2: #9cc0ff;
    --link: #79b8ff;
    --green: #2ea043;
    --green-text: #7ee2a5;
    --amber: #d29922;
    --amber-text: #f2cc60;
    --red: #f85149;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --card: #ffffff; --sub: #f6f8fa; --border: #d8dee4; --line: #d0d7de;
      --text: #1f2328; --text-2: #32383f; --dim: #59636e; --accent: #0969da; --on-accent: #ffffff;
      --accent-2: #0550ae; --link: #0969da; --green: #1a7f37; --green-text: #1a7f37;
      --amber: #9a6700; --amber-text: #9a6700; --red: #cf222e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    padding: 0 0 calc(40px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 720px; margin: 0 auto;
    padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
  }
  header { padding: 16px 0 0; }
  .org { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--dim); font-weight: 700; }
  h1 { font-size: 20px; font-weight: 700; line-height: 1.2; margin: 4px 0 2px; text-wrap: balance; }
  .hmeta { font-size: 12.5px; line-height: 1.45; color: var(--dim); }
  .num { font-family: var(--mono); font-size: 12px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; margin-top: 11px; }
  .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); font-weight: 700; margin-bottom: 7px; }
  .scope { white-space: pre-wrap; font-size: 14px; line-height: 1.55; color: var(--text-2); }
  .muted { color: var(--dim); font-style: italic; }

  /* ONE row that scrolls sideways. A wrapped stepper pushed the job site
     below the fold on a phone; render() scrolls the current step into view
     by moving this row's scrollLeft only, never the page. */
  .stepper {
    position: relative; display: flex; flex-wrap: nowrap; gap: 5px; margin: 12px 0 0; padding: 1px 0;
    overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .stepper::-webkit-scrollbar { display: none; }
  .step {
    flex: 0 0 auto; white-space: nowrap; font-size: 10px; line-height: 1.5; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--dim); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px;
  }
  .step.done { color: var(--text-2); border-color: var(--line); }
  .step.at { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }

  .meta { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .meta:first-of-type { border-top: 0; padding-top: 0; }
  .meta:last-of-type { padding-bottom: 0; }
  .meta-k { flex: 0 0 96px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); }
  .meta-v { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  a { color: var(--link); }

  .task { display: flex; gap: 9px; align-items: center; padding: 4px 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  .task.done .dot { background: var(--green); }
  .task.done .t { color: var(--dim); text-decoration: line-through; }
  .bar { height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 2px 0 6px; }
  .bar > i { display: block; height: 100%; background: var(--green); }
  .tap { font-size: 13px; color: var(--dim); }

  .log { white-space: pre-wrap; border-left: 3px solid var(--accent); padding: 8px 10px; font-size: 14px;
         background: rgba(127,127,127,0.06); border-radius: 0 5px 5px 0; }

  .note { font-size: 12px; color: var(--dim); margin-top: 14px; line-height: 1.5; }
  .fatal { padding: 60px 0; text-align: center; color: var(--dim); }
  .fatal strong { display: block; font-size: 17px; color: var(--text); margin-bottom: 8px; }

  /* The write half — rendered only when the SERVER says this link may respond.
     Every text box is 16px: iOS zooms the whole page into anything smaller. */
  #report textarea, #report input[type="text"] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 16px; margin-bottom: 9px;
    resize: vertical;
  }
  #report .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #report button {
    min-height: 44px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #report button:disabled { opacity: 0.5; cursor: default; }
  #report .file {
    display: inline-flex; align-items: center; min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; color: var(--text-2); font-size: 14px; font-weight: 600;
  }
  #report .file input { display: none; }
  #report .file .camico { margin-right: 6px; }
  /* Take photo and Upload photo share their row in equal halves and Save
     report takes the row under them, so it never wraps on its own into a
     short button. With the camera hidden, Upload photo has the row to itself. */
  #report .row .file { flex: 1 1 0; min-width: 0; justify-content: center; text-align: center; }
  #report .row #save { flex: 1 1 100%; }
  #report .file:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  #report .who { font-size: 13px; color: var(--dim); margin-bottom: 9px; }
  .msg { font-size: 13px; color: var(--dim); margin-top: 9px; min-height: 17px; }
  .msg.bad { color: var(--red); }

  /* The revision box. Accented so it reads as editable, unlike the read-only
     scope a view/respond link sees. */
  #scope {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 16px; resize: vertical;
  }
  #propose {
    min-height: 44px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 9px;
  }
  #propose:disabled { opacity: 0.5; cursor: default; }
  .propose-note { margin-top: 7px; }

  /* ── Work order: where, who to call, what to bring, what to finish ── */
  .site { display: grid; gap: 7px; }
  .site-num { font: 600 12px/1.2 var(--mono); color: var(--accent-2); letter-spacing: 0.02em; }
  .site-name { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .site-addr { font-size: 14px; line-height: 1.45; }
  .actions { display: grid; gap: 7px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
    min-height: 44px; padding: 10px 14px; border-radius: 10px; font: inherit; font-size: 14.5px;
    font-weight: 600; line-height: 1.25; text-decoration: none; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.go { background: var(--green); border-color: var(--green); color: var(--on-accent); }
  .btn.quiet { color: var(--dim); }
  .btn.big { width: 100%; font-size: 15px; padding: 12px; }
  .btn.small { min-height: 40px; padding: 8px 14px; font-size: 13.5px; color: var(--text-2); justify-self: start; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:focus-visible, .bld-head:focus-visible, .th-add:focus-visible, .shot:focus-visible {
    outline: 2px solid var(--link); outline-offset: 2px;
  }
  /* The map pin on Navigate: a rotated drop with a hole punched in the
     button's own colour, so it needs no image and follows the theme. */
  .pin {
    position: relative; flex: 0 0 auto; width: 13px; height: 13px; margin-top: -3px;
    border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: currentColor;
  }
  .pin::after {
    content: ""; position: absolute; left: 4px; top: 4px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--accent);
  }
  .gate { font-size: 14px; color: var(--text-2); }
  .gate b { font-family: var(--mono); font-size: 17px; letter-spacing: 1px; color: var(--text); }

  /* Materials: what to bring on the left, how many in a small box on the
     right. Quantities, never prices — the server keeps no other key. */
  .mats { list-style: none; margin: 0; padding: 0; }
  .mat { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.4; }
  .mat:first-child { border-top: 0; padding-top: 1px; }
  .mat:last-child { padding-bottom: 1px; }
  .mat-d { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .mat-q {
    flex: 0 0 auto; max-width: 45%; text-align: right; overflow-wrap: anywhere;
    font: 600 12.5px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  }
  .mat-u { font-weight: 500; color: var(--dim); }

  /* The takeoff file the office chose for this link. The server decides what
     this link gets — on a link that hides financials a spreadsheet is only
     ever a generated materials list with the prices removed; the original
     file goes only to links sent with financial details — and serves the
     bytes through the token. */
  .takeoff { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .takeoff-kind {
    flex: 0 0 auto; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--accent-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
  }
  .takeoff-name { flex: 1 1 auto; min-width: 0; font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
  .takeoff-size { flex: 0 0 auto; color: var(--dim); font-size: 12.5px; }
  .takeoff-lines { color: var(--dim); font-size: 12.5px; margin: -4px 0 10px; }

  #crewname {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px;
  }

  /* One card per building, straight on the page rather than nested in the
     punch-list card, so the lists and photo tiles get the full width. */
  .bld { border: 1px solid var(--border); border-radius: 12px; margin-top: 8px; background: var(--sub); overflow: hidden; }
  .bld.done { border-color: rgba(46,160,67,0.4); }
  .bld-head {
    width: 100%; min-height: 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center; gap: 8px; padding: 11px 12px;
    background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .bld-name b { display: block; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .bld-name small {
    display: block; margin-top: 1px; font-size: 12px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip {
    font-size: 11px; font-weight: 500; line-height: 1.5; border-radius: 999px; padding: 2px 9px; white-space: nowrap;
    border: 1px solid var(--line); color: var(--dim);
  }
  .chip.ok { color: var(--green-text); background: rgba(46,160,67,0.18); border-color: rgba(46,160,67,0.5); }
  .chip.need { color: var(--amber-text); border-color: rgba(210,153,34,0.45); }
  /* Sent back by the office (1.29): the banner under the stepper and the
     chip on each building the office reopened. Red, like the cancelled card. */
  .card.sentback { border-color: var(--red); border-left-width: 4px; }
  .sentback .lbl { color: var(--red); }
  .sb-note { white-space: pre-wrap; font-size: 15px; color: var(--text); line-height: 1.45; overflow-wrap: anywhere; }
  .sb-bld-lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 700; margin-top: 10px; }
  .sb-bld { margin: 4px 0 0 18px; padding: 0; }
  .sb-bld li { margin: 3px 0; }
  .chip.back { color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, transparent); }
  /* A building with a problem waiting on the office. Wins over every other chip. */
  .chip.flag { color: var(--red); border-color: rgba(248,81,73,0.5); font-weight: 600; }
  .caret { color: var(--dim); font-size: 18px; line-height: 1; transition: transform .15s; }
  .bld.open .caret { transform: rotate(90deg); }
  .bld-body { display: grid; gap: 10px; padding: 0 12px 12px; }
  .bld-body[hidden] { display: none; }
  .side-l { font-size: 12px; font-weight: 700; color: var(--accent-2); margin-bottom: 3px; }
  .side ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; color: var(--text-2); }
  .bld-body > .lbl, .photos .lbl { margin-bottom: 6px; }
  /* Square tiles, three to a row. The two dashed tiles at the end ARE the
     completion-photo file inputs (labels around them): Take photo opens the
     camera, Upload photo the photo library. */
  .shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .shot {
    position: relative; display: block; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); background: rgba(127,127,127,0.12);
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot span {
    position: absolute; left: 4px; bottom: 4px; font-size: 10.5px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,0.62); border-radius: 4px; padding: 1px 5px;
  }
  .th-add {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    aspect-ratio: 1 / 1; border: 1.5px dashed var(--line); border-radius: 8px; padding: 6px;
    color: var(--link); font-size: 12.5px; font-weight: 600; line-height: 1.2; text-align: center; cursor: pointer;
  }
  .th-add .plus { font-size: 24px; font-weight: 400; line-height: 1; }
  .th-add input, .file-btn input { display: none; }
  .camico { flex: 0 0 auto; }
  /* Take before photo and Upload before photo share one row in equal halves,
     their text wrapping inside rather than the pair breaking over two rows.
     With the camera hidden, Upload before photo has the row to itself. */
  .before-add { display: flex; gap: 6px; }
  .before-add .btn { flex: 1 1 0; min-width: 0; padding-left: 8px; padding-right: 8px; }
  /* Take photo needs a camera to open: capture="environment" is ignored on a
     computer, where it would only open the file dialog Upload photo already
     opens. Shown only where the main pointer is a finger, and never on
     Windows, whose 2-in-1s report a finger in tablet mode but have no camera
     behind a file input (the script marks the page no-capture). */
  @media not all and (pointer: coarse) {
    .th-add.th-cam, .btn.cam-btn { display: none; }
  }
  .no-capture .th-add.th-cam, .no-capture .btn.cam-btn { display: none; }
  /* The field report's Take photo, on the same two conditions. */
  @media not all and (pointer: coarse) {
    #report .file.cam-file { display: none; }
  }
  .no-capture #report .file.cam-file { display: none; }
  .bnotes { display: grid; }
  .bnote { font-size: 14px; padding: 6px 0; border-top: 1px solid var(--border); }
  .bnote:first-child { border-top: 0; padding-top: 0; }
  .bnote small { display: block; color: var(--dim); font-size: 11.5px; }
  .note-row { display: flex; gap: 6px; }
  .note-row input {
    flex: 1 1 auto; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 16px;
  }
  .note-row .btn { flex: 0 0 auto; }
  .stamp { color: var(--green-text); font-size: 12.5px; }
  .need-hint { color: var(--amber-text); font-size: 12.5px; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
  #report .msg:empty { min-height: 0; margin-top: 0; }
  .bld .msg { margin-top: 0; min-height: 0; }
  .bld .msg:empty { display: none; }
  /* ── Bad signal (1.29) ──────────────────────────────────────────────────
     The bar at the top when a refresh fails but the page is kept: the whole
     bar is the retry. It sits outside #root, so a redraw never replaces it. */
  .netbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
    max-width: 720px; margin: 0 auto; cursor: pointer;
    padding: 9px max(14px, env(safe-area-inset-right)) 9px max(14px, env(safe-area-inset-left));
    background: var(--card); color: var(--amber-text); border-bottom: 1px solid var(--amber);
    font-size: 13.5px; line-height: 1.4;
  }
  .netbar[hidden] { display: none; }
  .netbar span { flex: 1 1 auto; min-width: 0; }
  .netbar button {
    flex: 0 0 auto; min-height: 36px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-weight: 600;
  }
  .fatal-act { display: flex; justify-content: center; margin-top: 16px; }
  /* Photos still on their way: the tile shows the picture straight away with
     its state on it (Waiting, Sending…, Retrying, Not sent). .pend holds those
     tiles inside the grid without being a grid cell itself. */
  .pend { display: contents; }
  .shots[hidden] { display: none; }
  .shot.pending img { opacity: 0.55; }
  .shot.pending .st { background: rgba(0,0,0,0.72); }
  .upq { font-size: 12.5px; line-height: 1.45; color: var(--dim); margin-top: 6px; white-space: pre-line; }
  .upq[hidden] { display: none; }
  .upq.bad { color: var(--amber-text); }
  .upq-acts { display: flex; gap: 6px; margin-top: 6px; white-space: normal; }
  #report .upq-acts button {
    min-height: 40px; padding: 8px 14px; font-size: 13.5px;
    background: transparent; color: var(--text-2); border: 1px solid var(--line);
  }
  #rshots { margin: 2px 0 4px; }
  #siteShots .shots { margin-top: 2px; }
  .bdone-wrap { display: grid; gap: 10px; }
  .restored { color: var(--amber-text); }
  /* ── Finish whole work order (1.29) ──────────────────────────────────────
     Its own card under the punch list. The button stays off while any
     building is open; Yes asks once more, inline (no browser dialog). */
  #finishCard .done-note { font-size: 13.5px; color: var(--green-text); }
  #finishCard .done-note + .btn { margin-top: 10px; }
  #finishCard .btn[hidden] { display: none; }
  #finishCard .msg:empty { min-height: 0; margin-top: 0; }
  .finish-confirm { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sub); }
  .finish-confirm[hidden] { display: none; }
  .finish-q { font-size: 14.5px; line-height: 1.45; color: var(--text); margin-bottom: 9px; }
  .finish-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .finish-acts .btn { flex: 1 1 0; min-width: 0; }
  /* ── Flag a problem (1.29) ───────────────────────────────────────────────
     The problems a link raised (on a building, or the whole work order), and
     the inline form that raises one. The form's Take photo is a .btn.cam-btn,
     so the camera rules above hide it where there is no camera. */
  .flags { display: grid; gap: 8px; }
  .flags > .lbl { margin-bottom: 0; }
  .flag {
    border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 8px;
    padding: 8px 10px; background: rgba(127,127,127,0.06);
  }
  .flag.resolved { border-left-color: var(--green); }
  #problems .flag { margin-bottom: 8px; }
  .flag-h { font-size: 12px; color: var(--dim); line-height: 1.4; }
  .flag-n { white-space: pre-wrap; font-size: 14px; color: var(--text); margin-top: 2px; overflow-wrap: anywhere; }
  .flag-shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 7px; }
  .flag-state { font-size: 12.5px; color: var(--amber-text); margin-top: 6px; }
  .flag-state.flag-res { color: var(--green-text); }
  .flag-res-note { font-size: 13.5px; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .flag-wait { color: var(--amber-text); margin: 0 0 8px; }
  .flag-sent { font-size: 13px; color: var(--green-text); margin-bottom: 6px; }
  .btn.flag-open { display: inline-flex; border-style: dashed; }
  .flag-slot .hint { margin-top: 6px; }
  .flagform {
    display: grid; gap: 9px; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 11px; background: var(--card);
  }
  .flag-title { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .flag-cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .flag-cat {
    min-height: 40px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--text-2); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .flag-cat[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .flag-cat:disabled { opacity: 0.5; cursor: default; }
  .flag-cat:focus-visible, .flag-photo-rm:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .flagform textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; resize: vertical;
  }
  .flag-pick { display: flex; gap: 6px; }
  .flag-pick .btn { flex: 1 1 0; min-width: 0; }
  /* Time and materials (Phase 3): only on a work order billed after the work. */
  .tm-why { margin: 0 0 10px; }
  .tm-form { border-top: 1px solid var(--border); padding-top: 11px; margin-top: 11px; display: grid; gap: 8px; }
  .tm-form:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .tm-h { font-size: 14px; font-weight: 700; }
  .tm-grid { display: grid; grid-template-columns: 1.4fr 0.8fr 1fr; gap: 8px; }
  .tm-grid.two { grid-template-columns: 1fr 1fr; }
  .tm-grid label, .tm-form > label { display: grid; gap: 4px; font-size: 12px; color: var(--dim); min-width: 0; }
  .tm-form input, .tm-form select, .tm-form textarea {
    width: 100%; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px;
  }
  .tm-form textarea { resize: vertical; }
  .tm-form .btn { justify-self: start; }
  .tm-sent { display: grid; gap: 7px; margin-top: 12px; }
  .tm-sent > .lbl { margin: 0; }
  .tm-line { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .tm-line-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13px; color: var(--text-2); }
  .tm-line-n { font-size: 13.5px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 3px; }
  .tm-line-what { font-size: 14px; color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
  .tm-st { font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--amber-text); }
  .tm-st.ok { color: var(--green-text); }
  .tm-st.no { color: var(--red); }
  @media (max-width: 420px) { .tm-grid:not(.two) { grid-template-columns: 1fr 1fr; } .tm-grid:not(.two) label:first-child { grid-column: 1 / -1; } }
  .flag-photo-rm {
    position: absolute; top: 3px; right: 3px; width: 30px; height: 30px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,0.7); color: #fff; font-size: 17px; font-weight: 700; line-height: 1; cursor: pointer;
  }
  .flag-acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .flag-acts .btn { flex: 1 1 auto; }
  .flag-msg { font-size: 13px; line-height: 1.45; color: var(--dim); white-space: pre-line; }
  .flag-msg:empty { display: none; }
  .flag-msg.bad { color: var(--red); }
  @media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
</style>
</head>
<body>
<div id="netbar" class="netbar" role="status" aria-live="polite" hidden><span></span><button type="button">Retry</button></div>
<div class="wrap" id="root">
  <div class="fatal" id="boot">Loading…</div>
</div>

<script>
(function () {
  'use strict';

  // The photo upload engine: one upload at a time, a timeout on every attempt,
  // retries after 3 s and 15 s, a pause when the server asks for one, and an
  // idempotency key so a retried photo is never stored twice. This page may
  // not load app code, so the block below is a COPY of the one the office app
  // loads (its photo-upload-queue module). test/photo-queue-parity.test.js
  // keeps the two identical: change both or neither.
  /* photo-queue core: begin */
  function photoQueueCore() {
    var HEIC_MESSAGE = "This photo is in HEIC format (High efficiency), which can't be opened here yet. Use Take photo, or set your camera to save photos as JPEG, then add it again.";
    var MB = 1024 * 1024;
    var MAX_EDGE = 2000;
    var SMALL_JPEG_BYTES = 1.5 * MB;
    var KEEP_ORIGINAL_MAX = 15 * MB;
    var EXIF_READ_BYTES = 256 * 1024;
    var JPEG_QUALITY = 0.85;
    var WORK_TIMEOUT_MS = 20000;
    var ATTEMPT_BASE_MS = 45000;
    var ATTEMPT_PER_MB_MS = 30000;
    var ATTEMPT_MAX_MS = 240000;
    var BACKOFF_MS = [3000, 15000];
    var MAX_ATTEMPTS = 3;
    var OFFLINE_RECHECK_MS = 15000;
    var PAUSE_DEFAULT_S = 30;
    var PAUSE_MIN_S = 1;
    var PAUSE_MAX_S = 300;

    function warn(what, err) {
      try {
        if (typeof console !== 'undefined' && console && typeof console.warn === 'function') console.warn('photo queue: ' + what, err);
      } catch (e) { /* nothing */ }
    }

    // ── Upload ids ────────────────────────────────────────────────────────
    // FNV-1a, 32 bit, written with shifts so it needs no Math.imul.
    function fnv1a(str, basis) {
      var h = basis >>> 0;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0;
      }
      return h >>> 0;
    }

    function hex8(n) {
      return ('0000000' + (n >>> 0).toString(16)).slice(-8);
    }

    // The same file picked again for the same target gives the same id, so a
    // retry, or a re-pick after a reload, is recognised by the server. A new
    // camera shot always differs in size or lastModified.
    function uploadIdFor(file, targetKey) {
      var f = file || {};
      var s = String(targetKey == null ? '' : targetKey) + '|' + String(f.name || '') + '|' +
        String(f.size == null ? '' : f.size) + '|' + String(f.lastModified == null ? '' : f.lastModified) + '|' +
        String(f.type || '');
      return 'u' + hex8(fnv1a(s, 0x811c9dc5)) + hex8(fnv1a(s, 0x050c5d1f));
    }

    // ── Bytes and EXIF ────────────────────────────────────────────────────
    function toBytes(buf) {
      if (!buf || typeof Uint8Array === 'undefined') return null;
      if (buf instanceof Uint8Array) return buf;
      if (Object.prototype.toString.call(buf) === '[object ArrayBuffer]') return new Uint8Array(buf);
      if (buf.buffer && typeof buf.byteLength === 'number') return new Uint8Array(buf.buffer, buf.byteOffset || 0, buf.byteLength);
      return null;
    }

    // The APP1 "Exif\0\0" segment of a JPEG: { start, end, truncated } or null.
    function findExifSegment(b) {
      if (!b || b.length < 4 || b[0] !== 0xFF || b[1] !== 0xD8) return null;
      var i = 2;
      while (i + 4 <= b.length) {
        if (b[i] !== 0xFF) return null;
        var marker = b[i + 1];
        if (marker === 0xFF) { i++; continue; }
        if (marker === 0x01 || (marker >= 0xD0 && marker <= 0xD8)) { i += 2; continue; }
        if (marker === 0xDA || marker === 0xD9) return null;
        var len = (b[i + 2] << 8) | b[i + 3];
        if (len < 2) return null;
        var end = i + 2 + len;
        if (marker === 0xE1 && len >= 8 && i + 10 <= b.length &&
            b[i + 4] === 0x45 && b[i + 5] === 0x78 && b[i + 6] === 0x69 && b[i + 7] === 0x66 &&
            b[i + 8] === 0 && b[i + 9] === 0) {
          return { start: i, end: end, truncated: end > b.length };
        }
        if (end > b.length) return null;
        i = end;
      }
      return null;
    }

    // Rewrites IFD0 Orientation to 1 inside a copied APP1 segment. The pixels
    // were drawn upright already, so a kept 6 or 8 would turn them again.
    // False when the TIFF header or IFD0 does not fit the segment.
    function resetOrientation(seg) {
      var t = 10;
      var little;
      if (seg.length < t + 8) return false;
      if (seg[t] === 0x49 && seg[t + 1] === 0x49) little = true;
      else if (seg[t] === 0x4D && seg[t + 1] === 0x4D) little = false;
      else return false;
      var u16 = function (p) {
        return little ? (seg[p] | (seg[p + 1] << 8)) : ((seg[p] << 8) | seg[p + 1]);
      };
      var u32 = function (p) {
        return little
          ? (seg[p] | (seg[p + 1] << 8) | (seg[p + 2] << 16)) + seg[p + 3] * 16777216
          : seg[p] * 16777216 + ((seg[p + 1] << 16) | (seg[p + 2] << 8) | seg[p + 3]);
      };
      if (u16(t + 2) !== 42) return false;
      var ifd = t + u32(t + 4);
      if (ifd + 2 > seg.length) return false;
      var count = u16(ifd);
      if (ifd + 2 + count * 12 > seg.length) return false;
      for (var k = 0; k < count; k++) {
        var e = ifd + 2 + k * 12;
        if (u16(e) === 0x0112) {
          if (little) { seg[e + 8] = 1; seg[e + 9] = 0; } else { seg[e + 8] = 0; seg[e + 9] = 1; }
          return true;
        }
      }
      return true;
    }

    // origBuf: the camera's JPEG (or its first bytes). newBuf: the re-encoded
    // JPEG. Returns the new JPEG with the camera's EXIF right after SOI and
    // Orientation reset to 1, or null when that cannot be done.
    function spliceExif(origBuf, newBuf) {
      var o = toBytes(origBuf);
      var n = toBytes(newBuf);
      if (!o || !n || n.length < 4 || n[0] !== 0xFF || n[1] !== 0xD8) return null;
      var seg = findExifSegment(o);
      if (!seg || seg.truncated) return null;
      var app1 = new Uint8Array(seg.end - seg.start);
      app1.set(o.subarray(seg.start, seg.end));
      if (!resetOrientation(app1)) return null;
      var out = new Uint8Array(n.length + app1.length);
      out[0] = 0xFF;
      out[1] = 0xD8;
      out.set(app1, 2);
      out.set(n.subarray(2), 2 + app1.length);
      return out;
    }

    // ── Preparing a photo ─────────────────────────────────────────────────
    function isHeic(file) {
      var type = String((file && file.type) || '');
      var name = String((file && file.name) || '');
      return /^image\/hei[cf]/i.test(type) || /\.(heic|heif)$/i.test(name);
    }

    var decodeSupport = null;
    // URL.createObjectURL is tested FIRST, so a page or test without it never
    // touches a canvas at all.
    function canDecode() {
      if (decodeSupport !== null) return decodeSupport;
      decodeSupport = false;
      try {
        if (typeof URL === 'undefined' || !URL || typeof URL.createObjectURL !== 'function') return decodeSupport;
        if (typeof document === 'undefined' || !document || typeof Image === 'undefined') return decodeSupport;
        var c = document.createElement('canvas');
        decodeSupport = !!(c && typeof c.getContext === 'function' && typeof c.toBlob === 'function' && c.getContext('2d'));
      } catch (e) {
        decodeSupport = false;
      }
      return decodeSupport;
    }

    // Runs start(ok, bad) and settles once, or rejects after ms.
    function timed(ms, start) {
      return new Promise(function (resolve, reject) {
        var settled = false;
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          reject(new Error('timed out'));
        }, ms);
        var ok = function (v) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(v);
        };
        var bad = function (e) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(e);
        };
        try { start(ok, bad); } catch (e) { bad(e); }
      });
    }

    function revokeUrl(url) {
      if (!url) return;
      try { URL.revokeObjectURL(url); } catch (e) { /* nothing */ }
    }

    function decodeImage(file) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      return timed(WORK_TIMEOUT_MS, function (ok, bad) {
        img.onload = function () { ok(img); };
        img.onerror = function () { bad(new Error('could not decode')); };
        img.src = url;
        if (typeof img.decode === 'function') {
          try { img.decode().then(function () { ok(img); }, function () { /* onerror decides */ }); } catch (e) { /* onload decides */ }
        }
      }).then(function (loaded) {
        revokeUrl(url);
        return loaded;
      }, function (err) {
        revokeUrl(url);
        throw err;
      });
    }

    function encodeJpeg(canvas) {
      return timed(WORK_TIMEOUT_MS, function (ok, bad) {
        canvas.toBlob(function (blob) {
          if (blob) ok(blob);
          else bad(new Error('could not encode'));
        }, 'image/jpeg', JPEG_QUALITY);
      });
    }

    function readBytes(blob) {
      if (blob && typeof blob.arrayBuffer === 'function') return blob.arrayBuffer();
      return new Promise(function (resolve, reject) {
        if (typeof FileReader === 'undefined') { reject(new Error('cannot read the photo')); return; }
        var fr = new FileReader();
        fr.onload = function () { resolve(fr.result); };
        fr.onerror = function () { reject(fr.error || new Error('cannot read the photo')); };
        fr.readAsArrayBuffer(blob);
      });
    }

    function namedJpeg(parts, name) {
      try {
        if (typeof File === 'function') return new File(parts, name, { type: 'image/jpeg' });
      } catch (e) { /* old browser: a Blob below */ }
      var b = new Blob(parts, { type: 'image/jpeg' });
      try { b.name = name; } catch (e2) { /* nothing */ }
      return b;
    }

    function jpegName(name) {
      var base = String(name || '').replace(/\.[^.\/\\]*$/, '');
      return (base || 'photo') + '.jpg';
    }

    // Resolves { blob, name, type, shrunk }. Rejects { permanent:true, message }
    // only for a HEIC photo this browser cannot turn into a JPEG.
    function prepareImage(file) {
      if (!file) return Promise.reject({ permanent: true, message: 'There was no photo to send.' });
      var type = String(file.type || '');
      var name = String(file.name || 'photo');
      var heic = isHeic(file);
      var isJpeg = /^image\/(jpeg|jpg|pjpeg)$/i.test(type);
      var original = function () { return { blob: file, name: name, type: type, shrunk: false }; };
      var refusal = function () { return { permanent: true, message: HEIC_MESSAGE }; };
      if ((!/^image\//i.test(type) && !heic) || /^image\/(gif|svg)/i.test(type)) return Promise.resolve(original());
      if (!canDecode()) return heic ? Promise.reject(refusal()) : Promise.resolve(original());
      var outName = jpegName(name);
      var shrunk = function (blob) {
        var named = (blob && blob.name === outName) ? blob : namedJpeg([blob], outName);
        return { blob: named, name: outName, type: 'image/jpeg', shrunk: true };
      };
      return decodeImage(file).then(function (img) {
        var w = img.naturalWidth || img.width || 0;
        var h = img.naturalHeight || img.height || 0;
        if (!w || !h) throw new Error('could not decode');
        var longest = Math.max(w, h);
        if (!heic && isJpeg && longest <= MAX_EDGE && file.size <= SMALL_JPEG_BYTES) return null;
        var scale = longest > MAX_EDGE ? MAX_EDGE / longest : 1;
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(w * scale));
        canvas.height = Math.max(1, Math.round(h * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        return encodeJpeg(canvas);
      }).then(function (jpeg) {
        if (!jpeg) return original();
        if (!heic && jpeg.size >= file.size) return original();
        if (!isJpeg) return shrunk(jpeg);
        var head = typeof file.slice === 'function' ? file.slice(0, EXIF_READ_BYTES) : file;
        var keepOriginal = function () {
          return file.size > KEEP_ORIGINAL_MAX ? shrunk(jpeg) : original();
        };
        return readBytes(head).then(function (origBuf) {
          var orig = toBytes(origBuf);
          if (!findExifSegment(orig)) return shrunk(jpeg);
          return readBytes(jpeg).then(function (nextBuf) {
            var spliced = spliceExif(orig, nextBuf);
            return spliced ? shrunk(namedJpeg([spliced], outName)) : keepOriginal();
          });
        }).then(null, keepOriginal);
      }, function () {
        if (heic) throw refusal();
        return original();
      });
    }

    // ── The queue ─────────────────────────────────────────────────────────
    function statusOf(err) {
      var s = Number(err && err.status);
      return (isFinite(s) && s > 0) ? s : 0;
    }

    function retryAfterOf(err) {
      if (!err) return null;
      if (err.retryAfter != null) return err.retryAfter;
      if (err.data && err.data.retryAfter != null) return err.data.retryAfter;
      return null;
    }

    function pauseSeconds(err) {
      var s = Number(retryAfterOf(err));
      if (!(s > 0)) s = PAUSE_DEFAULT_S;
      return Math.max(PAUSE_MIN_S, Math.min(PAUSE_MAX_S, s));
    }

    function messageOf(err) {
      if (err && err.message) return String(err.message);
      if (typeof err === 'string' && err) return err;
      return 'The upload failed.';
    }

    function isRetryable(status, err) {
      if (!status) return true;
      if (err && (err.name === 'TypeError' || err.name === 'AbortError')) return true;
      return status === 408 || status >= 500;
    }

    function isOffline() {
      return typeof navigator !== 'undefined' && !!navigator && navigator.onLine === false;
    }

    function toList(files) {
      var out = [];
      if (!files) return out;
      if (typeof files.length === 'number' && typeof files.size !== 'number') {
        for (var i = 0; i < files.length; i++) out.push(files[i]);
      } else {
        out.push(files);
      }
      return out;
    }

    function createQueue(opts) {
      opts = opts || {};
      var send = opts.send;
      var onChange = opts.onChange;
      var onIdle = opts.onIdle;
      var prepare = typeof opts.prepare === 'function' ? opts.prepare : prepareImage;
      var all = [];
      var nextId = 0;
      var active = null;
      var pausedUntil = 0;
      var offline = false;
      var offlineTimer = null;
      var wakeTimer = null;
      var wakeAt = 0;
      var skippedByKey = {};
      var wasBusy = false;
      var queue = null;

      function keyOf(target) {
        return String(target && typeof target === 'object' ? target.key : target);
      }

      function ofKey(key) {
        if (key == null) return all.slice();
        var k = String(key);
        var out = [];
        for (var i = 0; i < all.length; i++) if (all[i].key === k) out.push(all[i]);
        return out;
      }

      function inState(list, states) {
        var out = [];
        for (var i = 0; i < list.length; i++) if (states.indexOf(list[i].state) !== -1) out.push(list[i]);
        return out;
      }

      function busy() {
        return inState(all, ['preparing', 'waiting', 'uploading']).length > 0;
      }

      function unsettled() {
        return busy() || inState(all, ['failed']).length > 0;
      }

      function previewFor(blob) {
        try {
          if (typeof URL !== 'undefined' && URL && typeof URL.createObjectURL === 'function') return URL.createObjectURL(blob);
        } catch (e) { /* no preview */ }
        return null;
      }

      function dropPreview(item) {
        revokeUrl(item.previewUrl);
        item.previewUrl = null;
      }

      // Tells the page about each changed item, then whether the queue has
      // gone quiet.
      function touch(changed) {
        for (var i = 0; i < changed.length; i++) {
          if (typeof onChange === 'function') {
            try { onChange(changed[i], queue); } catch (e) { warn('onChange failed', e); }
          }
        }
        if (busy()) {
          wasBusy = true;
        } else if (wasBusy) {
          wasBusy = false;
          if (typeof onIdle === 'function') {
            try { onIdle(queue); } catch (e2) { warn('onIdle failed', e2); }
          }
        }
      }

      function kick() {
        Promise.resolve().then(pump);
      }

      function schedule(at) {
        if (wakeTimer && wakeAt <= at) return;
        if (wakeTimer) clearTimeout(wakeTimer);
        wakeAt = at;
        wakeTimer = setTimeout(function () {
          wakeTimer = null;
          wakeAt = 0;
          pump();
        }, Math.max(0, at - Date.now()));
      }

      function goOffline() {
        if (!offline) {
          offline = true;
          touch(inState(all, ['waiting']));
        }
        if (!offlineTimer) {
          offlineTimer = setTimeout(function () {
            offlineTimer = null;
            pump();
          }, OFFLINE_RECHECK_MS);
        }
      }

      function backOnline() {
        if (offlineTimer) { clearTimeout(offlineTimer); offlineTimer = null; }
        if (!offline) return;
        offline = false;
        touch(inState(all, ['waiting']));
      }

      function pump() {
        if (active) return;
        var now = Date.now();
        if (pausedUntil > now) { schedule(pausedUntil); return; }
        if (pausedUntil) {
          pausedUntil = 0;
          touch(inState(all, ['waiting']));
        }
        var next = null;
        var soonest = 0;
        for (var i = 0; i < all.length; i++) {
          var it = all[i];
          if (it.state !== 'waiting') continue;
          if (it.retryAt <= now) { next = it; break; }
          if (!soonest || it.retryAt < soonest) soonest = it.retryAt;
        }
        if (!next) {
          if (soonest) schedule(soonest);
          touch([]);
          return;
        }
        if (isOffline()) { goOffline(); return; }
        backOnline();
        run(next);

  function hasDraft() {
    if (drafts.note || drafts.scope) return true;
    for (var k in drafts.bnotes) {
      if (Object.prototype.hasOwnProperty.call(drafts.bnotes, k) && drafts.bnotes[k]) return true;
    }
    for (var f in drafts.flags) {
      if (Object.prototype.hasOwnProperty.call(drafts.flags, f)) return true;
    }
    if (tmTyped('labor') || tmTyped('material')) return true;
    return false;
  }

  function persistDrafts() {
    if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; }
    if (!alive()) return;
    try {
      if (!hasDraft()) {
        localStorage.removeItem(DRAFT_KEY);
      } else {
        drafts.at = Date.now();
        localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts));
      }
    } catch (e) { /* storage full or blocked: the draft still lives on the page */ }
  }

  function saveDraftSoon() {
    if (draftTimer) clearTimeout(draftTimer);
    draftTimer = setTimeout(persistDrafts, 400);
  }

  // ONE key per UNSENT note, minted on the first send and kept beside the
  // draft, so a reload keeps it. Whatever a bad signal does — an answer that
  // never arrives, a tab that dies mid-save — every retry carries the same key
  // and the note doors append the crew's note once. A fresh key is minted only
  // after a save that was confirmed.
  function noteRef() {
    if (!drafts.noteRef) { drafts.noteRef = newClientRef(); saveDraftSoon(); }
    return drafts.noteRef;
  }

  function bnoteRef(id) {
    if (!drafts.bnoteRefs[id]) { drafts.bnoteRefs[id] = newClientRef(); saveDraftSoon(); }
    return drafts.bnoteRefs[id];
  }

  var drafts = readDrafts();
  // Restored from an earlier visit: the box says so until it is edited or sent,
  // and a building with a restored note opens on the first draw.
  var restored = { note: !!drafts.note, scope: !!drafts.scope, bnotes: {} };
  (function () {
    for (var k in drafts.bnotes) {
      if (Object.prototype.hasOwnProperty.call(drafts.bnotes, k)) {
        restored.bnotes[k] = true;
        openCards[k] = true;
      }
    }
    // A problem being written reopens as it was left, its building open.
    for (var fk in drafts.flags) {
      if (!Object.prototype.hasOwnProperty.call(drafts.flags, fk)) continue;
      var key = fk.slice('flag:'.length);
      var fd = drafts.flags[fk];
      flagForms[key] = newFlagForm({ category: fd.category, note: fd.note, clientRef: fd.client_ref, restored: true });
      var tid = taskIdOfKey(key);
      if (tid != null) openCards[tid] = true;
    }
  })();

  function restoredHint(field, on) {
    return on ? '<div class="hint restored" data-for="' + esc(field) + '">' + esc(RESTORED_HINT) + '</div>' : '';
  }

  function dropHint(field) {
    Array.prototype.forEach.call(root.querySelectorAll('.restored'), function (el) {
      if (el.getAttribute('data-for') === field && el.parentNode) el.parentNode.removeChild(el);
    });
  }

  // ── Talking to the server ─────────────────────────────────────────────
  // Every answer is read as text (a proxy's HTML error page is not JSON). A
  // refusal throws the server's own words, with the status and any wait the
  // server asked for stamped on the error, so a caller can tell a dead link
  // from a bad signal.
  function retryAfterOf(r, data) {
    var h = null;
    try { h = r.headers && typeof r.headers.get === 'function' ? r.headers.get('Retry-After') : null; } catch (e) { h = null; }
    var n = Number(h);
    if (n > 0) return n;
    n = Number(data && data.retryAfter);
    return n > 0 ? n : null;
  }

  function readJSON(r, fallback) {
    return r.text().then(function (txt) {
      var data = null;
      try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
      try {
        // The server's refusals ARE the message. A 403 here means the office
        // changed the link or the work order moved on — say that, do not
        // pretend it worked.
        if (!r.ok) throw new Error((data && data.error) || fallback);
      } catch (err) {
        err.status = r.status;
        err.data = data;
        err.retryAfter = retryAfterOf(r, data);
        throw err;
      }
      return data;
    });
  }

  // What a crew member reads when a save does not come back. A REFUSAL is the
  // server's own words (an approved work order, a revoked link, "This work
  // order just changed.") and readJSON stamps err.status on every one of them.
  // No answer at all has no status: the browser's own string ("Failed to
  // fetch", iOS "Load failed") reads as the PAGE failing and says nothing a
  // crew member on one bar of signal can act on, so this one sentence stands in
  // for it everywhere the page saves.
  var NO_ANSWER = "Couldn't send that. Check your signal and try again.";

  function saveError(e) {
    return e && e.status ? e.message : NO_ANSWER;
  }

  function waitSecondsOf(err) {
    var n = Number(err && err.retryAfter);
    if (!(n > 0)) n = 30;
    return Math.max(1, Math.min(300, Math.ceil(n)));
  }

  function isOffline() {
    return typeof navigator !== 'undefined' && !!navigator && navigator.onLine === false;
  }

  // ── The bar at the top ────────────────────────────────────────────────
  var netbarOpts = null;
  var netTimer = null;
  var wiredBy = {};

  function netbarEl() {
    var el = document.getElementById('netbar');
    if (!el && root && root.parentNode) {
      el = document.createElement('div');
      el.id = 'netbar';
      el.className = 'netbar';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      el.hidden = true;
      el.innerHTML = '<span></span><button type="button">Retry</button>';
      root.parentNode.insertBefore(el, root);
    }
    if (el && el.__stWiredBy !== wiredBy) {
      el.__stWiredBy = wiredBy;
      el.addEventListener('click', function () { if (alive()) retryNow(); });
    }
    return el;
  }

  function showNetbar(text) {
    var el = netbarEl();
    if (!el) return;
    el.querySelector('span').textContent = text;
    el.hidden = false;
  }

  function hideNetbar() {
    var el = document.getElementById('netbar');
    if (el) el.hidden = true;
    netbarOpts = null;
    if (netTimer) { clearTimeout(netTimer); netTimer = null; }
  }

  function netbarShown() {
    var el = document.getElementById('netbar');
    return !!el && !el.hidden;
  }

  function retryNow() {
    var opts = netbarOpts || {};
    if (netTimer) { clearTimeout(netTimer); netTimer = null; }
    var el = document.getElementById('netbar');
    if (el && !el.hidden) el.querySelector('span').textContent = 'Refreshing…';
    load(opts);
  }

  // ── Loading ───────────────────────────────────────────────────────────
  // One read at a time. A call that arrives while a read is out runs once
  // more after it (a save that finished meanwhile is not in the first answer).
  var loading = null;
  var loadAgain = null;
  var loadCount = 0;

  function load(opts) {
    opts = opts || {};
    if (!alive()) return Promise.resolve();
    if (loading) {
      loadAgain = loadAgain || {};
      if (opts.after) loadAgain.after = opts.after;
      return loading;
    }
    if (netTimer) { clearTimeout(netTimer); netTimer = null; }
    loading = fetch('/api/service-ticket-share/' + encodeURIComponent(token), {
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    }).then(function (r) {
      // The server's failure strings ARE the guest UI. They say what
      // happened without revealing whether a token ever existed.
      return readJSON(r, 'This link could not be opened.');
    }).then(function (d) {
      if (!d || !d.ticket) {
        var empty = new Error('This link could not be opened.');
        empty.status = 0;
        throw empty;
      }
      if (!alive()) return;
      loadCount++;
      hideNetbar();
      document.title = (d.ticket.title || 'Work Order');
      render(d);
    }).catch(function (e) {
      if (alive()) loadFailed(e, opts);
    }).then(function () {
      loading = null;
      var again = loadAgain;
      loadAgain = null;
      if (again && alive()) load(again);
    });
    return loading;
  }

  // A read that failed. Only a link that no longer works (404, 410) replaces
  // a page the crew is already using; anything else keeps the page as it was
  // and says so at the top.
  function loadFailed(e, opts) {
    var status = Number(e && e.status) || 0;
    var message = (e && e.message) || 'This link could not be opened.';
    if (!rendered) {
      if (status >= 400 && status < 500 && status !== 408 && status !== 429) {
        fatal(message);
        return;
      }
      fatal("Couldn't load this work order.", {
        retry: true,
        detail: 'Check your signal and try again.',
        waitSeconds: status === 429 ? waitSecondsOf(e) : 0
      });
      return;
    }
    if (status === 404 || status === 410) {
      persistDrafts();
      fatal(message);
      return;
    }
    var saved = opts.after === 'saved';
    netbarOpts = { after: opts.after };
    if (status === 429) {
      var wait = waitSecondsOf(e);
      showNetbar((saved ? 'Saved. ' : '') + 'The server is busy — refreshing in ' + wait + ' s.');
      netTimer = setTimeout(function () {
        netTimer = null;
        if (alive()) load(netbarOpts || {});
      }, wait * 1000);
      return;
    }
    if (isOffline() && hasDraft()) {
      showNetbar('No signal. What you type is kept on this phone.');
      return;
    }
    showNetbar(saved ? "Saved. Couldn't refresh — tap to retry." : "Couldn't refresh — tap to retry.");
  }

  // ── Focus and scroll survive a redraw ─────────────────────────────────
  function captureView() {
    var v = { id: null, task: null, flag: null, tm: null, start: null, end: null, y: 0 };
    try { v.y = window.pageYOffset || (document.documentElement && document.documentElement.scrollTop) || 0; } catch (e) { v.y = 0; }
    var a = document.activeElement;
    if (a && a !== document.body && root.contains(a)) {
      if (a.id === 'note' || a.id === 'scope' || a.id === 'crewname') v.id = a.id;
      else if (a.classList && a.classList.contains('bnote-in')) v.task = a.getAttribute('data-task');
      else if (a.classList && a.classList.contains('flag-note')) v.flag = a.getAttribute('data-flag-key');
      else if (a.classList && a.classList.contains('tm-in')) v.tm = a.getAttribute('data-tm');
      try { v.start = a.selectionStart; v.end = a.selectionEnd; } catch (e2) { v.start = null; }
    }
    return v;
  }

  function bnoteInput(taskId) {
    var list = root.querySelectorAll('.bnote-in');
    for (var i = 0; i < list.length; i++) {
      if (list[i].getAttribute('data-task') === String(taskId)) return list[i];
    }
    return null;
  }

  function byFlagKey(selector, key) {
    var list = root.querySelectorAll(selector);
    for (var i = 0; i < list.length; i++) {
      if (list[i].getAttribute('data-flag-key') === String(key)) return list[i];
    }
    return null;
  }

  function restoreView(v) {
    var el = v.id ? document.getElementById(v.id)
      : v.task != null ? bnoteInput(v.task)
        : v.flag != null ? byFlagKey('.flag-note', v.flag)
          : v.tm != null ? tmInput(v.tm) : null;
    if (el && typeof el.focus === 'function') {
      try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) { /* nothing */ } }
      if (v.start != null) {
        try { el.setSelectionRange(v.start, v.end == null ? v.start : v.end); } catch (e3) { /* not a text box */ }
      }
    }
    try {
      var y = window.pageYOffset || (document.documentElement && document.documentElement.scrollTop) || 0;
      if (v.y && y !== v.y && typeof window.scrollTo === 'function') window.scrollTo(0, v.y);
    } catch (e4) { /* nothing */ }
  }

  function render(d) {
    lastData = d;
    var t = d.ticket || {};
    var tasks = d.tasks || [];
    var done = tasks.filter(function (x) { return x.done; }).length;
    var at = LINE.indexOf(t.status);
    var sitePhotos = Array.isArray(d.site_photos) ? d.site_photos : [];

    serverIds = {};
    tasks.forEach(function (x) {
      (x.photos || []).forEach(function (ph) { if (ph && ph.id != null) serverIds[String(ph.id)] = true; });
    });
    sitePhotos.forEach(function (ph) { if (ph && ph.id != null) serverIds[String(ph.id)] = true; });
    skipFresh = {};

    // Problems raised through a link: on a building still on the punch list,
    // or on the whole work order (a building the server no longer lists
    // counts as the whole work order).
    var liveTask = {};
    tasks.forEach(function (x) { liveTask[String(x.id)] = true; });
    flagsByTask = {};
    ticketFlags = [];
    (Array.isArray(d.flags) ? d.flags : []).forEach(function (f) {
      if (!f || f.id == null) return;
      (f.photos || []).forEach(function (ph) { if (ph && ph.id != null) serverIds[String(ph.id)] = true; });
      var tid = f.task_id != null && liveTask[String(f.task_id)] ? String(f.task_id) : null;
      if (tid == null) ticketFlags.push(f);
      else (flagsByTask[tid] = flagsByTask[tid] || []).push(f);
    });

    // The buildings the office reopened when it sent the work back.
    sentBackIds = {};
    (d.send_back && Array.isArray(d.send_back.buildings) ? d.send_back.buildings : []).forEach(function (b) {
      if (b && b.id != null) sentBackIds[String(b.id)] = true;
    });

    var addr = [t.street_address, t.city, t.state, t.zip].filter(Boolean).join(', ');
    var mapHref = addr ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr) : '';

    var html = '';
    html += '<header>' +
      (d.org_name ? '<div class="org">' + esc(d.org_name) + '</div>' : '') +
      '<h1>' + esc(t.title || 'Work order') + '</h1>' +
      ((t.ticket_number || d.parent_label)
        ? '<div class="hmeta">' +
            (t.ticket_number ? '<span class="num">' + esc(t.ticket_number) + '</span>' : '') +
            (t.ticket_number && d.parent_label ? ' · ' : '') +
            // The forward-facing name of the parent — a lead title or a job
            // number and title, resolved server-side. Never a raw id.
            (d.parent_label ? '<span class="parent">' + esc(d.parent_label) + '</span>' : '') +
          '</div>'
        : '') +
    '</header>';

    if (t.status === 'cancelled') {
      html += '<div class="card" style="border-color:var(--red);color:var(--red);margin-top:12px;">This work order was cancelled.</div>';
    } else {
      html += '<div class="stepper">' + LINE.map(function (s, i) {
        return '<span class="step' + (i <= at ? ' done' : '') + (i === at ? ' at' : '') + '">' +
          esc(STATUS_LABEL[s]) + '</span>';
      }).join('') + '</div>';
    }

    // The office sent the work back: why, and which buildings to redo, at the
    // top of every link until the work order next reaches Work complete.
    if (d.send_back && d.send_back.note) html += sentBackHTML(d.send_back);

    // The write half is decided up here because the punch list below uses it
    // too. Rendered ONLY when the server said this link may respond — and the
    // server re-derives that from the stored row on every request, so hiding a
    // control here is a courtesy, never the permission. A view-only link
    // renders no control at all.
    var canRespond = d.share && (d.share.scope === 'respond' || d.share.scope === 'propose');
    var live = t.status !== 'closed' && t.status !== 'cancelled' && t.status !== 'approved';
    // Subtasks also refuse a draft — the office has not released it yet.
    var canWork = canRespond && live && t.status !== 'draft';
    lastCanWork = !!canWork;

    // Where the work is, and one tap to get there or to call the PM.
    var site = d.site || {};
    var siteAddr = site.address || addr;
    var hasCoord = site.lat != null && site.lng != null && isFinite(Number(site.lat)) && isFinite(Number(site.lng));
    var navHref = hasCoord
      ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(Number(site.lat) + ',' + Number(site.lng))
      : (siteAddr ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(siteAddr) : '');
    var contact = d.contact || null;
    var phone = contact && contact.phone ? String(contact.phone).replace(/[^0-9+]/g, '') : '';
    if (site.job_number || site.name || siteAddr || site.gate_code || phone) {
      // The mock's site card: job number, job name, the address on two lines
      // (street, then city) and one full-width Navigate under it.
      var comma = siteAddr ? siteAddr.indexOf(', ') : -1;
      html += '<div class="card site">' +
        (site.job_number ? '<div class="site-num">' + esc(site.job_number) + '</div>' : '') +
        (site.name ? '<div class="site-name">' + esc(site.name) + '</div>' : '') +
        (siteAddr
          ? '<div class="site-addr">' + (comma > 0
              ? esc(siteAddr.slice(0, comma)) + '<br>' + esc(siteAddr.slice(comma + 2))
              : esc(siteAddr)) + '</div>'
          : '') +
        (navHref || phone
          ? '<div class="actions">' +
              (navHref ? '<a class="btn primary" href="' + esc(navHref) + '" target="_blank" rel="noreferrer noopener"><span class="pin" aria-hidden="true"></span>Navigate</a>' : '') +
              (phone ? '<a class="btn" href="tel:' + esc(phone) + '">Call ' + esc(contact.name || 'the project manager') + '</a>' : '') +
            '</div>'
          : '') +
        (site.gate_code ? '<div class="gate">Gate code <b>' + esc(site.gate_code) + '</b></div>' : '') +
      '</div>';
    }

    // 'propose' is the ONLY scope that turns the scope of work into an editable
    // box — and even then the box does not change the work order. What Save
    // sends is a PROPOSAL that a person at the office accepts or rejects.
    var canPropose = d.share && d.share.scope === 'propose' &&
      t.status !== 'closed' && t.status !== 'cancelled';

    // A scope draft that reads the same as the server's scope is no draft.
    if (drafts.scope && drafts.scope === (t.scope_proposed || '')) {
      drafts.scope = '';
      restored.scope = false;
      saveDraftSoon();
    }

    html += '<div class="card">' +
      '<div class="lbl">Scope of work</div>' +
      (canPropose
        ? '<textarea id="scope" rows="6" placeholder="Describe what the work should be.">' +
            esc(drafts.scope || t.scope_proposed || '') + '</textarea>' +
          restoredHint('scope', restored.scope && !!drafts.scope) +
          '<div class="row"><button id="propose">Send revision</button></div>' +
          '<div class="note propose-note">Your changes go to the office for approval — ' +
            'the work order is not changed until they accept.</div>' +
          '<div id="pmsg" class="msg"></div>'
        : t.scope_proposed
          ? '<div class="scope">' + esc(t.scope_proposed) + '</div>'
          : '<div class="muted">No scope has been written yet.</div>') +
      // Only present when the sender chose to reveal financial detail; the
      // server omits the field entirely otherwise, so this cannot render an
      // empty labelled box.
      (t.scope_approved
        ? '<div class="lbl" style="margin-top:14px;">Approved scope</div><div class="scope">' + esc(t.scope_approved) + '</div>'
        : '') +
    '</div>';

    var metas = '';
    function meta(k, v) { if (v) metas += '<div class="meta"><span class="meta-k">' + esc(k) + '</span><span class="meta-v">' + v + '</span></div>'; }
    meta('Status', esc(STATUS_LABEL[t.status] || t.status || ''));
    meta('Scheduled', esc(fmtDate(t.scheduled_for)));
    meta('Due', esc(fmtDate(t.due_date)));
    meta('Site contact', esc(t.site_contact_name || ''));
    meta('Phone', t.site_contact_phone ? '<a href="tel:' + esc(String(t.site_contact_phone).replace(/[^0-9+]/g, '')) + '">' + esc(t.site_contact_phone) + '</a>' : '');
    if (!siteAddr) meta('Address', addr ? '<a href="' + esc(mapHref) + '" target="_blank" rel="noreferrer noopener">' + esc(addr) + '</a>' : '');
    // The gate code is shown big above; the access note only repeats when it
    // says something more than the code.
    if (t.access_notes && t.access_notes !== site.gate_code) meta('Access', esc(t.access_notes));
    if (metas) html += '<div class="card">' + metas + '</div>';

    // Materials — only when the office attached a list. Quantities, never prices.
    var mats = Array.isArray(t.materials) ? t.materials : [];
    if (mats.length) {
      // What to bring on the left; how many (and of what unit) in a small box
      // on the right, the way the mock reads. A line with neither gets no box.
      html += '<div class="card"><div class="lbl">Materials</div><ul class="mats">' +
        mats.map(function (m) {
          var q = m.qty ? esc(m.qty) : '';
          var u = m.unit ? '<span class="mat-u">' + esc(m.unit) + '</span>' : '';
          return '<li class="mat"><span class="mat-d">' + esc(m.description || '') + '</span>' +
            (q || u ? '<span class="mat-q">' + q + (q && u ? ' ' : '') + u + '</span>' : '') + '</li>';
        }).join('') + '</ul></div>';
    }

    // The takeoff file — present only when the office chose one AND the server
    // decided this link may see it, and in what form. The page never decides
    // that: on a link that hides financials a spreadsheet arrives as the
    // price-free copy (takeoff.copy) or not at all, and the file door serves
    // the same answer. The link goes through the token, never
    // a storage URL, so revoking the link stops the file with it.
    if (d.takeoff && d.takeoff.filename) {
      html += '<div class="card">' + takeoffHTML(d.takeoff) + '</div>';
    }

    // Who is doing the work — asked once, above everything that records a name.
    if (canRespond && live && !d.share.recipient_name) {
      html += '<div class="card"><div class="lbl">Your name</div>' +
        '<input type="text" id="crewname" placeholder="So the office knows who finished what" maxlength="120" value="' + esc(crewName) + '" />' +
      '</div>';
    }

    if (tasks.length) {
      html += '<div class="card"><div class="lbl">Punch list · ' + done + ' of ' + tasks.length + ' done</div>' +
        '<div class="bar"><i style="width:' + Math.round((done / tasks.length) * 100) + '%"></i></div>' +
        '<div class="tap">Tap a building to open it.</div>' +
      '</div>' +
      tasks.map(function (x) { return buildingHTML(x, canWork, t); }).join('') +
      (t.status === 'approved'
        ? '<div class="hint">The office approved this work. Ask them to reopen it for changes.</div>'
        : '');
    }

    // Time and materials (Phase 3) — the server sends field_capture only on a
    // work order billed after the work, and only the lines THIS link sent.
    // Above Finish, because on such a work order Finish needs it.
    var fcap = d.field_capture && d.field_capture.on ? d.field_capture : null;
    if (fcap && (canWork || (fcap.labor || []).length || (fcap.materials || []).length)) {
      html += timeCardHTML(fcap, tasks, canWork);
    }

    // Finishing the whole work order, under the punch list it depends on.
    if (canWork) html += finishCardHTML(d, t, tasks, done);
    else finishOpen = false;

    // Problems for the office: the ones raised on the whole work order, which
    // buildings are waiting on the office, and Flag a problem when this link
    // can work.
    if (canWork || ticketFlags.length) html += problemsCardHTML(tasks, canWork);

    if (t.guest_log) {
      html += '<div class="card"><div class="lbl">Field log</div><div class="log">' + esc(t.guest_log) + '</div></div>';
    }

    // Photos added under the field report (by any link, or the office), for
    // every link that can see the work order. Newest first, as the server
    // sends them; who added each one and when is on the picture.
    if (sitePhotos.length) {
      html += '<div class="card" id="siteShots"><div class="lbl">Site photos · ' + sitePhotos.length + '</div>' +
        '<div class="shots">' + sitePhotos.map(function (ph) {
          var when = fmtWhen(ph.uploaded_at);
          var alt = 'Photo' + (ph.by ? ' by ' + ph.by : '') + (when ? ', ' + when : '');
          return '<a class="shot" href="' + esc(ph.web_url || ph.thumb_url || '') + '" target="_blank" rel="noreferrer noopener">' +
            '<img src="' + esc(ph.thumb_url || ph.web_url || '') + '" alt="' + esc(alt) + '" loading="lazy" /></a>';
        }).join('') + '</div></div>';
    }

    var reportTiles = canRespond && live ? reportTilesHTML() : '';
    if (canRespond && live) {
      html += '<div class="card" id="report">' +
        '<div class="lbl">Your field report</div>' +
        (d.share.recipient_name
          ? '<div class="who">Signed in as <strong>' + esc(d.share.recipient_name) + '</strong></div>'
          : '') +
        '<textarea id="note" rows="3" placeholder="What did you find? What did you do?">' + esc(drafts.note) + '</textarea>' +
        restoredHint('note', restored.note && !!drafts.note) +
        // Take photo opens the camera (capture="environment"); Upload photo
        // the photo library, which on Android offers no camera. Both are
        // labels around their inputs, so they take a tabindex and a role and
        // wireReport lets Enter or Space open them. A photo goes up the
        // moment it is picked, not when the report is saved.
        '<div class="row">' +
          '<label class="file cam-file" tabindex="0" role="button">' + CAM_ICON(16) +
            'Take photo<input type="file" id="photoCam" accept="image/*" capture="environment" /></label>' +
          '<label class="file" tabindex="0" role="button"><input type="file" id="photo" accept="image/*" multiple />Upload photo</label>' +
          '<button id="save">Save report</button>' +
        '</div>' +
        '<div class="shots" id="rshots"' + (reportTiles ? '' : ' hidden') + '>' + reportTiles + '</div>' +
        upqElHTML('site', 'rupq') +
        '<div id="msg" class="msg"></div>' +
      '</div>';
    }

    html += '<div class="note">' +
      (canRespond && live
        ? 'Notes and photos you add are recorded against this work order with your name. ' +
          'The scope itself is set by the office.'
        : 'This is a read-only view of the work order. It stays up to date — reload to see the latest.') +
      (d.share && d.share.expires_at ? ' This link expires ' + esc(fmtDate(d.share.expires_at)) + '.' : '') +
      '</div>';

    var view = captureView();
    root.innerHTML = html;
    rendered = true;

    // Bring the current step into view inside the one-row stepper. Only the
    // ROW's scrollLeft moves: scrollIntoView would also scroll the page, and
    // render() runs again after every photo and note, so a crew member halfway
    // down the punch list would be thrown back to the top each time.
    var stepRow = root.querySelector('.stepper');
    var atStep = stepRow && stepRow.querySelector('.step.at');
    if (atStep && stepRow.scrollWidth > stepRow.clientWidth) {
      stepRow.scrollLeft = Math.max(0, atStep.offsetLeft - (stepRow.clientWidth - atStep.offsetWidth) / 2);
    }

    var nameBox = document.getElementById('crewname');
    if (nameBox) nameBox.addEventListener('input', function () {
      crewName = nameBox.value;
      try { localStorage.setItem('st-crew-name', crewName); } catch (e) {}
    });
    wireBuildings(tasks, canWork);
    wireFlagPhotoInputs(root);
    if (canRespond && live) wireReport(d);
    if (canWork) wireFinish(d);
    if (fcap && canWork) wireTimeCard();
    if (canPropose) wirePropose(d, t);
    restoreView(view);
  }

  // ── Time and materials (Phase 3) ──────────────────────────────────────
  //
  // Only on a work order billed after the work: the office bills it from the
  // time worked, what was done and what was used, so it is asked of the
  // people who were there. Everything sent is a CLAIM — it goes to the office,
  // which accepts it, corrects it or turns it down, and the work order itself
  // does not change. This page shows the lines THIS link sent and a word for
  // where each one stands. It never shows the office's numbers, its notes, or
  // a total of anything.
  var TM_STATUS = {
    sent: { text: 'Sent to the office', cls: '' },
    accepted: { text: 'Accepted', cls: 'ok' },
    changed: { text: 'Changed by the office', cls: '' },
    not_accepted: { text: 'Not accepted', cls: 'no' }
  };
  var tmBusy = { labor: false, material: false };
  var tmNote = { labor: null, material: null };

  function localToday() {
    var n = new Date();
    return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2);
  }

  function tmValue(kind, key) {
    var t = (drafts.tm && drafts.tm[kind]) || {};
    if (t[key] != null && t[key] !== '') return t[key];
    if (kind === 'labor' && key === 'work_date') return localToday();
    if (kind === 'labor' && key === 'crew_size') return '1';
    return '';
  }

  function tmInput(key) {
    var list = root.querySelectorAll('.tm-in');
    for (var i = 0; i < list.length; i++) {
      if (list[i].getAttribute('data-tm') === String(key)) return list[i];
    }
    return null;
  }

  // ONE key per unsent line, kept beside the draft, so a retry after a lost
  // answer stores the line once. A new key only after a confirmed send.
  function tmRef(kind) {
    if (!drafts.tm[kind].client_ref) { drafts.tm[kind].client_ref = newClientRef(); saveDraftSoon(); }
    return drafts.tm[kind].client_ref;
  }

  function tmBuildingSelect(kind, tasks) {
    if (!tasks.length) return '';
    var cur = tmValue(kind, 'task_id');
    return '<label>Building' +
      '<select class="tm-in" data-tm="' + kind + '.task_id">' +
        '<option value=""' + (cur ? '' : ' selected') + '>The whole work order</option>' +
        tasks.map(function (x) {
          var id = String(x.id);
          return '<option value="' + esc(id) + '"' + (cur === id ? ' selected' : '') + '>' + esc(parseTitle(x.title).head) + '</option>';
        }).join('') +
      '</select></label>';
  }

  function tmLineHTML(kind, l, byTask) {
    var st = TM_STATUS[l.status] || TM_STATUS.sent;
    var where = l.task_id != null && byTask[String(l.task_id)] ? byTask[String(l.task_id)] : 'Whole work order';
    var head, body;
    if (kind === 'labor') {
      var people = Number(l.crew_size) === 1 ? '1 person' : (l.crew_size + ' people');
      head = esc(fmtDate(l.work_date)) + ' · ' + esc(people) + ' · ' + esc(String(l.hours)) + ' h on site';
      body = l.work_performed || '';
    } else {
      // A material leads with WHAT it was; how much and where sit under it.
      return '<div class="tm-line">' +
        '<div class="tm-line-h"><span class="tm-line-what">' + esc(l.description || '') + '</span>' +
          '<span class="tm-st' + (st.cls ? ' ' + st.cls : '') + '">' + esc(st.text) + '</span></div>' +
        '<div class="tm-line-n">' + esc(String(l.quantity)) + (l.unit ? ' ' + esc(l.unit) : '') + ' · ' + esc(where) + '</div>' +
      '</div>';
    }
    return '<div class="tm-line">' +
      '<div class="tm-line-h"><span>' + head + ' · ' + esc(where) + '</span>' +
        '<span class="tm-st' + (st.cls ? ' ' + st.cls : '') + '">' + esc(st.text) + '</span></div>' +
      (body ? '<div class="tm-line-n">' + esc(body) + '</div>' : '') +
    '</div>';
  }

  function timeCardHTML(fcap, tasks, canWork) {
    var byTask = {};
    tasks.forEach(function (x) { byTask[String(x.id)] = parseTitle(x.title).head; });
    var labor = Array.isArray(fcap.labor) ? fcap.labor : [];
    var mats = Array.isArray(fcap.materials) ? fcap.materials : [];
    var off = function (kind) { return tmBusy[kind] ? ' disabled' : ''; };
    var html = '<div class="card" id="tmCard"><div class="lbl">Time and materials</div>';
    if (canWork) {
      html += '<div class="hint tm-why">This work order is billed from the time worked and what was used. ' +
        'Send yours before you finish — the office checks every line.</div>' +
        '<div class="tm-form" data-kind="labor">' +
          '<div class="tm-h">Time</div>' +
          '<div class="tm-grid">' +
            '<label>Day<input type="date" class="tm-in" data-tm="labor.work_date" value="' + esc(tmValue('labor', 'work_date')) + '"' + off('labor') + ' /></label>' +
            '<label>People<input type="number" inputmode="numeric" min="1" max="50" step="1" class="tm-in" data-tm="labor.crew_size" value="' + esc(tmValue('labor', 'crew_size')) + '"' + off('labor') + ' /></label>' +
            '<label>Hours on site<input type="text" inputmode="decimal" placeholder="6.5" class="tm-in" data-tm="labor.hours" value="' + esc(tmValue('labor', 'hours')) + '"' + off('labor') + ' /></label>' +
          '</div>' +
          tmBuildingSelect('labor', tasks) +
          '<label>What was done<textarea rows="3" maxlength="2000" class="tm-in" data-tm="labor.work_performed" ' +
            'placeholder="What did you do? The office bills from this."' + off('labor') + '>' + esc(tmValue('labor', 'work_performed')) + '</textarea></label>' +
          '<button type="button" class="btn primary tm-send" data-kind="labor"' + off('labor') + '>Send time</button>' +
          '<div class="msg" id="tmMsg-labor">' + (tmNote.labor ? esc(tmNote.labor.text) : '') + '</div>' +
        '</div>' +
        '<div class="tm-form" data-kind="material">' +
          '<div class="tm-h">Material used</div>' +
          '<label>What was it<input type="text" maxlength="200" class="tm-in" data-tm="material.description" placeholder="For example: 2&quot; PVC check valve" value="' + esc(tmValue('material', 'description')) + '"' + off('material') + ' /></label>' +
          '<div class="tm-grid two">' +
            '<label>How many<input type="text" inputmode="decimal" placeholder="1" class="tm-in" data-tm="material.quantity" value="' + esc(tmValue('material', 'quantity')) + '"' + off('material') + ' /></label>' +
            '<label>Unit<input type="text" maxlength="30" placeholder="ea, ft, gal" class="tm-in" data-tm="material.unit" value="' + esc(tmValue('material', 'unit')) + '"' + off('material') + ' /></label>' +
          '</div>' +
          tmBuildingSelect('material', tasks) +
          '<button type="button" class="btn primary tm-send" data-kind="material"' + off('material') + '>Send material</button>' +
