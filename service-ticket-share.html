<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Work Order</title>

<!-- This URL carries a CREDENTIAL in its path. The server sets these as
     headers too; they are repeated here so the page is correct even if it is
     ever served another way. -->
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />

<!--
  ══════════════════════════════════════════════════════════════════════════
  SERVICE TICKET — the public work-order page.

  THE HOUSE RULE: a guest surface COPIES the app's markup, classes and tokens
  and NEVER links the app's code. Every real renderer in the SPA takes an id
  and reaches for app state itself, so loading one onto a page outside the app
  drags the whole app in behind it — along with its auth assumptions.

  This file therefore links ZERO scripts and ZERO stylesheets. Everything is
  inline. js/report-document.js is the ONE sanctioned exception in this repo
  and it earned that by being provably pure; nothing here needs it.

  WRITE CONTROLS ARE GATED ON THE SERVER'S ANSWER, NEVER ON THIS PAGE.
  The field-report card renders only when the read returned scope 'respond'
  (or better) and the work order is still live. That gate is a COURTESY: the
  server re-derives the scope from the stored share row on every single
  request, so hiding a box here changes nothing about what is permitted. A
  view-only link renders no control at all, and a link whose scope is later
  narrowed stops working immediately whatever this page last drew.

  What a guest may write is a CLOSED SET of four keys — name, checklist,
  note, status — and the server NAMES each one rather than looping over the
  body, so a column added to service_tickets later cannot become writable by
  a stranger just because it exists. 'propose' (editing the scope itself,
  landing as a pending revision) arrives with its door in S6.
  ══════════════════════════════════════════════════════════════════════════
-->

<style>
  /* The crew's phone first: a 390px screen in a truck, often in sun, one
     thumb. Tokens follow the approved work-order mock (dark is the default,
     light re-derives the same roles). */
  :root {
    --bg: #0e1116;
    --card: #161b22;
    --sub: #131820;
    --border: #262d38;
    --line: #30363d;
    --text: #e6edf3;
    --text-2: #c9d1d9;
    --dim: #8b949e;
    --accent: #2f81f7;
    /* Text on a filled button or pill: the accent (Navigate, Download the
       takeoff, the current step, Save report, Send revision) and the green
       (Mark work complete, Mark Bldg complete). White on #2f81f7 is 3.75:1
       and on #2ea043 3.37:1, under the 4.5:1 that 10-15px text needs; the
       page ground is 5.05:1 and 5.61:1. Light mode swaps it back to white:
       5.19:1 on #0969da, 5.08:1 on #1a7f37. */
    --on-accent: #0e1116;
    --accent-2: #9cc0ff;
    --link: #79b8ff;
    --green: #2ea043;
    --green-text: #7ee2a5;
    --amber: #d29922;
    --amber-text: #f2cc60;
    --red: #f85149;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --card: #ffffff; --sub: #f6f8fa; --border: #d8dee4; --line: #d0d7de;
      --text: #1f2328; --text-2: #32383f; --dim: #59636e; --accent: #0969da; --on-accent: #ffffff;
      --accent-2: #0550ae; --link: #0969da; --green: #1a7f37; --green-text: #1a7f37;
      --amber: #9a6700; --amber-text: #9a6700; --red: #cf222e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    padding: 0 0 calc(40px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 720px; margin: 0 auto;
    padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
  }
  header { padding: 16px 0 0; }
  .org { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--dim); font-weight: 700; }
  h1 { font-size: 20px; font-weight: 700; line-height: 1.2; margin: 4px 0 2px; text-wrap: balance; }
  .hmeta { font-size: 12.5px; line-height: 1.45; color: var(--dim); }
  .num { font-family: var(--mono); font-size: 12px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; margin-top: 11px; }
  .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); font-weight: 700; margin-bottom: 7px; }
  .scope { white-space: pre-wrap; font-size: 14px; line-height: 1.55; color: var(--text-2); }
  .muted { color: var(--dim); font-style: italic; }

  /* ONE row that scrolls sideways. A wrapped stepper pushed the job site
     below the fold on a phone; render() scrolls the current step into view
     by moving this row's scrollLeft only, never the page. */
  .stepper {
    position: relative; display: flex; flex-wrap: nowrap; gap: 5px; margin: 12px 0 0; padding: 1px 0;
    overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .stepper::-webkit-scrollbar { display: none; }
  .step {
    flex: 0 0 auto; white-space: nowrap; font-size: 10px; line-height: 1.5; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--dim); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px;
  }
  .step.done { color: var(--text-2); border-color: var(--line); }
  .step.at { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }

  .meta { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .meta:first-of-type { border-top: 0; padding-top: 0; }
  .meta:last-of-type { padding-bottom: 0; }
  .meta-k { flex: 0 0 96px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); }
  .meta-v { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  a { color: var(--link); }

  .task { display: flex; gap: 9px; align-items: center; padding: 4px 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  .task.done .dot { background: var(--green); }
  .task.done .t { color: var(--dim); text-decoration: line-through; }
  .bar { height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 2px 0 6px; }
  .bar > i { display: block; height: 100%; background: var(--green); }
  .tap { font-size: 13px; color: var(--dim); }

  .log { white-space: pre-wrap; border-left: 3px solid var(--accent); padding: 8px 10px; font-size: 14px;
         background: rgba(127,127,127,0.06); border-radius: 0 5px 5px 0; }

  .note { font-size: 12px; color: var(--dim); margin-top: 14px; line-height: 1.5; }
  .fatal { padding: 60px 0; text-align: center; color: var(--dim); }
  .fatal strong { display: block; font-size: 17px; color: var(--text); margin-bottom: 8px; }

  /* The write half — rendered only when the SERVER says this link may respond.
     Every text box is 16px: iOS zooms the whole page into anything smaller. */
  #report textarea, #report input[type="text"] {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 16px; margin-bottom: 9px;
    resize: vertical;
  }
  #report .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #report button {
    min-height: 44px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #report button.big { width: 100%; margin-top: 11px; padding: 12px; background: var(--green); font-size: 15px; }
  #report button:disabled { opacity: 0.5; cursor: default; }
  #report .file {
    display: inline-flex; align-items: center; min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; color: var(--text-2); font-size: 14px; font-weight: 600;
  }
  #report .file input { display: none; }
  #report .file .camico { margin-right: 6px; }
  /* Take photo and Upload photo share their row in equal halves and Save
     report takes the row under them, so it never wraps on its own into a
     short button. With the camera hidden, Upload photo has the row to itself. */
  #report .row .file { flex: 1 1 0; min-width: 0; justify-content: center; text-align: center; }
  #report .row #save { flex: 1 1 100%; }
  #report .file:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  #report .who { font-size: 13px; color: var(--dim); margin-bottom: 9px; }
  #report .done-note { font-size: 13px; color: var(--green-text); margin-top: 11px; }
  .msg { font-size: 13px; color: var(--dim); margin-top: 9px; min-height: 17px; }
  .msg.bad { color: var(--red); }

  /* The revision box. Accented so it reads as editable, unlike the read-only
     scope a view/respond link sees. */
  #scope {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; font: inherit; font-size: 16px; resize: vertical;
  }
  #propose {
    min-height: 44px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 9px;
  }
  #propose:disabled { opacity: 0.5; cursor: default; }
  .propose-note { margin-top: 7px; }

  /* ── Work order: where, who to call, what to bring, what to finish ── */
  .site { display: grid; gap: 7px; }
  .site-num { font: 600 12px/1.2 var(--mono); color: var(--accent-2); letter-spacing: 0.02em; }
  .site-name { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .site-addr { font-size: 14px; line-height: 1.45; }
  .actions { display: grid; gap: 7px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
    min-height: 44px; padding: 10px 14px; border-radius: 10px; font: inherit; font-size: 14.5px;
    font-weight: 600; line-height: 1.25; text-decoration: none; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.go { background: var(--green); border-color: var(--green); color: var(--on-accent); }
  .btn.quiet { color: var(--dim); }
  .btn.big { width: 100%; font-size: 15px; padding: 12px; }
  .btn.small { min-height: 40px; padding: 8px 14px; font-size: 13.5px; color: var(--text-2); justify-self: start; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:focus-visible, .bld-head:focus-visible, .th-add:focus-visible, .shot:focus-visible {
    outline: 2px solid var(--link); outline-offset: 2px;
  }
  /* The map pin on Navigate: a rotated drop with a hole punched in the
     button's own colour, so it needs no image and follows the theme. */
  .pin {
    position: relative; flex: 0 0 auto; width: 13px; height: 13px; margin-top: -3px;
    border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: currentColor;
  }
  .pin::after {
    content: ""; position: absolute; left: 4px; top: 4px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--accent);
  }
  .gate { font-size: 14px; color: var(--text-2); }
  .gate b { font-family: var(--mono); font-size: 17px; letter-spacing: 1px; color: var(--text); }

  /* Materials: what to bring on the left, how many in a small box on the
     right. Quantities, never prices — the server keeps no other key. */
  .mats { list-style: none; margin: 0; padding: 0; }
  .mat { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.4; }
  .mat:first-child { border-top: 0; padding-top: 1px; }
  .mat:last-child { padding-bottom: 1px; }
  .mat-d { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .mat-q {
    flex: 0 0 auto; max-width: 45%; text-align: right; overflow-wrap: anywhere;
    font: 600 12.5px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  }
  .mat-u { font-weight: 500; color: var(--dim); }

  /* The takeoff file the office chose for this link. The server decides what
     this link gets — on a link that hides financials a spreadsheet is only
     ever a generated materials list with the prices removed; the original
     file goes only to links sent with financial details — and serves the
     bytes through the token. */
  .takeoff { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .takeoff-kind {
    flex: 0 0 auto; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--accent-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px;
  }
  .takeoff-name { flex: 1 1 auto; min-width: 0; font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
  .takeoff-size { flex: 0 0 auto; color: var(--dim); font-size: 12.5px; }
  .takeoff-lines { color: var(--dim); font-size: 12.5px; margin: -4px 0 10px; }

  #crewname {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px;
  }

  /* One card per building, straight on the page rather than nested in the
     punch-list card, so the lists and photo tiles get the full width. */
  .bld { border: 1px solid var(--border); border-radius: 12px; margin-top: 8px; background: var(--sub); overflow: hidden; }
  .bld.done { border-color: rgba(46,160,67,0.4); }
  .bld-head {
    width: 100%; min-height: 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center; gap: 8px; padding: 11px 12px;
    background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .bld-name b { display: block; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .bld-name small {
    display: block; margin-top: 1px; font-size: 12px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip {
    font-size: 11px; font-weight: 500; line-height: 1.5; border-radius: 999px; padding: 2px 9px; white-space: nowrap;
    border: 1px solid var(--line); color: var(--dim);
  }
  .chip.ok { color: var(--green-text); background: rgba(46,160,67,0.18); border-color: rgba(46,160,67,0.5); }
  .chip.need { color: var(--amber-text); border-color: rgba(210,153,34,0.45); }
  .caret { color: var(--dim); font-size: 18px; line-height: 1; transition: transform .15s; }
  .bld.open .caret { transform: rotate(90deg); }
  .bld-body { display: grid; gap: 10px; padding: 0 12px 12px; }
  .bld-body[hidden] { display: none; }
  .side-l { font-size: 12px; font-weight: 700; color: var(--accent-2); margin-bottom: 3px; }
  .side ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; color: var(--text-2); }
  .bld-body > .lbl, .photos .lbl { margin-bottom: 6px; }
  /* Square tiles, three to a row. The two dashed tiles at the end ARE the
     completion-photo file inputs (labels around them): Take photo opens the
     camera, Upload photo the photo library. */
  .shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .shot {
    position: relative; display: block; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); background: rgba(127,127,127,0.12);
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot span {
    position: absolute; left: 4px; bottom: 4px; font-size: 10.5px; font-weight: 700; color: #fff;
    background: rgba(0,0,0,0.62); border-radius: 4px; padding: 1px 5px;
  }
  .th-add {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    aspect-ratio: 1 / 1; border: 1.5px dashed var(--line); border-radius: 8px; padding: 6px;
    color: var(--link); font-size: 12.5px; font-weight: 600; line-height: 1.2; text-align: center; cursor: pointer;
  }
  .th-add .plus { font-size: 24px; font-weight: 400; line-height: 1; }
  .th-add input, .file-btn input { display: none; }
  .camico { flex: 0 0 auto; }
  /* Take before photo and Upload before photo share one row in equal halves,
     their text wrapping inside rather than the pair breaking over two rows.
     With the camera hidden, Upload before photo has the row to itself. */
  .before-add { display: flex; gap: 6px; }
  .before-add .btn { flex: 1 1 0; min-width: 0; padding-left: 8px; padding-right: 8px; }
  /* Take photo needs a camera to open: capture="environment" is ignored on a
     computer, where it would only open the file dialog Upload photo already
     opens. Shown only where the main pointer is a finger, and never on
     Windows, whose 2-in-1s report a finger in tablet mode but have no camera
     behind a file input (the script marks the page no-capture). */
  @media not all and (pointer: coarse) {
    .th-add.th-cam, .btn.cam-btn { display: none; }
  }
  .no-capture .th-add.th-cam, .no-capture .btn.cam-btn { display: none; }
  /* The field report's Take photo, on the same two conditions. */
  @media not all and (pointer: coarse) {
    #report .file.cam-file { display: none; }
  }
  .no-capture #report .file.cam-file { display: none; }
  .bnotes { display: grid; }
  .bnote { font-size: 14px; padding: 6px 0; border-top: 1px solid var(--border); }
  .bnote:first-child { border-top: 0; padding-top: 0; }
  .bnote small { display: block; color: var(--dim); font-size: 11.5px; }
  .note-row { display: flex; gap: 6px; }
  .note-row input {
    flex: 1 1 auto; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 16px;
  }
  .note-row .btn { flex: 0 0 auto; }
  .stamp { color: var(--green-text); font-size: 12.5px; }
  .need-hint { color: var(--amber-text); font-size: 12.5px; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
  #report .msg:empty { min-height: 0; margin-top: 0; }
  .bld .msg { margin-top: 0; min-height: 0; }
  .bld .msg:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { .caret { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="fatal" id="boot">Loading…</div>
</div>

<script>
(function () {
  'use strict';

  // The token comes from the page's OWN PATH, never a query string: a query
  // string is far more likely to be logged by a proxy, kept in an analytics
  // payload, or pasted onward with the rest of a URL.
  var token = (location.pathname.split('/').filter(Boolean).pop() || '');

  // See the .no-capture rule: Windows ignores capture="environment". Only a
  // tablet-sized screen counts, because a phone browser asked for the desktop
  // site can send a Windows user agent, and a phone must keep its camera.
  try {
    if (/Windows NT/.test(navigator.userAgent) && Math.min(screen.width || 0, screen.height || 0) >= 600) document.documentElement.classList.add('no-capture');
  } catch (e) { /* no navigator: nothing to mark */ }

  var root = document.getElementById('root');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fatal(msg) {
    root.innerHTML = '<div class="fatal"><strong>' + esc(msg) + '</strong>' +
      'If you think this is a mistake, contact whoever sent you the link.</div>';
  }

  function fmtDate(v) {
    if (!v) return '';
    // A scheduled or due date is a CALENDAR day. A Postgres DATE arrives as
    // ...T00:00:00.000Z, and new Date() on that renders the day BEFORE anywhere
    // west of Greenwich — a crew in Tampa saw a start date one day early. Same
    // reading as the office work-order panel's fmtDate (copied, never linked).
    var cal = /^(\d{4})-(\d{2})-(\d{2})(?:T00:00:00(?:\.000)?Z)?$/.exec(String(v));
    var d = cal ? new Date(Number(cal[1]), Number(cal[2]) - 1, Number(cal[3])) : new Date(v);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  var STATUS_LABEL = {
    draft: 'Draft', open: 'Open', scheduled: 'Scheduled', in_progress: 'In progress',
    work_complete: 'Work complete', approved: 'Approved', closed: 'Closed', cancelled: 'Cancelled'
  };
  var LINE = ['open', 'scheduled', 'in_progress', 'work_complete', 'approved', 'closed'];

  var TAKEOFF_KIND = { xlsx: 'Spreadsheet', xls: 'Spreadsheet', csv: 'CSV', pdf: 'PDF', image: 'Photo' };

  function fmtSize(n) {
    n = Number(n);
    if (!isFinite(n) || n <= 0) return '';
    if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  // A PDF or photo opens in the browser; a spreadsheet or CSV is sent as a
  // download (the server sets that), so the button says which will happen.
  //
  // tk.copy: the server is serving the price-free copy it made from the
  // office's spreadsheet (a link that hides financials), not the file itself.
  // The card says so — the crew gets a materials list, not the estimate — and
  // shows how many lines it holds instead of a size (the copy is built per
  // download, so it has none). The same door serves both; the server alone
  // decides which one this link gets.
  function takeoffHTML(tk) {
    var sheet = tk.kind === 'xlsx' || tk.kind === 'xls' || tk.kind === 'csv';
    var copy = tk.copy === true;
    var size = copy ? '' : fmtSize(tk.size_bytes);
    var n = Number(tk.lines);
    var lines = copy
      ? (Number.isSafeInteger(n) && n > 0 ? n + (n === 1 ? ' line' : ' lines') + ' — material, quantity and unit'
        : 'Material, quantity and unit')
      : '';
    return '<div class="lbl">' + (copy ? 'Materials list (prices removed)' : 'Takeoff') + '</div>' +
      '<div class="takeoff">' +
        '<span class="takeoff-kind">' + esc(TAKEOFF_KIND[tk.kind] || 'File') + '</span>' +
        '<span class="takeoff-name">' + esc(tk.filename) + '</span>' +
        (size ? '<span class="takeoff-size">' + esc(size) + '</span>' : '') +
      '</div>' +
      (lines ? '<div class="takeoff-lines">' + esc(lines) + '</div>' : '') +
      '<div class="actions">' +
        '<a class="btn primary" href="' + esc('/api/service-ticket-share/' + encodeURIComponent(token) + '/takeoff') +
          '" target="_blank" rel="noreferrer noopener">' +
          (copy ? 'Download the materials list' : sheet ? 'Download the takeoff' : 'Open the takeoff') + '</a>' +
      '</div>';
  }

  function render(d) {
    var t = d.ticket || {};
    var tasks = d.tasks || [];
    var done = tasks.filter(function (x) { return x.done; }).length;
    var at = LINE.indexOf(t.status);

    var addr = [t.street_address, t.city, t.state, t.zip].filter(Boolean).join(', ');
    var mapHref = addr ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr) : '';

    var html = '';
    html += '<header>' +
      (d.org_name ? '<div class="org">' + esc(d.org_name) + '</div>' : '') +
      '<h1>' + esc(t.title || 'Work order') + '</h1>' +
      ((t.ticket_number || d.parent_label)
        ? '<div class="hmeta">' +
            (t.ticket_number ? '<span class="num">' + esc(t.ticket_number) + '</span>' : '') +
            (t.ticket_number && d.parent_label ? ' · ' : '') +
            // The forward-facing name of the parent — a lead title or a job
            // number and title, resolved server-side. Never a raw id.
            (d.parent_label ? '<span class="parent">' + esc(d.parent_label) + '</span>' : '') +
          '</div>'
        : '') +
    '</header>';

    if (t.status === 'cancelled') {
      html += '<div class="card" style="border-color:var(--red);color:var(--red);margin-top:12px;">This work order was cancelled.</div>';
    } else {
      html += '<div class="stepper">' + LINE.map(function (s, i) {
        return '<span class="step' + (i <= at ? ' done' : '') + (i === at ? ' at' : '') + '">' +
          esc(STATUS_LABEL[s]) + '</span>';
      }).join('') + '</div>';
    }

    // The write half is decided up here because the punch list below uses it
    // too. Rendered ONLY when the server said this link may respond — and the
    // server re-derives that from the stored row on every request, so hiding a
    // control here is a courtesy, never the permission. A view-only link
    // renders no control at all.
    var canRespond = d.share && (d.share.scope === 'respond' || d.share.scope === 'propose');
    var live = t.status !== 'closed' && t.status !== 'cancelled' && t.status !== 'approved';
    // Subtasks also refuse a draft — the office has not released it yet.
    var canWork = canRespond && live && t.status !== 'draft';

    // Where the work is, and one tap to get there or to call the PM.
    var site = d.site || {};
    var siteAddr = site.address || addr;
    var hasCoord = site.lat != null && site.lng != null && isFinite(Number(site.lat)) && isFinite(Number(site.lng));
    var navHref = hasCoord
      ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(Number(site.lat) + ',' + Number(site.lng))
      : (siteAddr ? 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(siteAddr) : '');
    var contact = d.contact || null;
    var phone = contact && contact.phone ? String(contact.phone).replace(/[^0-9+]/g, '') : '';
    if (site.job_number || site.name || siteAddr || site.gate_code || phone) {
      // The mock's site card: job number, job name, the address on two lines
      // (street, then city) and one full-width Navigate under it.
      var comma = siteAddr ? siteAddr.indexOf(', ') : -1;
      html += '<div class="card site">' +
        (site.job_number ? '<div class="site-num">' + esc(site.job_number) + '</div>' : '') +
        (site.name ? '<div class="site-name">' + esc(site.name) + '</div>' : '') +
        (siteAddr
          ? '<div class="site-addr">' + (comma > 0
              ? esc(siteAddr.slice(0, comma)) + '<br>' + esc(siteAddr.slice(comma + 2))
              : esc(siteAddr)) + '</div>'
          : '') +
        (navHref || phone
          ? '<div class="actions">' +
              (navHref ? '<a class="btn primary" href="' + esc(navHref) + '" target="_blank" rel="noreferrer noopener"><span class="pin" aria-hidden="true"></span>Navigate</a>' : '') +
              (phone ? '<a class="btn" href="tel:' + esc(phone) + '">Call ' + esc(contact.name || 'the project manager') + '</a>' : '') +
            '</div>'
          : '') +
        (site.gate_code ? '<div class="gate">Gate code <b>' + esc(site.gate_code) + '</b></div>' : '') +
      '</div>';
    }

    // 'propose' is the ONLY scope that turns the scope of work into an editable
    // box — and even then the box does not change the work order. What Save
    // sends is a PROPOSAL that a person at the office accepts or rejects.
    var canPropose = d.share && d.share.scope === 'propose' &&
      t.status !== 'closed' && t.status !== 'cancelled';

    html += '<div class="card">' +
      '<div class="lbl">Scope of work</div>' +
      (canPropose
        ? '<textarea id="scope" rows="6" placeholder="Describe what the work should be.">' +
            esc(t.scope_proposed || '') + '</textarea>' +
          '<div class="row"><button id="propose">Send revision</button></div>' +
          '<div class="note propose-note">Your changes go to the office for approval — ' +
            'the work order is not changed until they accept.</div>' +
          '<div id="pmsg" class="msg"></div>'
        : t.scope_proposed
          ? '<div class="scope">' + esc(t.scope_proposed) + '</div>'
          : '<div class="muted">No scope has been written yet.</div>') +
      // Only present when the sender chose to reveal financial detail; the
      // server omits the field entirely otherwise, so this cannot render an
      // empty labelled box.
      (t.scope_approved
        ? '<div class="lbl" style="margin-top:14px;">Approved scope</div><div class="scope">' + esc(t.scope_approved) + '</div>'
        : '') +
    '</div>';

    var metas = '';
    function meta(k, v) { if (v) metas += '<div class="meta"><span class="meta-k">' + esc(k) + '</span><span class="meta-v">' + v + '</span></div>'; }
    meta('Status', esc(STATUS_LABEL[t.status] || t.status || ''));
    meta('Scheduled', esc(fmtDate(t.scheduled_for)));
    meta('Due', esc(fmtDate(t.due_date)));
    meta('Site contact', esc(t.site_contact_name || ''));
    meta('Phone', t.site_contact_phone ? '<a href="tel:' + esc(String(t.site_contact_phone).replace(/[^0-9+]/g, '')) + '">' + esc(t.site_contact_phone) + '</a>' : '');
    if (!siteAddr) meta('Address', addr ? '<a href="' + esc(mapHref) + '" target="_blank" rel="noreferrer noopener">' + esc(addr) + '</a>' : '');
    // The gate code is shown big above; the access note only repeats when it
    // says something more than the code.
    if (t.access_notes && t.access_notes !== site.gate_code) meta('Access', esc(t.access_notes));
    if (metas) html += '<div class="card">' + metas + '</div>';

    // Materials — only when the office attached a list. Quantities, never prices.
    var mats = Array.isArray(t.materials) ? t.materials : [];
    if (mats.length) {
      // What to bring on the left; how many (and of what unit) in a small box
      // on the right, the way the mock reads. A line with neither gets no box.
      html += '<div class="card"><div class="lbl">Materials</div><ul class="mats">' +
        mats.map(function (m) {
          var q = m.qty ? esc(m.qty) : '';
          var u = m.unit ? '<span class="mat-u">' + esc(m.unit) + '</span>' : '';
          return '<li class="mat"><span class="mat-d">' + esc(m.description || '') + '</span>' +
            (q || u ? '<span class="mat-q">' + q + (q && u ? ' ' : '') + u + '</span>' : '') + '</li>';
        }).join('') + '</ul></div>';
    }

    // The takeoff file — present only when the office chose one AND the server
    // decided this link may see it, and in what form. The page never decides
    // that: on a link that hides financials a spreadsheet arrives as the
    // price-free copy (takeoff.copy) or not at all, and the file door serves
    // the same answer. The link goes through the token, never
    // a storage URL, so revoking the link stops the file with it.
    if (d.takeoff && d.takeoff.filename) {
      html += '<div class="card">' + takeoffHTML(d.takeoff) + '</div>';
    }

    // Who is doing the work — asked once, above everything that records a name.
    if (canRespond && live && !d.share.recipient_name) {
      html += '<div class="card"><div class="lbl">Your name</div>' +
        '<input type="text" id="crewname" placeholder="So the office knows who finished what" maxlength="120" value="' + esc(crewName) + '" />' +
      '</div>';
    }

    if (tasks.length) {
      html += '<div class="card"><div class="lbl">Punch list · ' + done + ' of ' + tasks.length + ' done</div>' +
        '<div class="bar"><i style="width:' + Math.round((done / tasks.length) * 100) + '%"></i></div>' +
        '<div class="tap">Tap a building to open it.</div>' +
      '</div>' +
      tasks.map(function (x) { return buildingHTML(x, canWork, t); }).join('') +
      (t.status === 'approved'
        ? '<div class="hint">The office approved this work. Ask them to reopen it for changes.</div>'
        : '');
    }

    if (t.guest_log) {
      html += '<div class="card"><div class="lbl">Field log</div><div class="log">' + esc(t.guest_log) + '</div></div>';
    }

    if (canRespond && live) {
      html += '<div class="card" id="report">' +
        '<div class="lbl">Your field report</div>' +
        (d.share.recipient_name
          ? '<div class="who">Signed in as <strong>' + esc(d.share.recipient_name) + '</strong></div>'
          : '') +
        '<textarea id="note" rows="3" placeholder="What did you find? What did you do?"></textarea>' +
        // Take photo opens the camera (capture="environment"); Upload photo
        // the photo library, which on Android offers no camera. Both are
        // labels around their inputs, so they take a tabindex and a role and
        // wireReport lets Enter or Space open them.
        '<div class="row">' +
          '<label class="file cam-file" tabindex="0" role="button">' + CAM_ICON(16) +
            'Take photo<input type="file" id="photoCam" accept="image/*" capture="environment" /></label>' +
          '<label class="file" tabindex="0" role="button"><input type="file" id="photo" accept="image/*" />Upload photo</label>' +
          '<button id="save">Save report</button>' +
        '</div>' +
        (t.status === 'work_complete'
          ? '<div class="done-note">Marked work complete. The office will review it.</div>'
          : '<button id="complete" class="big">Mark work complete</button>' +
            '<div class="hint">Tells the office the whole job is done and ready for approval. ' +
              'Finishing every building on the punch list does this for you.</div>') +
        '<div id="msg" class="msg"></div>' +
      '</div>';
    }

    html += '<div class="note">' +
      (canRespond && live
        ? 'Notes and photos you add are recorded against this work order with your name. ' +
          'The scope itself is set by the office.'
        : 'This is a read-only view of the work order. It stays up to date — reload to see the latest.') +
      (d.share && d.share.expires_at ? ' This link expires ' + esc(fmtDate(d.share.expires_at)) + '.' : '') +
      '</div>';

    root.innerHTML = html;

    // Bring the current step into view inside the one-row stepper. Only the
    // ROW's scrollLeft moves: scrollIntoView would also scroll the page, and
    // render() runs again after every photo and note, so a crew member halfway
    // down the punch list would be thrown back to the top each time.
    var stepRow = root.querySelector('.stepper');
    var atStep = stepRow && stepRow.querySelector('.step.at');
    if (atStep && stepRow.scrollWidth > stepRow.clientWidth) {
      stepRow.scrollLeft = Math.max(0, atStep.offsetLeft - (stepRow.clientWidth - atStep.offsetWidth) / 2);
    }

    var nameBox = document.getElementById('crewname');
    if (nameBox) nameBox.addEventListener('input', function () {
      crewName = nameBox.value;
      try { localStorage.setItem('st-crew-name', crewName); } catch (e) {}
    });
    wireBuildings(tasks, canWork);
    if (canRespond && live) wireReport(d);
    if (canPropose) wirePropose(d, t);
  }

  // ── The punch list: one card per building ─────────────────────────────
  //
  // "Bldg 784 — Side A: rail post; tread 3 · Side D: stringer" opens into
  // per-side lists. A title in any other shape renders whole.
  function parseTitle(title) {
    var s = String(title || '').trim();
    var m = s.match(/^(.+?)\s+[—–-]\s+(.+)$/);
    if (!m) return { head: s || 'Task', sides: [] };
    return {
      head: m[1].trim(),
      sides: m[2].split(/\s+·\s+/).map(function (part) {
        var sm = part.match(/^([^:]{1,40}):\s*(.+)$/);
        if (!sm) return { label: '', items: [part.trim()] };
        return { label: sm[1].trim(), items: sm[2].split(/;\s*/).map(function (x) { return x.trim(); }).filter(Boolean) };
      })
    };
  }

  var openCards = {};
  var crewName = '';
  try { crewName = localStorage.getItem('st-crew-name') || ''; } catch (e) {}

  // The camera outline on the Take photo controls (the building cards and the
  // field report), drawn in currentColor.
  function CAM_ICON(size) {
    return '<svg class="camico" viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true" focusable="false">' +
      '<path d="M4 8.5h3.2l1.6-2.5h6.4l1.6 2.5H20V19H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>' +
      '<circle cx="12" cy="13.2" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  }

  function buildingHTML(x, canWork, t) {
    var p = parseTitle(x.title);
    var photos = x.photos || [];
    var after = photos.filter(function (ph) { return ph.kind !== 'before'; });
    var before = photos.filter(function (ph) { return ph.kind === 'before'; });
    var completion = after.length;
    var notes = x.notes || [];
    var open = !!openCards[x.id];
    // The line under the building name is the repairs themselves, cut off by
    // CSS at the card's edge — what a crew scans 21 cards for is "which one
    // had the stringer", which a count per side never said.
    var summary = p.sides.map(function (sd) { return sd.items.join(' · '); }).join(' · ');
    var chip = x.done
      ? '<span class="chip ok">&#x2713; Done</span>'
      : (completion
          ? '<span class="chip n">' + photos.length + ' photo' + (photos.length === 1 ? '' : 's') + '</span>'
          : '<span class="chip need">Needs photo</span>');


    function shot(ph) {
      return '<a class="shot" href="' + esc(ph.web_url || ph.thumb_url || '') + '" target="_blank" rel="noreferrer noopener">' +
        '<img src="' + esc(ph.thumb_url || ph.web_url || '') + '" alt="" loading="lazy" />' +
        (ph.kind === 'before' ? '<span>Before</span>' : '') +
      '</a>';
    }

    return '<div class="bld' + (x.done ? ' done' : '') + (open ? ' open' : '') + '" data-task="' + esc(x.id) + '">' +
      '<button type="button" class="bld-head" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        '<span class="bld-name"><b>' + esc(p.head) + '</b>' + (summary ? '<small>' + esc(summary) + '</small>' : '') + '</span>' +
        chip +
        '<span class="caret" aria-hidden="true">&#x203A;</span>' +
      '</button>' +
      '<div class="bld-body"' + (open ? '' : ' hidden') + '>' +
        p.sides.map(function (sd) {
          return '<div class="side">' + (sd.label ? '<div class="side-l">' + esc(sd.label) + '</div>' : '') +
            '<ul>' + sd.items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul></div>';
        }).join('') +
        // Completion photos as square tiles. When this link can work, the
        // two dashed tiles at the end are labels around the completion-photo
        // file inputs: Take photo carries capture="environment", so a tap
        // opens the back camera (one photo a tap); Upload photo has no capture,
        // so it opens the photo library and takes many at once. Android's
        // library picker offers no camera, which is why both exist.
        (completion || canWork
          ? '<div class="photos"><div class="lbl">Completion photos · ' + completion + '</div>' +
              '<div class="shots">' + after.map(shot).join('') +
                (canWork
                  ? '<label class="th-add th-cam" tabindex="0" role="button">' +
                      CAM_ICON(24) + 'Take photo' +
                      '<input type="file" accept="image/*" capture="environment" data-kind="completion" />' +
                    '</label>' +
                    '<label class="th-add" tabindex="0" role="button">' +
                      '<span class="plus" aria-hidden="true">+</span>Upload photo' +
                      '<input type="file" accept="image/*" multiple data-kind="completion" />' +
                    '</label>'
                  : '') +
              '</div></div>'
          : '') +
        (before.length
          ? '<div class="photos"><div class="lbl">Before photos · ' + before.length + '</div>' +
              '<div class="shots">' + before.map(shot).join('') + '</div></div>'
          : '') +
        (canWork
          ? '<div class="before-add">' +
              '<label class="btn small file-btn cam-btn" tabindex="0" role="button">' + CAM_ICON(16) +
                'Take before photo<input type="file" accept="image/*" capture="environment" data-kind="before" /></label>' +
              '<label class="btn small file-btn" tabindex="0" role="button">Upload before photo<input type="file" accept="image/*" multiple data-kind="before" /></label>' +
            '</div>'
          : '') +
        (notes.length
          ? '<div class="bnotes">' + notes.map(function (n) {
              return '<div class="bnote"><small>' + esc(n.by || '') + (n.at ? ' · ' + esc(fmtDate(n.at)) : '') + '</small>' + esc(n.note) + '</div>';
            }).join('') + '</div>'
          : '') +
        (x.done && x.completed_by
          ? '<div class="stamp">Completed by ' + esc(x.completed_by) + (x.completed_at ? ' · ' + esc(fmtDate(x.completed_at)) : '') + '</div>'
          : '') +
        (canWork
          ? '<div class="note-row">' +
              '<input type="text" class="bnote-in" placeholder="Add a note for this building" maxlength="2000" />' +
              '<button type="button" class="btn bnote-go">Add</button>' +
            '</div>' +
            (x.done
              ? '<button type="button" class="btn quiet big bdone" data-done="0">Undo — not finished</button>'
              : (completion ? '' : '<div class="need-hint">Add at least one completion photo first.</div>') +
                '<button type="button" class="btn go big bdone" data-done="1"' + (completion ? '' : ' disabled') + '>Mark ' + esc(p.head) + ' complete</button>') +
            '<div class="msg"></div>'
          : '') +
      '</div>' +
    '</div>';
  }

  // Every subtask call goes through the same door and shows the server's
  // refusal verbatim — an approved work order, a missing photo, a revoked link.
  function taskPost(taskId, path, payload) {
    return fetch('/api/service-ticket-share/' + encodeURIComponent(token) + '/subtasks/' +
        encodeURIComponent(taskId) + '/' + path, payload instanceof FormData
      ? { method: 'POST', body: payload, cache: 'no-store' }
      : {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify(payload)
        }).then(function (r) {
      return r.text().then(function (txt) {
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
        if (!r.ok) throw new Error((data && data.error) || 'That could not be saved.');
        return data;
      });
    });
  }

  // A photo button that is a LABEL around its file input opens on a tap, but
  // a keyboard cannot press a label. Enter or Space opens the same input.
  function openFileOnKey(lab) {
    lab.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      var inp = lab.querySelector('input[type=file]');
      if (inp) inp.click();
    });
  }

  function wireBuildings(tasks, canWork) {
    var byId = {};
    tasks.forEach(function (x) { byId[String(x.id)] = x; });
    Array.prototype.forEach.call(document.querySelectorAll('.bld'), function (card) {
      var id = card.getAttribute('data-task');
      var head = card.querySelector('.bld-head');
      var body = card.querySelector('.bld-body');
      var cmsg = card.querySelector('.msg');
      function say(text, bad) { if (cmsg) { cmsg.textContent = text; cmsg.className = 'msg' + (bad ? ' bad' : ''); } }

      head.addEventListener('click', function () {
        var open = body.hidden;
        body.hidden = !open;
        card.classList.toggle('open', open);
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) openCards[id] = true; else delete openCards[id];
      });
      if (!canWork || !byId[id]) return;

      // The photo tiles and the before-photo buttons are LABELS around their
      // file inputs, which a tap opens but a keyboard cannot press. Enter or
      // Space opens the same input.
      Array.prototype.forEach.call(card.querySelectorAll('label[role=button]'), openFileOnKey);

      Array.prototype.forEach.call(card.querySelectorAll('input[type=file]'), function (inp) {
        inp.addEventListener('change', function () {
          var files = Array.prototype.slice.call(inp.files || []);
          inp.value = '';
          if (!files.length) return;
          var kind = inp.getAttribute('data-kind') === 'before' ? 'before' : 'completion';
          var n = 0;
          say('Uploading 1 of ' + files.length + '…');
          // One at a time — a phone on one bar should not lose six at once.
          files.reduce(function (p, f) {
            return p.then(function () {
              say('Uploading ' + (++n) + ' of ' + files.length + '…');
              var fd = new FormData();
              fd.append('kind', kind);
              if (crewName.trim()) fd.append('name', crewName.trim());
              fd.append('file', f);
              return taskPost(id, 'photo', fd);
            });
          }, Promise.resolve()).then(function () {
            openCards[id] = true;
            load();
          }).catch(function (e) {
            say(e.message, true);
          });
        });
      });

      var noteIn = card.querySelector('.bnote-in');
      var noteGo = card.querySelector('.bnote-go');
      function addNote() {
        var text = (noteIn.value || '').trim();
        if (!text) { say('Write something first.', true); return; }
        noteGo.disabled = true;
        taskPost(id, 'note', { note: text, name: crewName.trim() || undefined }).then(function () {
          openCards[id] = true;
          load();
        }).catch(function (e) { noteGo.disabled = false; say(e.message, true); });
      }
      if (noteGo) noteGo.addEventListener('click', addNote);
      if (noteIn) noteIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addNote(); } });

      var doneBtn = card.querySelector('.bdone');
      if (doneBtn) doneBtn.addEventListener('click', function () {
        doneBtn.disabled = true;
        say('Saving…');
        taskPost(id, 'done', { done: doneBtn.getAttribute('data-done') === '1', name: crewName.trim() || undefined })
          .then(function () { load(); })
          .catch(function (e) { doneBtn.disabled = false; say(e.message, true); });
      });
    });
  }

  // The revision door. Deliberately its OWN submit, separate from the field
  // report: filing what you did and suggesting what the job should be are
  // different acts with different consequences, and merging them into one
  // button would let a crew member change the scope while meaning to log a
  // note.
  function wirePropose(d, t) {
    var btn = document.getElementById('propose');
    var box = document.getElementById('scope');
    if (!btn || !box) return;
    var original = box.value;

    function pmsg(text, bad) {
      var m = document.getElementById('pmsg');
      if (m) { m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); }
    }

    btn.addEventListener('click', function () {
      var next = box.value;
      if (next === original) { pmsg('Change the scope first.', true); return; }
      btn.disabled = true;
      pmsg('Sending…');
      var nameEl = document.getElementById('crewname');
      fetch('/api/service-ticket-share/' + encodeURIComponent(token) + '/revision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        cache: 'no-store',
        body: JSON.stringify({
          // Only the scope. The page sends nothing else, and the server
          // filters again anyway — status, assignment and approval are not
          // proposable at all.
          fields: { scope_proposed: next },
          name: (nameEl && nameEl.value) || undefined
        })
      }).then(function (r) {
        return r.text().then(function (txt) {
          var data = null;
          try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
          if (!r.ok) throw new Error((data && data.error) || 'That could not be sent.');
          return data;
        });
      }).then(function () {
        original = next;
        btn.disabled = false;
        pmsg('Sent to the office. They will accept or decline it — the work order still reads as it did.');
      }).catch(function (e) {
        btn.disabled = false;
        pmsg(e.message, true);
      });
    });
  }

  function msg(text, bad) {
    var m = document.getElementById('msg');
    if (m) { m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); }
  }

  function send(body) {
    return fetch('/api/service-ticket-share/' + encodeURIComponent(token), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (txt) {
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
        // The server's refusals ARE the message. A 403 here means the office
        // changed the link or the work order moved on — say that, do not
        // pretend it worked.
        if (!r.ok) throw new Error((data && data.error) || 'That could not be saved.');
        return data;
      });
    });
  }

  function wireReport(d) {
    var saveBtn = document.getElementById('save');
    var completeBtn = document.getElementById('complete');
    var photoInput = document.getElementById('photo');

    function collect(extra) {
      var body = extra || {};
      var noteEl = document.getElementById('note');
      var nameEl = document.getElementById('crewname');
      if (noteEl && noteEl.value.trim()) body.note = noteEl.value;
      if (nameEl && nameEl.value.trim()) body.name = nameEl.value;
      return body;
    }

    if (saveBtn) saveBtn.addEventListener('click', function () {
      var body = collect();
      if (!body.note && !body.name) { msg('Write something first.', true); return; }
      saveBtn.disabled = true;
      msg('Saving…');
      send(body).then(function () { load(); })
        .catch(function (e) { msg(e.message, true); saveBtn.disabled = false; });
    });

    if (completeBtn) completeBtn.addEventListener('click', function () {
      completeBtn.disabled = true;
      msg('Saving…');
      // The note rides along so a crew member who typed one and pressed the
      // big button does not lose it.
      send(collect({ status: 'work_complete' })).then(function () { load(); })
        .catch(function (e) { msg(e.message, true); completeBtn.disabled = false; });
    });

    // Take photo and Upload photo send their photo through the same door.
    [document.getElementById('photoCam'), photoInput].forEach(function (inp) {
      if (!inp) return;
      inp.addEventListener('change', function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        msg('Uploading photo…');
        var fd = new FormData();
        fd.append('file', f);
        fetch('/api/service-ticket-share/' + encodeURIComponent(token) + '/photo', {
          method: 'POST', body: fd, cache: 'no-store'
        }).then(function (r) {
          return r.text().then(function (txt) {
            var data = null;
            try { data = txt ? JSON.parse(txt) : null; } catch (e) {}
            if (!r.ok) throw new Error((data && data.error) || 'That photo could not be uploaded.');
            return data;
          });
        }).then(function () { msg('Photo added.'); inp.value = ''; })
          .catch(function (e) { msg(e.message, true); inp.value = ''; });
      });
    });

    // The two photo buttons are labels around their file inputs, as on the
    // building cards (openFileOnKey).
    Array.prototype.forEach.call(document.querySelectorAll('#report label[role=button]'), openFileOnKey);
  }

  function load() {
    fetch('/api/service-ticket-share/' + encodeURIComponent(token), {
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    }).then(function (r) {
      return r.text().then(function (txt) {
        var data = null;
        try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = null; }
        if (!r.ok) {
          // The server's failure strings ARE the guest UI. They say what
          // happened without revealing whether a token ever existed.
          throw new Error((data && data.error) || 'This link could not be opened.');
        }
        return data;
      });
    }).then(function (d) {
      if (!d || !d.ticket) throw new Error('This link could not be opened.');
      document.title = (d.ticket.title || 'Work Order');
      render(d);
    }).catch(function (e) {
      fatal(e && e.message ? e.message : 'This link could not be opened.');
    });
  }

  // Shape gate BEFORE any network call: a malformed token never costs the
  // server a request, and the visitor gets the same answer either way.
  if (!/^[a-f0-9]{64}$/.test(token)) fatal('This link is not valid.');
  else load();
})();
</script>
</body>
</html>
