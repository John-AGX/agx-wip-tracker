          '<div class="msg" id="tmMsg-material">' + (tmNote.material ? esc(tmNote.material.text) : '') + '</div>' +
        '</div>';
    }
    if (labor.length || mats.length) {
      html += '<div class="tm-sent"><div class="lbl">You sent</div>' +
        labor.map(function (l) { return tmLineHTML('labor', l, byTask); }).join('') +
        mats.map(function (m) { return tmLineHTML('material', m, byTask); }).join('') +
      '</div>';
    }
    return html + '</div>';
  }

  function tmSay(kind, text, bad) {
    tmNote[kind] = text ? { text: text, bad: !!bad } : null;
    var m = document.getElementById('tmMsg-' + kind);
    if (m) { m.textContent = text || ''; m.className = 'msg' + (bad ? ' bad' : ''); }
  }

  function tmBody(kind) {
    var body = { client_ref: tmRef(kind) };
    TM_FIELDS[kind].forEach(function (k) { body[k] = tmValue(kind, k); });
    if (!body.task_id) body.task_id = null;
    if (kind === 'labor') body.crew_size = Number(body.crew_size);
    if (crewName.trim()) body.name = crewName.trim();
    return body;
  }

  function sendTimeLine(kind) {
    if (tmBusy[kind]) return;
    tmBusy[kind] = true;
    tmSay(kind, 'Sending…');
    Array.prototype.forEach.call(root.querySelectorAll('.tm-form[data-kind="' + kind + '"] .tm-in, .tm-send[data-kind="' + kind + '"]'),
      function (el) { el.disabled = true; });
    var path = kind === 'labor' ? 'labor' : 'materials-used';
    fetch('/api/service-ticket-share/' + encodeURIComponent(token) + '/' + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify(tmBody(kind))
    }).then(function (r) {
      return readJSON(r, 'That could not be sent.');
    }).then(function () {
      if (!alive()) return;
      // Confirmed: the form starts over (the day and the crew stay — the
      // next line is usually the same day and the same people).
      var keep = kind === 'labor'
        ? { work_date: drafts.tm.labor.work_date || '', crew_size: drafts.tm.labor.crew_size || '' }
        : {};
      drafts.tm[kind] = {};
      Object.keys(keep).forEach(function (k) { if (keep[k]) drafts.tm[kind][k] = keep[k]; });
      persistDrafts();
      tmBusy[kind] = false;
      tmSay(kind, 'Sent to the office.');
      load({ after: 'saved' });
    }).catch(function (e) {
      if (!alive()) return;
      tmBusy[kind] = false;
      Array.prototype.forEach.call(root.querySelectorAll('.tm-form[data-kind="' + kind + '"] .tm-in, .tm-send[data-kind="' + kind + '"]'),
        function (el) { el.disabled = false; });
      tmSay(kind, saveError(e), true);
    });
  }

  function wireTimeCard() {
    Array.prototype.forEach.call(root.querySelectorAll('.tm-in'), function (el) {
      var ev = el.tagName === 'SELECT' ? 'change' : 'input';
      el.addEventListener(ev, function () {
        var parts = String(el.getAttribute('data-tm') || '').split('.');
        if (parts.length !== 2 || !drafts.tm[parts[0]]) return;
        drafts.tm[parts[0]][parts[1]] = String(el.value == null ? '' : el.value).slice(0, TM_MAX[parts[1]] || 200);
        if (tmNote[parts[0]] && !tmNote[parts[0]].bad) tmSay(parts[0], '');
        saveDraftSoon();
      });
    });
    Array.prototype.forEach.call(root.querySelectorAll('.tm-send'), function (b) {
      b.addEventListener('click', function () { if (!b.disabled) sendTimeLine(b.getAttribute('data-kind')); });
    });
  }

  // ── The punch list: one card per building ─────────────────────────────
  //
  // "Bldg 784 — Side A: rail post; tread 3 · Side D: stringer" opens into
  // per-side lists. A title in any other shape renders whole.
  function parseTitle(title) {
    var s = String(title || '').trim();
    var m = s.match(/^(.+?)\s+[—–-]\s+(.+)$/);
    if (!m) return { head: s || 'Task', sides: [] };
    return {
      head: m[1].trim(),
      sides: m[2].split(/\s+·\s+/).map(function (part) {
        var sm = part.match(/^([^:]{1,40}):\s*(.+)$/);
        if (!sm) return { label: '', items: [part.trim()] };
        return { label: sm[1].trim(), items: sm[2].split(/;\s*/).map(function (x) { return x.trim(); }).filter(Boolean) };
      })
    };
  }

  // The camera outline on the Take photo controls (the building cards and the
  // field report), drawn in currentColor.
  function CAM_ICON(size) {
    return '<svg class="camico" viewBox="0 0 24 24" width="' + size + '" height="' + size + '" aria-hidden="true" focusable="false">' +
      '<path d="M4 8.5h3.2l1.6-2.5h6.4l1.6 2.5H20V19H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>' +
      '<circle cx="12" cy="13.2" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
  }

  function shotHTML(ph) {
    return '<a class="shot" href="' + esc(ph.web_url || ph.thumb_url || '') + '" target="_blank" rel="noreferrer noopener">' +
      '<img src="' + esc(ph.thumb_url || ph.web_url || '') + '" alt="" loading="lazy" />' +
      (ph.kind === 'before' ? '<span>Before</span>' : '') +
    '</a>';
  }

  // ── Photos on their way, as the page shows them ───────────────────────
  // Targets: 'task:<id>:completion', 'task:<id>:before' and 'site' (the field
  // report). One queue for the page, created on the first photo.
  var queue = null;
  var consumed = {};     // queue item id -> its tile is no longer shown
  var toldSaved = {};    // queue item id -> an empty Save already said where it went
  var landedAt = {};     // queue item id -> loadCount when it landed
  var skipFresh = {};    // target key -> the last pick skipped a duplicate
  var landedSinceIdle = false;
  var idleTimer = null;

  function taskKey(taskId, kind) {
    return 'task:' + taskId + ':' + kind;
  }

  function itemsOf(key) {
    return queue ? queue.items(key) : [];
  }

  function seenItem(it) {
    if (consumed[it.id]) return true;
    var ph = it.result && it.result.photo;
    if (ph && ph.id != null) return !!serverIds[String(ph.id)];
    return landedAt[it.id] != null && loadCount > landedAt[it.id];
  }

  // Landed photos the last read does not show yet, as normal tiles.
  function landedOf(key) {
    return itemsOf(key).filter(function (it) { return it.state === 'done' && !seenItem(it); }).map(function (it) {
      var ph = (it.result && it.result.photo) || {};
      var kind = ph.kind || (/:before$/.test(key) ? 'before' : 'completion');
      return { id: ph.id, kind: kind, thumb_url: ph.thumb_url || it.previewUrl || '', web_url: ph.web_url || ph.thumb_url || '' };
    });
  }

  function pendingOf(key) {
    return itemsOf(key).filter(function (it) {
      return it.state === 'preparing' || it.state === 'waiting' || it.state === 'uploading' ||
        it.state === 'failed' || it.state === 'refused';
    });
  }

  function busyCount(key) {
    return itemsOf(key).filter(function (it) {
      return it.state === 'preparing' || it.state === 'waiting' || it.state === 'uploading';
    }).length;
  }

  var TILE_STATE = { preparing: 'Sending…', uploading: 'Sending…', failed: 'Not sent', refused: 'Not sent' };

  function tileHTML(it) {
    var label = it.state === 'waiting' ? (it.attempts > 0 ? 'Retrying' : 'Waiting') : (TILE_STATE[it.state] || 'Waiting');
    return '<span class="shot pending" data-up="' + esc(it.id) + '">' +
      (it.previewUrl ? '<img src="' + esc(it.previewUrl) + '" alt="" />' : '') +
      '<span class="st">' + esc(label) + '</span></span>';
  }

  function pendHTML(key) {
    return landedOf(key).map(shotHTML).join('') + pendingOf(key).map(tileHTML).join('');
  }

  // The status line under a target: "Uploading 3 of 6…", "4 of 6 added. 2
  // didn't go through." with Retry and Clear, and nothing once every photo of
  // the batch is on the page.
  function upqInner(key) {
    if (!queue) return '';
    var s = queue.summary(key);
    var bad = s.failed + s.refused;
    var moving = s.active + s.waiting;
    var unseen = itemsOf(key).some(function (it) { return it.state === 'done' && !seenItem(it); });
    if (!moving && !bad && !unseen && !(s.skipped && skipFresh[key])) return '';
    if (!(s.skipped && skipFresh[key])) s.skipped = 0;
    var text = PQ.statusText(s);
    if (!text) return '';
    return '<span class="upq-t">' + esc(text) + '</span>' +
      (bad
        ? '<span class="upq-acts">' +
            (s.failed ? '<button type="button" class="btn small upq-retry" data-key="' + esc(key) + '">Retry</button>' : '') +
            '<button type="button" class="btn small upq-clear" data-key="' + esc(key) + '">Clear</button>' +
          '</span>'
        : '');
  }

  function upqBad(key) {
    if (!queue) return false;
    var s = queue.summary(key);
    return s.failed + s.refused > 0;
  }

  function upqElHTML(key, id) {
    var inner = upqInner(key);
    return '<div' + (id ? ' id="' + esc(id) + '"' : '') + ' class="upq' + (upqBad(key) ? ' bad' : '') +
      '" role="status" aria-live="polite" data-key="' + esc(key) + '"' + (inner ? '' : ' hidden') + '>' + inner + '</div>';
  }

  function paintUpq(el, key) {
    if (!el) return;
    var inner = upqInner(key);
    el.innerHTML = inner;
    el.hidden = !inner;
    el.classList.toggle('bad', upqBad(key));
  }

  function buildingState(x) {
    var photos = x.photos || [];
    var cKey = taskKey(x.id, 'completion');
    var bKey = taskKey(x.id, 'before');
    var landedC = landedOf(cKey).length;
    var landedB = landedOf(bKey).length;
    var before = photos.filter(function (ph) { return ph.kind === 'before'; }).length;
    return {
      cKey: cKey,
      bKey: bKey,
      completion: photos.length - before + landedC,
      before: before + landedB,
      total: photos.length + landedC + landedB,
      busy: busyCount(cKey) + busyCount(bKey) > 0,
      showBefore: before + landedB > 0 || pendingOf(bKey).length > 0 || !!upqInner(bKey)
    };
  }

  function openFlagsOf(taskId) {
    return (flagsByTask[String(taskId)] || []).filter(function (f) { return f.status === 'open'; });
  }

  // One chip on the building's head, in this order: a problem waiting on the
  // office, Done, sent back by the office, then the photo count.
  function chipHTML(x, s) {
    if (openFlagsOf(x.id).length) return '<span class="chip flag">Needs office</span>';
    return x.done
      ? '<span class="chip ok">&#x2713; Done</span>'
      : sentBackIds[String(x.id)]
        ? '<span class="chip back">Sent back</span>'
        : (s.completion
            ? '<span class="chip n">' + s.total + ' photo' + (s.total === 1 ? '' : 's') + '</span>'
            : '<span class="chip need">Needs photo</span>');
  }

  // Finished / undo. A completion photo still on its way counts only once it
  // lands, so the button waits for the uploads rather than refusing.
  function doneAreaHTML(x, p, s) {
    if (x.done) {
      return '<button type="button" class="btn quiet big bdone" data-done="0"' + (doneBusy[x.id] ? ' disabled' : '') + '>Undo — not finished</button>';
    }
    if (s.busy) {
      return '<div class="need-hint">Wait for the photos to finish uploading.</div>' +
        '<button type="button" class="btn go big bdone" data-done="1" disabled>Mark ' + esc(p.head) + ' complete</button>';
    }
    return (s.completion ? '' : '<div class="need-hint">Add at least one completion photo first.</div>') +
      '<button type="button" class="btn go big bdone" data-done="1"' + (s.completion && !doneBusy[x.id] ? '' : ' disabled') + '>Mark ' + esc(p.head) + ' complete</button>';
  }

  function buildingHTML(x, canWork, t) {
    var p = parseTitle(x.title);
    var photos = x.photos || [];
    var after = photos.filter(function (ph) { return ph.kind !== 'before'; });
    var before = photos.filter(function (ph) { return ph.kind === 'before'; });
    var s = buildingState(x);
    var completion = s.completion;
    var notes = x.notes || [];
    var open = !!openCards[x.id];
    var bnoteDraft = drafts.bnotes[x.id] || '';
    // The line under the building name is the repairs themselves, cut off by
    // CSS at the card's edge — what a crew scans 21 cards for is "which one
    // had the stringer", which a count per side never said.
    var summary = p.sides.map(function (sd) { return sd.items.join(' · '); }).join(' · ');

    return '<div class="bld' + (x.done ? ' done' : '') + (open ? ' open' : '') + '" data-task="' + esc(x.id) + '">' +
      '<button type="button" class="bld-head" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        '<span class="bld-name"><b>' + esc(p.head) + '</b>' + (summary ? '<small>' + esc(summary) + '</small>' : '') + '</span>' +
        chipHTML(x, s) +
        '<span class="caret" aria-hidden="true">&#x203A;</span>' +
      '</button>' +
      '<div class="bld-body"' + (open ? '' : ' hidden') + '>' +
        p.sides.map(function (sd) {
          return '<div class="side">' + (sd.label ? '<div class="side-l">' + esc(sd.label) + '</div>' : '') +
            '<ul>' + sd.items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul></div>';
        }).join('') +
        // Completion photos as square tiles. When this link can work, the
        // two dashed tiles at the end are labels around the completion-photo
        // file inputs: Take photo carries capture="environment", so a tap
        // opens the back camera (one photo a tap); Upload photo has no capture,
        // so it opens the photo library and takes many at once. Android's
        // library picker offers no camera, which is why both exist. Photos on
        // their way sit in .pend, before those two tiles.
        (completion || canWork
          ? '<div class="photos" data-sec="completion"><div class="lbl">Completion photos · ' + completion + '</div>' +
              '<div class="shots">' + after.map(shotHTML).join('') +
                '<span class="pend">' + pendHTML(s.cKey) + '</span>' +
                (canWork
                  ? '<label class="th-add th-cam" tabindex="0" role="button">' +
                      CAM_ICON(24) + 'Take photo' +
                      '<input type="file" accept="image/*" capture="environment" data-kind="completion" />' +
                    '</label>' +
                    '<label class="th-add" tabindex="0" role="button">' +
                      '<span class="plus" aria-hidden="true">+</span>Upload photo' +
                      '<input type="file" accept="image/*" multiple data-kind="completion" />' +
                    '</label>'
                  : '') +
              '</div>' + upqElHTML(s.cKey) + '</div>'
          : '') +
        (before.length || canWork
          ? '<div class="photos" data-sec="before"' + (s.showBefore ? '' : ' hidden') + '>' +
              '<div class="lbl">Before photos · ' + s.before + '</div>' +
              '<div class="shots">' + before.map(shotHTML).join('') +
                '<span class="pend">' + pendHTML(s.bKey) + '</span></div>' +
              upqElHTML(s.bKey) + '</div>'
          : '') +
        (canWork
          ? '<div class="before-add">' +
              '<label class="btn small file-btn cam-btn" tabindex="0" role="button">' + CAM_ICON(16) +
                'Take before photo<input type="file" accept="image/*" capture="environment" data-kind="before" /></label>' +
              '<label class="btn small file-btn" tabindex="0" role="button">Upload before photo<input type="file" accept="image/*" multiple data-kind="before" /></label>' +
            '</div>'
          : '') +
        (notes.length
          ? '<div class="bnotes">' + notes.map(function (n) {
              return '<div class="bnote"><small>' + esc(n.by || '') + (n.at ? ' · ' + esc(fmtWhen(n.at)) : '') + '</small>' + esc(n.note) + '</div>';
            }).join('') + '</div>'
          : '') +
        (x.done && x.completed_by
          ? '<div class="stamp">Completed by ' + esc(x.completed_by) + (x.completed_at ? ' · ' + esc(fmtWhen(x.completed_at)) : '') + '</div>'
          : '') +
        ((flagsByTask[String(x.id)] || []).length
          ? '<div class="flags"><div class="lbl">Flagged for the office</div>' +
              flagsByTask[String(x.id)].map(flagHTML).join('') + '</div>'
          : '') +
        (canWork
          ? '<div class="flag-slot" data-flag-key="' + esc('t:' + x.id) + '">' + flagSlotHTML('t:' + x.id) + '</div>'
          : '') +
        (canWork
          ? '<div class="note-row">' +
              '<input type="text" class="bnote-in" data-task="' + esc(x.id) + '" placeholder="Add a note for this building" maxlength="2000" value="' + esc(bnoteDraft) + '" />' +
              '<button type="button" class="btn bnote-go">Add</button>' +
            '</div>' +
            restoredHint('bnote:' + x.id, !!(restored.bnotes[x.id] && bnoteDraft)) +
            '<div class="bdone-wrap">' + doneAreaHTML(x, p, s) + '</div>' +
            '<div class="msg"></div>'
          : '') +
      '</div>' +
    '</div>';
  }

  function cardFor(taskId) {
    var cards = root.querySelectorAll('.bld');
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].getAttribute('data-task') === String(taskId)) return cards[i];
    }
    return null;
  }

  function taskFor(taskId) {
    var tasks = (lastData && lastData.tasks) || [];
    for (var i = 0; i < tasks.length; i++) {
      if (String(tasks[i].id) === String(taskId)) return tasks[i];
    }
    return null;
  }

  function sayFor(taskId, text, bad) {
    var card = cardFor(taskId);
    var cmsg = card && card.querySelector('.msg');
    if (cmsg) { cmsg.textContent = text; cmsg.className = 'msg' + (bad ? ' bad' : ''); }
  }

  // Repaints one building's photo tiles, counts, status lines and finish
  // button in place. The file inputs and the note box are left alone, so a
  // photo landing never closes a picker or takes the keyboard away.
  function paintCard(taskId) {
    var card = cardFor(taskId);
    var x = taskFor(taskId);
    if (!card || !x) return;
    var p = parseTitle(x.title);
    var s = buildingState(x);
    var chip = card.querySelector('.bld-head .chip');
    if (chip) chip.outerHTML = chipHTML(x, s);
    var cSec = card.querySelector('.photos[data-sec="completion"]');
    if (cSec) {
      cSec.querySelector('.lbl').textContent = 'Completion photos · ' + s.completion;
      cSec.querySelector('.pend').innerHTML = pendHTML(s.cKey);
      paintUpq(cSec.querySelector('.upq'), s.cKey);
    }
    var bSec = card.querySelector('.photos[data-sec="before"]');
    if (bSec) {
      bSec.hidden = !s.showBefore;
      bSec.querySelector('.lbl').textContent = 'Before photos · ' + s.before;
      bSec.querySelector('.pend').innerHTML = pendHTML(s.bKey);
      paintUpq(bSec.querySelector('.upq'), s.bKey);
    }
    var wrap = card.querySelector('.bdone-wrap');
    if (wrap) {
      wrap.innerHTML = doneAreaHTML(x, p, s);
      wireDone(card, String(taskId));
    }
  }

  function reportTilesHTML() {
    return pendHTML('site');
  }

  function paintReportPhotos() {
    var shots = document.getElementById('rshots');
    if (shots) {
      var tiles = reportTilesHTML();
      shots.innerHTML = tiles;
      shots.hidden = !tiles;
    }
    paintUpq(document.getElementById('rupq'), 'site');
  }

  function paintTarget(key) {
    if (!alive()) return;
    if (key === 'site') { paintReportPhotos(); return; }
    var f = /^flag:(.+)$/.exec(String(key));
    if (f) {
      var formKey = formKeyOfFlag(f[1]);
      if (formKey != null) paintFlagSlot(formKey);
      return;
    }
    var m = /^task:(.+):(completion|before)$/.exec(String(key));
    if (m) paintCard(m[1]);
  }

  // What one photo POST sends, in this order, so the server has the kind, the
  // name and the upload id before the file's bytes arrive. Three doors: a
  // building (target.taskId), a problem report (target.flagId) and the work
  // order itself (the field report).
  function sendPhoto(item, signal) {
    if (!alive()) {
      var gone = new Error('This page was closed.');
      gone.status = 410;
      return Promise.reject(gone);
    }
    var target = item.target || {};
    var toFlag = target.flagId != null;
    var fd = new FormData();
    if (target.kind) fd.append('kind', target.kind);
    if (crewName.trim() && !toFlag) fd.append('name', crewName.trim());
    fd.append('upload_id', item.uploadId);
    fd.append('file', item.blob || item.file, item.name);
    var base = '/api/service-ticket-share/' + encodeURIComponent(token);
    var url = toFlag
      ? base + '/flags/' + encodeURIComponent(target.flagId) + '/photo'
      : target.taskId != null
        ? base + '/subtasks/' + encodeURIComponent(target.taskId) + '/photo'
        : base + '/photo';
    var init = { method: 'POST', body: fd, cache: 'no-store', signal: signal };
    // The problem door checks its photo cap, its 2 hours and whether the
    // office resolved it BEFORE it reads the upload. The upload id rides in a
    // header too, so a retried photo that already landed is recognised there
    // instead of being refused.
    if (toFlag) init.headers = { 'X-Upload-Id': item.uploadId };
    return fetch(url, init).then(function (r) {
      return readJSON(r, 'That photo could not be uploaded.');
    }).then(null, function (err) {
      // A 409 from the problem door is about that one problem (resolved, full,
      // past its 2 hours). The queue stops every waiting photo on a 409, so it
      // is passed on as a plain refusal of this photo alone; building photos
      // waiting behind it still go.
      if (toFlag && err && Number(err.status) === 409) err.status = 400;
      throw err;
    }).then(function (data) {
      // A 200 that is not the server's answer (a Wi-Fi sign-in page, a proxy)
      // stored nothing: treat it as the signal, so it retries under the same
      // upload id and ends "Not sent" with Retry instead of vanishing.
      if (!data || data.ok !== true) {
        var lost = new Error("That photo didn't reach the server.");
        lost.status = 0;
        throw lost;
      }
      return data;
    });
  }

  function queueChanged(item) {
    if (!alive()) return;
    if (item.state === 'done' && landedAt[item.id] == null) {
      landedAt[item.id] = loadCount;
      landedSinceIdle = true;
    }
    paintTarget(item.key);
    if (item.key === 'site' && reportWait) {
      if (busyCount('site')) paintReportWait();
      else sendReport(reportWait.complete);
    }
    if (/^flag:/.test(item.key)) settleFlagPhotos(item.key);
  }

  // Everything settled: one quiet read shows what landed.
  function queueIdle() {
    if (!alive() || !landedSinceIdle) return;
    landedSinceIdle = false;
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      idleTimer = null;
      if (alive()) load({ after: 'saved' });
    }, 600);
  }

  function addPhotos(files, target) {
    if (!queue) queue = PQ.createQueue({ send: sendPhoto, onChange: queueChanged, onIdle: queueIdle });
    var res = queue.add(files, target);
    if (res.skipped) skipFresh[target.key] = true;
    paintTarget(target.key);
    return res;
  }

  // Every subtask call goes through the same door and shows the server's
  // refusal verbatim — an approved work order, a missing photo, a revoked link.
  function taskPost(taskId, path, payload) {
    return fetch('/api/service-ticket-share/' + encodeURIComponent(token) + '/subtasks/' +
        encodeURIComponent(taskId) + '/' + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify(payload)
    }).then(function (r) {
      return readJSON(r, 'That could not be saved.');
    });
  }

  // A photo button that is a LABEL around its file input opens on a tap, but
  // a keyboard cannot press a label. Enter or Space opens the same input.
  function openFileOnKey(lab) {
    lab.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      var inp = lab.querySelector('input[type=file]');
      if (inp) inp.click();
    });
  }

  function wireDone(card, id) {
    var doneBtn = card.querySelector('.bdone');
    if (!doneBtn) return;
    doneBtn.addEventListener('click', function () {
      if (doneBtn.disabled || doneBusy[id]) return;
      doneBusy[id] = true;
      doneBtn.disabled = true;
      sayFor(id, 'Saving…');
      taskPost(id, 'done', { done: doneBtn.getAttribute('data-done') === '1', name: crewName.trim() || undefined })
        .then(function () {
          delete doneBusy[id];
          sayFor(id, 'Saved.');
          load({ after: 'saved' });
        })
        .catch(function (e) {
          delete doneBusy[id];
          paintCard(id);
          sayFor(id, saveError(e), true);
        });
    });
  }

  function wireBuildings(tasks, canWork) {
    var byId = {};
    tasks.forEach(function (x) { byId[String(x.id)] = x; });
    Array.prototype.forEach.call(document.querySelectorAll('.bld'), function (card) {
      var id = card.getAttribute('data-task');
      var head = card.querySelector('.bld-head');
      var body = card.querySelector('.bld-body');

      head.addEventListener('click', function () {
        var open = body.hidden;
        body.hidden = !open;
        card.classList.toggle('open', open);
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) openCards[id] = true; else delete openCards[id];
      });
      if (!canWork || !byId[id]) return;

      // The photo tiles and the before-photo buttons are LABELS around their
      // file inputs, which a tap opens but a keyboard cannot press. Enter or
      // Space opens the same input.
      Array.prototype.forEach.call(card.querySelectorAll('label[role=button]'), openFileOnKey);

      // Each picked photo joins the page's upload queue at once and shows as
      // a tile; the queue sends them one at a time and keeps trying.
      Array.prototype.forEach.call(card.querySelectorAll('input[type=file]'), function (inp) {
        // A problem report's photo inputs belong to its form, which binds them
        // itself (wireFlagPhotoInputs) — never to the building's completion or
        // before photos.
        if (inp.hasAttribute('data-flag-key')) return;
        inp.addEventListener('change', function () {
          var files = Array.prototype.slice.call(inp.files || []);
          inp.value = '';
          if (!files.length) return;
          var kind = inp.getAttribute('data-kind') === 'before' ? 'before' : 'completion';
          openCards[id] = true;
          addPhotos(files, { key: taskKey(id, kind), taskId: id, kind: kind });
        });
      });

      var noteIn = card.querySelector('.bnote-in');
      var noteGo = card.querySelector('.bnote-go');
      if (noteIn) noteIn.addEventListener('input', function () {
        if (noteIn.value) drafts.bnotes[id] = noteIn.value.slice(0, NOTE_MAX);
        else delete drafts.bnotes[id];
        if (restored.bnotes[id]) { delete restored.bnotes[id]; dropHint('bnote:' + id); }
        saveDraftSoon();
      });
      function addNote() {
        var text = (noteIn.value || '').trim();
        if (!text) { sayFor(id, 'Write something first.', true); return; }
        noteGo.disabled = true;
        // client_ref: one key per unsent note, sent again on every retry, so a
        // save that landed and lost its answer is not a second note.
        taskPost(id, 'note', { note: text, name: crewName.trim() || undefined, client_ref: bnoteRef(id) }).then(function () {
          delete drafts.bnotes[id];
          delete drafts.bnoteRefs[id];
          delete restored.bnotes[id];
          persistDrafts();
          noteIn.value = '';
          noteGo.disabled = false;
          openCards[id] = true;
          sayFor(id, 'Note added.');
          load({ after: 'saved' });
        }).catch(function (e) { noteGo.disabled = false; sayFor(id, saveError(e), true); });
      }
      if (noteGo) noteGo.addEventListener('click', addNote);
      if (noteIn) noteIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addNote(); } });

      wireDone(card, id);
    });
  }

  // The revision door. Deliberately its OWN submit, separate from the field
  // report: filing what you did and suggesting what the job should be are
  // different acts with different consequences, and merging them into one
  // button would let a crew member change the scope while meaning to log a
  // note.
  function wirePropose(d, t) {
    var btn = document.getElementById('propose');
    var box = document.getElementById('scope');
    if (!btn || !box) return;
    // Compared with the SERVER's scope, never with a restored draft: a draft
    // that differs from the work order is a change worth sending.
    var original = t.scope_proposed || '';

    function pmsg(text, bad) {
      var m = document.getElementById('pmsg');
      if (m) { m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); }
    }
    if (proposeNote) pmsg(proposeNote);

    box.addEventListener('input', function () {
      proposeNote = null;
      drafts.scope = box.value === original ? '' : box.value.slice(0, SCOPE_MAX);
      if (restored.scope) { restored.scope = false; dropHint('scope'); }
      saveDraftSoon();
    });

    btn.addEventListener('click', function () {
      var next = box.value;
      if (next === original) { pmsg('Change the scope first.', true); return; }
      btn.disabled = true;
      proposeNote = null;
      pmsg('Sending…');
      var nameEl = document.getElementById('crewname');
      fetch('/api/service-ticket-share/' + encodeURIComponent(token) + '/revision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        cache: 'no-store',
        body: JSON.stringify({
          // Only the scope. The page sends nothing else, and the server
          // filters again anyway — status, assignment and approval are not
          // proposable at all.
          fields: { scope_proposed: next },
          name: (nameEl && nameEl.value) || undefined
        })
      }).then(function (r) {
        return readJSON(r, 'That could not be sent.');
      }).then(function () {
        original = next;
        drafts.scope = '';
        restored.scope = false;
        persistDrafts();
        btn.disabled = false;
        proposeNote = 'Sent to the office. They will accept or decline it — the work order still reads as it did.';
        pmsg(proposeNote);
        load({ after: 'saved' });
      }).catch(function (e) {
        btn.disabled = false;
        pmsg(saveError(e), true);
      });
    });
  }

  function msg(text, bad) {
    var m = document.getElementById('msg');
    if (m) { m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); }
  }

  function send(body) {
    return fetch('/api/service-ticket-share/' + encodeURIComponent(token), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify(body)
    }).then(function (r) {
      return readJSON(r, 'That could not be saved.');
    });
  }

  function collect(extra) {
    var body = extra || {};
    var noteEl = document.getElementById('note');
    var nameEl = document.getElementById('crewname');
    if (noteEl && noteEl.value.trim()) body.note = noteEl.value;
    if (nameEl && nameEl.value.trim()) body.name = nameEl.value;
    // Only a body that carries a note carries the note's key: a finish or a
    // name on its own has nothing to say twice.
    if (body.note) body.client_ref = noteRef();
    return body;
  }

  // The finish card's own message line.
  function fmsg(text, bad) {
    var m = document.getElementById('fmsg');
    if (m) { m.textContent = text; m.className = 'msg' + (bad ? ' bad' : ''); }
  }

  // The finish card's answer buttons (Finish itself follows the punch list).
  function finishButtons(disabled) {
    ['finishYes', 'finishNo', 'finishUndo'].forEach(function (id) {
      var b = document.getElementById(id);
      if (b) b.disabled = disabled;
    });
  }

  function reportButtons(disabled) {
    var saveBtn = document.getElementById('save');
    if (saveBtn) saveBtn.disabled = disabled;
    finishButtons(disabled);
  }

  function paintReportWait() {
    var n = busyCount('site');
    reportButtons(true);
    var photos = n + (n === 1 ? ' photo' : ' photos');
    if (reportWait && reportWait.complete) {
      fmsg('Waiting for ' + photos + ' to finish, then the work order will be finished.');
    } else {
      msg('Waiting for ' + photos + ' to finish, then your note will be saved.');
    }
  }

  // Save report and Finish whole work order send the note with the photos
  // picked for the report: while any of those is still on its way, they wait
  // for it, then send once.
  function startReport(complete) {
    reportNote = null;
    if (busyCount('site')) {
      reportWait = { complete: complete };
      paintReportWait();
      return;
    }
    sendReport(complete);
  }

  // Report photos that landed and that no save or empty-Save answer has
  // accounted for yet.
  function unreportedSite() {
    return itemsOf('site').filter(function (it) {
      return it.state === 'done' && !consumed[it.id] && !toldSaved[it.id];
    });
  }

  function sendReport(complete) {
    reportWait = null;
    var body = collect(complete ? { status: 'work_complete' } : null);
    // The empty-note answer is decided on the note alone: a name typed on
    // the link does not make an empty Save a report.
    if (!complete && !body.note) {
      var fresh = unreportedSite();
      if (fresh.length) {
        fresh.forEach(function (it) { toldSaved[it.id] = true; });
        reportButtons(false);
        msg('Your photos are saved under Site photos. Write a note if you want to add one.');
        return;
      }
      if (!body.name) {
        reportButtons(false);
        msg('Write something first.', true);
        return;
      }
    }
    // Finishing answers in its own card; a report under the report.
    var say = complete ? fmsg : msg;
    reportButtons(true);
    say('Saving…');
    send(body).then(function () {
      var s = queue ? queue.summary('site') : null;
      var failed = s ? s.failed : 0;
      var refused = s ? s.refused : 0;
      if (body.note) {
        drafts.note = '';
        // The next note is a NEW note: the key that saved is spent.
        drafts.noteRef = '';
        restored.note = false;
        persistDrafts();
        var noteEl = document.getElementById('note');
        if (noteEl) noteEl.value = '';
        dropHint('note');
      }
      // The report's landed photos now belong to Site photos.
      itemsOf('site').forEach(function (it) { if (it.state === 'done') consumed[it.id] = true; });
      paintReportPhotos();
      reportButtons(false);
      if (complete) {
        // The job is marked: Yes stays off until the next read draws the card
        // as finished, so a failed refresh cannot invite a second one.
        finishOpen = false;
        finishButtons(true);
        fmsg('Saved.');
      } else {
        reportNote = {
          text: failed
            ? 'Report saved. ' + failed + (failed === 1 ? ' photo' : ' photos') + " didn't go through — tap Retry above."
            : refused
              ? 'Report saved. ' + refused + (refused === 1 ? ' photo' : ' photos') + " didn't go through."
              : 'Report saved.',
          bad: false
        };
        msg(reportNote.text);
      }
      load({ after: 'saved' });
    }).catch(function (e) {
      reportButtons(false);
      say(saveError(e), true);
    });
  }

  // ── Finish whole work order ───────────────────────────────────────────
  // "18 of 21 buildings aren't finished. ..." — the server's counting words.
  function openBuildingsLine(open, total) {
    return open + ' of ' + total + ' ' + (total === 1 ? 'building' : 'buildings') + ' ' +
      (open === 1 ? "isn't" : "aren't") + ' finished. Mark each building complete above — ' +
      'when the last one is done, the office is told automatically.';
  }

  function finishQuestion(n) {
    return 'Finish the whole work order? ' +
      (n ? 'All ' + n + (n === 1 ? ' building is done.' : ' buildings are done.') : 'This work order has no punch list.') +
      ' The office will be asked to approve it.';
  }

  // Drawn only when the link can work the punch list (canWork). At Work
  // complete: the stamp and, while the office has not acted, Undo. Before
  // that: Finish, off while any building is open.
  function finishCardHTML(d, t, tasks, done) {
    var inner;
    if (t.status === 'work_complete') {
      finishOpen = false;
      inner = '<div class="done-note">Marked work complete. The office will review it.</div>' +
        (d.finish && d.finish.can_undo
          ? '<button type="button" id="finishUndo" class="btn quiet big">Undo — not finished yet</button>' +
            '<div class="hint">You can take this back until the office acts on it.</div>'
          : '');
    } else if (tasks.length && done < tasks.length) {
      finishOpen = false;
      inner = '<button type="button" id="finishBtn" class="btn go big" disabled>Finish whole work order</button>' +
        '<div class="hint">' + esc(openBuildingsLine(tasks.length - done, tasks.length)) + '</div>';
    } else {
      inner = '<button type="button" id="finishBtn" class="btn go big"' + (finishOpen ? ' hidden' : '') + '>Finish whole work order</button>' +
        '<div class="hint">Tells the office the whole job is done and ready for approval.</div>' +
        '<div id="finishConfirm" class="finish-confirm" role="group" aria-label="Finish the whole work order"' + (finishOpen ? '' : ' hidden') + '>' +
          '<div class="finish-q">' + esc(finishQuestion(tasks.length)) + '</div>' +
          '<div class="finish-acts">' +
            '<button type="button" id="finishYes" class="btn go">Yes, finish it</button>' +
            '<button type="button" id="finishNo" class="btn quiet">Cancel</button>' +
          '</div>' +
        '</div>';
    }
    return '<div class="card" id="finishCard">' + inner +
      '<div id="fmsg" class="msg" role="status" aria-live="polite"></div></div>';
  }

  function wireFinish(d) {
    var btn = document.getElementById('finishBtn');
    var box = document.getElementById('finishConfirm');
    var yes = document.getElementById('finishYes');
    var no = document.getElementById('finishNo');
    var undo = document.getElementById('finishUndo');

    if (btn && box) btn.addEventListener('click', function () {
      if (btn.disabled) return;
      finishOpen = true;
      box.hidden = false;
      btn.hidden = true;
      fmsg('');
      if (yes && typeof yes.focus === 'function') yes.focus();
    });

    if (no && box) no.addEventListener('click', function () {
      if (no.disabled) return;
      finishOpen = false;
      box.hidden = true;
      if (btn) { btn.hidden = false; if (typeof btn.focus === 'function') btn.focus(); }
    });

    // The typed note and name ride along (collect), after any report photo
    // still on its way (startReport).
    if (yes) yes.addEventListener('click', function () {
      if (yes.disabled) return;
      startReport(true);
    });

    if (undo) undo.addEventListener('click', function () {
      if (undo.disabled) return;
      undo.disabled = true;
      fmsg('Saving…');
      send({ status: 'in_progress' }).then(function () {
        fmsg('Saved.');
        load({ after: 'saved' });
      }).catch(function (e) {
        undo.disabled = false;
        fmsg(saveError(e), true);
      });
    });

    if (reportWait && reportWait.complete) paintReportWait();
  }

  function wireReport(d) {
    var saveBtn = document.getElementById('save');
    var photoInput = document.getElementById('photo');
    var noteBox = document.getElementById('note');

    if (noteBox) noteBox.addEventListener('input', function () {
      reportNote = null;
      drafts.note = noteBox.value.slice(0, NOTE_MAX);
      if (restored.note) { restored.note = false; dropHint('note'); }
      saveDraftSoon();
    });

    if (saveBtn) saveBtn.addEventListener('click', function () { startReport(false); });

    // Take photo and Upload photo put their photos in the page's upload queue
    // for the work order's photo door, straight away.
    [document.getElementById('photoCam'), photoInput].forEach(function (inp) {
      if (!inp) return;
      inp.addEventListener('change', function () {
        var files = Array.prototype.slice.call(inp.files || []);
        inp.value = '';
        if (!files.length) return;
        addPhotos(files, { key: 'site' });
      });
    });

    // The two photo buttons are labels around their file inputs, as on the
    // building cards (openFileOnKey).
    Array.prototype.forEach.call(document.querySelectorAll('#report label[role=button]'), openFileOnKey);

    if (reportWait && !reportWait.complete) paintReportWait();
    else if (reportNote) msg(reportNote.text, reportNote.bad);
  }

  // ── Sent back by the office ───────────────────────────────────────────
  // sb: { note, at, buildings: [{ id, title, note, reopened }] } — the office's
  // reason and the buildings it reopened. No names, nothing else.
  function sentBackHTML(sb) {
    var blds = Array.isArray(sb.buildings) ? sb.buildings.filter(Boolean) : [];
    var when = fmtWhen(sb.at);
    return '<div class="card sentback" role="alert">' +
      '<div class="lbl">Sent back by the office' + (when ? ' · ' + esc(when) : '') + '</div>' +
      '<div class="sb-note">' + esc(sb.note) + '</div>' +
      (blds.length
        ? '<div class="sb-bld-lbl">Buildings to redo</div><ul class="sb-bld">' + blds.map(function (b) {
            return '<li><b>' + esc(parseTitle(b.title).head) + '</b>' + (b.note ? ' — ' + esc(b.note) : '') + '</li>';
          }).join('') + '</ul>'
        : '') +
      '<div class="hint">' + (blds.length
        ? 'Fix these, add a new completion photo to each, and mark each building complete again. The office is told when every building is done.'
        : 'Fix this, then mark the work complete again. The office is told when it’s done.') + '</div>' +
    '</div>';
  }

  // ── Flag a problem ────────────────────────────────────────────────────
  // A form key is 'ticket' (the whole work order) or 't:<building id>'. What
  // was typed lives in flagForms, so a redraw keeps it, and in the draft store
  // under 'flag:<key>', so a closed tab keeps it too. The photos picked go to
  // the page's upload queue under 'flag:<problem id>' once the problem is
  // stored.
  function taskIdOfKey(key) {
    var m = /^t:(.+)$/.exec(String(key));
    return m ? m[1] : null;
  }

  function newClientRef() {
    var s = '';
    try {
      var c = window.crypto || window.msCrypto;
      if (c && typeof c.getRandomValues === 'function') {
        var a = new Uint8Array(8);
        c.getRandomValues(a);
        for (var i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2);
      }
    } catch (e) { s = ''; }
    while (s.length < 16) s += Math.floor(Math.random() * 16).toString(16);
    return s.slice(0, 16);
  }

  // phase: 'edit' (being written or sent), 'uploading' (stored, photos going),
  // 'partial' (stored, some photos did not go).
  function newFlagForm(o) {
    o = o || {};
    return {
      open: true,
      phase: 'edit',
      category: o.category || '',
      note: o.note || '',
      files: [],
      clientRef: o.clientRef || newClientRef(),
      flagId: null,
      sending: false,
      msg: null,
      restored: !!o.restored
    };
  }

  function formKeyOfFlag(flagId) {
    for (var k in flagForms) {
      if (Object.prototype.hasOwnProperty.call(flagForms, k) && flagForms[k].flagId === String(flagId)) return k;
    }
    return null;
  }

  function flagHeadOf(key) {
    var tid = taskIdOfKey(key);
    if (tid == null) return null;
    var x = taskFor(tid);
    return x ? parseTitle(x.title).head : null;
  }

  function saveFlagDraft(key) {
    var f = flagForms[key];
    if (f && f.phase === 'edit' && (f.category || f.note)) {
      drafts.flags['flag:' + key] = { category: f.category, note: f.note.slice(0, NOTE_MAX), client_ref: f.clientRef };
    } else {
      delete drafts.flags['flag:' + key];
    }
    saveDraftSoon();
  }

  function dropFlagDraft(key) {
    delete drafts.flags['flag:' + key];
    persistDrafts();
  }

  // One raised problem, as every link sees it.
  function flagHTML(f) {
    var resolved = f.status === 'resolved';
    var photos = Array.isArray(f.photos) ? f.photos : [];
    var head = [CATEGORY_CREW[f.category] || CATEGORY_CREW.other, f.author_label, fmtWhen(f.created_at)].filter(Boolean).join(' · ');
    var resolvedAt = fmtWhen(f.resolved_at);
    return '<div class="flag' + (resolved ? ' resolved' : '') + '" data-flag="' + esc(f.id) + '">' +
      '<div class="flag-h">' + esc(head) + '</div>' +
      '<div class="flag-n">' + esc(f.note || '') + '</div>' +
      (photos.length
        ? '<div class="flag-shots">' + photos.map(function (ph) {
            return '<a class="shot" href="' + esc(ph.web_url || ph.thumb_url || '') + '" target="_blank" rel="noreferrer noopener">' +
              '<img src="' + esc(ph.thumb_url || ph.web_url || '') + '" alt="" loading="lazy" /></a>';
          }).join('') + '</div>'
        : '') +
      (resolved
        ? '<div class="flag-state flag-res">Resolved by the office' + (resolvedAt ? ' · ' + esc(resolvedAt) : '') + '</div>' +
          (f.resolution_note ? '<div class="flag-res-note">' + esc(f.resolution_note) + '</div>' : '')
        : '<div class="flag-state">Waiting on the office</div>') +
    '</div>';
  }

  function problemsCardHTML(tasks, canWork) {
    var waiting = tasks.filter(function (x) { return openFlagsOf(x.id).length > 0; })
      .map(function (x) { return parseTitle(x.title).head; });
    return '<div class="card" id="problems"><div class="lbl">Problems for the office</div>' +
      ticketFlags.map(flagHTML).join('') +
      (waiting.length ? '<div class="hint flag-wait">Waiting on the office: ' + esc(waiting.join(', ')) + '</div>' : '') +
      (canWork ? '<div class="flag-slot" data-flag-key="ticket">' + flagSlotHTML('ticket') + '</div>' : '') +
    '</div>';
  }

  // What sits in a slot: the open form, or the Flag a problem button (with
  // "Sent to the office." above it after a send, until the slot is used
  // again — the reads that follow a send do not take it away).
  function flagSlotHTML(key) {
    var f = flagForms[key];
    if (f && f.open) return flagFormHTML(key, f);
    var n = flagNotices[key];
    return (n ? '<div class="flag-sent" role="status">' + esc(n) + '</div>' : '') +
      '<button type="button" class="btn small flag-open" data-flag-key="' + esc(key) + '">Flag a problem</button>' +
      (key === 'ticket'
        ? '<div class="hint">Can\'t get in, more damage than the scope, short on material, or something unsafe? ' +
            'Tell the office now — don\'t wait for the end of the day.</div>'
        : '');
  }

  function flagMsgHTML(f) {
    return '<div class="flag-msg' + (f.msg && f.msg.bad ? ' bad' : '') + '" role="status" aria-live="polite">' +
      esc(f.msg ? f.msg.text : '') + '</div>';
  }

  function flagPicksHTML(key, f) {
    return f.files.map(function (p, i) {
      return '<span class="shot flag-pend">' +
        (p.url ? '<img src="' + esc(p.url) + '" alt="" />' : '') +
        '<button type="button" class="flag-photo-rm" data-idx="' + i + '" aria-label="Remove photo">&#xD7;</button></span>';
    }).join('');
  }

  // After the problem is stored: its photos on their way, then how it went.
  function flagUploadText(key, f) {
    var s = queue ? queue.summary('flag:' + f.flagId) : null;
    if (!s || !s.total) return '';
    var bad = s.failed + s.refused;
    if (f.phase === 'partial') {
      var lines = ['Sent to the office, but ' + bad + (bad === 1 ? ' photo' : ' photos') + " didn't upload."];
      if (s.refusals.length) lines.push(s.refusals[0].name + " wasn't sent: " + s.refusals[0].message);
      return lines.join('\n');
    }
    return 'Uploading photo ' + s.index + ' of ' + s.total + '…';
  }

  function flagFormHTML(key, f) {
    var head = flagHeadOf(key);
    var title = head ? "What's wrong at " + head + '?' : "What's wrong?";
    var open = '<div class="flagform" data-flag-key="' + esc(key) + '">' +
      '<div class="flag-title">' + esc(title) + '</div>';
    if (f.phase !== 'edit') {
      var s = queue ? queue.summary('flag:' + f.flagId) : { failed: 0 };
      return open +
        '<div class="flag-shots">' + pendHTML('flag:' + f.flagId) + '</div>' +
        '<div class="flag-msg" role="status" aria-live="polite">' + esc(flagUploadText(key, f)) + '</div>' +
        (f.phase === 'partial'
          ? '<div class="flag-acts">' +
              (s.failed ? '<button type="button" class="btn primary flag-retry">Retry photos</button>' : '') +
              '<button type="button" class="btn flag-done">Done</button>' +
            '</div>'
          : '') +
      '</div>';
    }
    var off = f.sending ? ' disabled' : '';
    return open +
      '<div class="flag-cats" role="radiogroup" aria-label="Kind of problem">' + FLAG_CATS.map(function (c) {
        return '<button type="button" class="flag-cat" role="radio" aria-checked="' + (f.category === c ? 'true' : 'false') +
          '" data-cat="' + esc(c) + '"' + off + '>' + esc(CATEGORY_CREW[c]) + '</button>';
      }).join('') + '</div>' +
      '<textarea class="flag-note" data-flag-key="' + esc(key) + '" rows="3" maxlength="2000"' +
        ' placeholder="Say what you found and where — the office reads this first."' + off + '>' + esc(f.note) + '</textarea>' +
      restoredHint('flag:' + key, f.restored && !!(f.note || f.category)) +
      '<div class="flag-shots"' + (f.files.length ? '' : ' hidden') + '>' + flagPicksHTML(key, f) + '</div>' +
      '<div class="flag-pick">' +
        '<button type="button" class="btn small cam-btn flag-pick-btn"' + off + '>' + CAM_ICON(16) + 'Take photo</button>' +
        '<input type="file" class="flag-photo" data-flag-key="' + esc(key) + '" accept="image/*" capture="environment" hidden />' +
        '<button type="button" class="btn small flag-pick-btn"' + off + '>Add photos</button>' +
        '<input type="file" class="flag-photo" data-flag-key="' + esc(key) + '" accept="image/*" multiple hidden />' +
      '</div>' +
      '<div class="hint">The office gets this as soon as you send it.</div>' +
      '<div class="flag-acts">' +
        '<button type="button" class="btn primary flag-send"' + off + '>Send to the office</button>' +
        '<button type="button" class="btn quiet flag-cancel"' + off + '>Cancel</button>' +
      '</div>' +
      flagMsgHTML(f) +
    '</div>';
  }

  // The form's file inputs are bound DIRECTLY, the way wireBuildings and
  // wireReport bind theirs — NOT through the delegated listener below. The page
  // redraws itself in the background while the camera sheet is open (the upload
  // queue settling, the netbar's retry), which detaches the very input the crew
  // is picking into. A detached input's change event reaches neither #root nor
  // document, so a delegated pick is lost with no tile and no message; a
  // listener on the input itself still runs, and the photo lands on the form.
  function wireFlagPhotoInputs(scope) {
    Array.prototype.forEach.call((scope || root).querySelectorAll('input.flag-photo'), function (inp) {
      if (inp.__stFlagWired) return;
      inp.__stFlagWired = true;
      inp.addEventListener('change', function () {
        if (!alive() || !lastCanWork) return;
        pickFlagPhotos(inp.getAttribute('data-flag-key'), inp);
      });
    });
  }

  function paintFlagSlot(key) {
    if (!alive()) return;
    var slot = byFlagKey('.flag-slot', key);
    if (slot) { slot.innerHTML = flagSlotHTML(key); wireFlagPhotoInputs(slot); }
  }

  function setFlagMsg(key, text, bad) {
    var f = flagForms[key];
    if (!f) return;
    f.msg = text ? { text: text, bad: !!bad } : null;
    var form = byFlagKey('.flagform', key);
    var m = form && form.querySelector('.flag-msg');
    if (m) { m.textContent = text || ''; m.className = 'flag-msg' + (bad ? ' bad' : ''); }
  }

  function openFlag(key) {
    var f = flagForms[key];
    if (!f) f = flagForms[key] = newFlagForm();
    f.open = true;
    delete flagNotices[key];
    var tid = taskIdOfKey(key);
    if (tid != null) openCards[tid] = true;
    paintFlagSlot(key);
    var form = byFlagKey('.flagform', key);
    var first = form && form.querySelector('.flag-cat');
    if (first && typeof first.focus === 'function') first.focus();
  }

  function forgetFlagFiles(f) {
    (f.files || []).forEach(function (p) {
      if (p.url) { try { URL.revokeObjectURL(p.url); } catch (e) { /* nothing */ } }
    });
    f.files = [];
  }

  function cancelFlag(key) {
    var f = flagForms[key];
    if (f) forgetFlagFiles(f);
    delete flagForms[key];
    dropFlagDraft(key);
    paintFlagSlot(key);
    var btn = byFlagKey('.flag-open', key);
    if (btn && typeof btn.focus === 'function') btn.focus();
  }

  function chooseFlagCategory(key, cat) {
    var f = flagForms[key];
    if (!f || f.phase !== 'edit' || f.sending || !CATEGORY_CREW[cat]) return;
    f.category = cat;
    var form = byFlagKey('.flagform', key);
    if (form) {
      Array.prototype.forEach.call(form.querySelectorAll('.flag-cat'), function (b) {
        b.setAttribute('aria-checked', b.getAttribute('data-cat') === cat ? 'true' : 'false');
      });
    }
    if (f.msg && f.msg.bad) setFlagMsg(key, '');
    saveFlagDraft(key);
  }

  function repaintFlagPicks(key) {
    var f = flagForms[key];
    var form = byFlagKey('.flagform', key);
    var box = form && form.querySelector('.flag-shots');
    if (!f || !box) return;
    box.innerHTML = flagPicksHTML(key, f);
    box.hidden = !f.files.length;
  }

  function pickFlagPhotos(key, inp) {
    var f = flagForms[key];
    var files = Array.prototype.slice.call(inp.files || []);
    inp.value = '';
    if (!f || f.phase !== 'edit' || f.sending || !files.length) return;
    var over = false;
    files.forEach(function (file) {
      var same = f.files.some(function (p) {
        return p.file.name === file.name && p.file.size === file.size && p.file.lastModified === file.lastModified;
      });
      if (same) return;
      if (f.files.length >= FLAG_PHOTO_MAX) { over = true; return; }
      var url = null;
      try { url = typeof URL !== 'undefined' && typeof URL.createObjectURL === 'function' ? URL.createObjectURL(file) : null; } catch (e) { url = null; }
      f.files.push({ file: file, url: url });
    });
    repaintFlagPicks(key);
    setFlagMsg(key, over ? 'Up to 6 photos on one problem.' : '', over);
  }

  function removeFlagPhoto(key, idx) {
    var f = flagForms[key];
    if (!f || f.phase !== 'edit' || f.sending || !f.files[idx]) return;
    var gone = f.files.splice(idx, 1)[0];
    if (gone.url) { try { URL.revokeObjectURL(gone.url); } catch (e) { /* nothing */ } }
    repaintFlagPicks(key);
    setFlagMsg(key, '');
  }

  // Everything the problem door reads, and nothing else (CREW_FLAG_FIELDS).
  function flagBody(key, f) {
    return {
      category: f.category,
      note: f.note,
      task_id: taskIdOfKey(key),
      client_ref: f.clientRef,
      photos_expected: f.files.length,
      name: crewName.trim() || undefined
    };
  }

  function sendFlag(key) {
    var f = flagForms[key];
    if (!f || f.phase !== 'edit' || f.sending) return;
    if (!CATEGORY_CREW[f.category]) { setFlagMsg(key, 'Pick what kind of problem it is.', true); return; }
    if (!f.note.trim()) { setFlagMsg(key, 'Write what the problem is first.', true); return; }
    f.sending = true;
    f.msg = { text: 'Sending…', bad: false };
    paintFlagSlot(key);
    fetch('/api/service-ticket-share/' + encodeURIComponent(token) + '/flag', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify(flagBody(key, f))
    }).then(function (r) {
      return readJSON(r, 'That could not be sent.');
    }).then(function (data) {
      // A 200 that is not the server's answer (a Wi-Fi sign-in page) is the
      // signal, not a stored problem. Sending again is safe: the same
      // client_ref finds the first one if it did arrive.
      if (!data || data.ok !== true || !data.flag || data.flag.id == null) {
        var lost = new Error('no answer from the server');
        lost.status = 0;
        throw lost;
      }
      if (flagForms[key] !== f) return;
      var files = f.files.map(function (p) { return p.file; });
      forgetFlagFiles(f);
      f.sending = false;
      f.flagId = String(data.flag.id);
      f.msg = null;
      dropFlagDraft(key);
      if (!files.length) { flagSent(key, 0); return; }
      f.phase = 'uploading';
      addPhotos(files, { key: 'flag:' + f.flagId, flagId: f.flagId, formKey: key });
    }).catch(function (e) {
      if (flagForms[key] !== f) return;
      f.sending = false;
      // A refusal is the server's own words; no answer at all is the signal.
      f.msg = {
        text: e && e.status ? e.message : NO_ANSWER,
        bad: true
      };
      paintFlagSlot(key);
    });
  }

  // The problem is stored and every photo has settled one way or the other.
  function settleFlagPhotos(queueKey) {
    if (!queue || busyCount(queueKey)) return;
    var key = formKeyOfFlag(String(queueKey).slice('flag:'.length));
    var f = key != null ? flagForms[key] : null;
    if (!f || f.phase === 'edit') return;
    var s = queue.summary(queueKey);
    if (s.failed + s.refused > 0) {
      f.phase = 'partial';
      paintFlagSlot(key);
      return;
    }
    flagSent(key, s.done);
  }

  function flagSent(key, photos) {
    delete flagForms[key];
    dropFlagDraft(key);
    flagNotices[key] = photos
      ? 'Sent to the office with ' + photos + (photos === 1 ? ' photo.' : ' photos.')
      : 'Sent to the office.';
    var tid = taskIdOfKey(key);
    if (tid != null) openCards[tid] = true;
    paintFlagSlot(key);
    load({ after: 'saved' });
  }

  // ONE delegated listener for every flag BUTTON and the note box: the forms
  // are redrawn, their listeners never are. The photo inputs are the exception
  // — they bind directly (wireFlagPhotoInputs), because a redraw can detach the
  // one the crew is picking into and delegation would then never hear it. The
  // controls exist only when the link can work (canWork); the server decides
  // again on every request.
  function onFlagEvent(e) {
    if (!alive()) return;
    var el = e.target;
    if (!el || typeof el.closest !== 'function' || !root.contains(el)) return;
    var holder = el.closest('[data-flag-key]');
    var key = holder ? holder.getAttribute('data-flag-key') : null;
    if (key == null || !lastCanWork) return;
    var f = flagForms[key];

    if (e.type === 'input') {
      if (!el.classList.contains('flag-note') || !f || f.phase !== 'edit') return;
      f.note = el.value.slice(0, NOTE_MAX);
      if (f.restored) { f.restored = false; dropHint('flag:' + key); }
      if (f.msg && f.msg.bad) setFlagMsg(key, '');
      saveFlagDraft(key);
      return;
    }

    var b = el.closest('.flag-open, .flag-cat, .flag-cancel, .flag-send, .flag-pick-btn, .flag-photo-rm, .flag-retry, .flag-done');
    if (!b || b.disabled) return;
    if (b.classList.contains('flag-open')) { openFlag(key); return; }
    if (!f) return;
    if (b.classList.contains('flag-cat')) chooseFlagCategory(key, b.getAttribute('data-cat'));
    else if (b.classList.contains('flag-cancel')) cancelFlag(key);
    else if (b.classList.contains('flag-send')) sendFlag(key);
    else if (b.classList.contains('flag-photo-rm')) removeFlagPhoto(key, Number(b.getAttribute('data-idx')));
    else if (b.classList.contains('flag-pick-btn')) {
      var inp = b.nextElementSibling;
      if (inp && inp.classList.contains('flag-photo')) inp.click();
    } else if (b.classList.contains('flag-retry')) {
      if (!queue || !f.flagId) return;
      f.phase = 'uploading';
      queue.retry('flag:' + f.flagId);
      paintFlagSlot(key);
    } else if (b.classList.contains('flag-done')) {
      if (queue && f.flagId) {
        // The form goes first, so dropping the photos that did not go does
        // not settle it a second time.
        var s = queue.summary('flag:' + f.flagId);
        flagSent(key, s.done);
        queue.discard('flag:' + f.flagId);
      } else {
        flagSent(key, 0);
      }
    }
  }

  // ── Page-wide listeners ───────────────────────────────────────────────
  root.addEventListener('click', onFlagEvent);
  root.addEventListener('input', onFlagEvent);
  // No 'change' here: the flag photo inputs own their own listener
  // (wireFlagPhotoInputs), so a redraw while the picker is open cannot eat the
  // pick.

  // Retry and Clear under any photo row (delegated: the rows are redrawn).
  root.addEventListener('click', function (e) {
    if (!alive() || !queue) return;
    var b = e.target && e.target.closest ? e.target.closest('.upq-retry, .upq-clear') : null;
    if (!b || !root.contains(b)) return;
    var key = b.getAttribute('data-key');
    if (b.classList.contains('upq-retry')) queue.retry(key);
    else queue.discard(key);
    paintTarget(key);
  });

  window.addEventListener('online', function () {
    if (!alive()) return;
    if (netbarShown()) retryNow();
    else if (!rendered && document.getElementById('fatalRetry')) load();
  });

  window.addEventListener('offline', function () {
    if (!alive() || !rendered || !hasDraft()) return;
    netbarOpts = netbarOpts || {};
    showNetbar('No signal. What you type is kept on this phone.');
  });

  window.addEventListener('pagehide', function () { if (alive()) persistDrafts(); });
  document.addEventListener('visibilitychange', function () {
    if (alive() && document.visibilityState === 'hidden') persistDrafts();
  });

  // Photos still going, or kept after failing: leaving asks first.
  window.addEventListener('beforeunload', function (e) {
    if (!alive() || !queue || !queue.unsettled()) return undefined;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  // Shape gate BEFORE any network call: a malformed token never costs the
  // server a request, and the visitor gets the same answer either way.
  if (!/^[a-f0-9]{64}$/.test(token)) fatal('This link is not valid.');
  else load();
})();
</script>
</body>
</html>
