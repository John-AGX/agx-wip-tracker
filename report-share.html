<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Shared report</title>

<!--
  PUBLIC REPORT PORTAL — the page a client, owner or insurer lands on from a
  share email (/r/<token>). No account, no app shell.

  It links exactly two things from the repo:
    /js/report-document.js   — the pure document renderer (one global, reads
                               nothing ambient; test/report-document-render.test.js
                               runs it in a bare sandbox to keep it that way)
    /css/report-style-packs.css — already standalone and keyed entirely off
                               [data-style-pack]; it defines nothing outside
                               that attribute.

  Everything else on this page — chrome, tokens, fetch, the lightbox — is its
  own, so no app file can be pulled in behind it. That is the house rule for
  guest surfaces, and both previous host/guest bleeds came from breaking it.

  The document CSS below is written for PAPER, deliberately, rather than
  extracted from the app's stylesheet: the app renders a dark editing surface
  and a client should receive a white document. The shared thing is the
  renderer and the class names; the presentation is meant to differ.
-->

<link rel="stylesheet" href="/css/vendor/leaflet.css" />
<!-- The document stylesheet, shared with the server-side PDF so the two
     cannot drift. This page keeps only its own chrome below. -->
<link rel="stylesheet" href="/css/report-paper.css?v=2" />
<link rel="stylesheet" href="/css/report-style-packs.css?v=2" />
<style>
  :root {
    --ink:      #14171c;
    --ink-soft: #565d68;
    --rule:     #d9d5cd;
    --paper:    #ffffff;
    --ground:   #edeae4;
    --accent:   #2f6feb;
    --bad:      #b4342a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Guest chrome ─────────────────────────────────────────────── */
  .rs-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    background: #ffffff;
    border-bottom: 1px solid var(--rule);
  }
  .rs-bar-org { font-weight: 700; letter-spacing: .2px; }
  .rs-bar-sub { color: var(--ink-soft); font-size: 13px; }
  .rs-bar-spacer { flex: 1 1 auto; }
  .rs-btn {
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--rule); background: #fff; color: var(--ink);
    cursor: pointer;
  }
  .rs-btn:hover { background: #f4f2ee; }

  .rs-wrap { padding: 22px 14px 60px; }

  /* The document sheet. Sized to the printable width of Letter portrait so
     what the reader sees on screen matches what they get if they print it. */
  .p86-report-preview-paper {
    width: min(839px, 100%);
    margin: 0 auto;
    background: var(--paper);
    color: #000;
    padding: 56px 50px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08), 0 18px 50px rgba(0,0,0,.10);
    border-radius: 2px;
  }

  /* ── Cover ────────────────────────────────────────────────────── */
  .p86-report-cover-rendered { text-align: center; padding-bottom: 26px; border-bottom: 1px solid var(--rule); margin-bottom: 30px; }
  .p86-report-cover-company { font-size: 13px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
  .p86-report-cover-subtitle { font-size: 14px; color: #666; font-style: italic; margin-bottom: 14px; }
  .p86-report-cover-title { font-size: 30px; line-height: 1.2; margin: 8px 0 10px; text-wrap: balance; }
  .p86-report-cover-addr { color: #555; font-size: 14px; }
  .p86-report-cover-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 34px; margin-top: 22px; }
  .p86-report-cover-meta > div { text-align: left; }
  .p86-report-cover-meta .k { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: #888; }
  .p86-report-cover-meta .v { display: block; font-size: 14px; font-weight: 600; }

  /* ── Document body ────────────────────────────────────────────── */
  .p86-report-preview-summary { font-size: 15px; color: #333; margin-bottom: 26px; white-space: pre-wrap; }
  .p86-report-preview-section { margin-bottom: 34px; }
  .p86-report-preview-section-label { font-size: 17px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .p86-report-preview-text { white-space: pre-wrap; font-size: 14.5px; color: #222; }
  .p86-report-preview-empty { color: #999; font-size: 13px; font-style: italic; }

  .p86-report-preview-section-grid { display: grid; gap: 14px; }
  .p86-report-preview-section-grid.size-small  { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .p86-report-preview-section-grid.size-medium { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .p86-report-preview-section-grid.size-large  { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .p86-report-preview-section-stack { display: flex; flex-direction: column; gap: 18px; }

  .p86-report-preview-photo { display: flex; flex-direction: column; }
  .p86-report-preview-photo.has-sidedesc { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; align-items: start; }
  .p86-report-preview-photo.has-sidedesc.desc-left .p86-report-preview-photo-img-wrap { order: 2; }
  .p86-report-preview-photo.has-sidedesc.desc-left .p86-report-photo-sidedesc { order: 1; text-align: right; }
  .p86-report-preview-photo-img-wrap { position: relative; overflow: hidden; border-radius: 3px; }
  .p86-report-preview-photo-img-wrap img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .p86-report-preview-photo-anno { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .p86-report-photo-num {
    position: absolute; top: 6px; left: 6px; z-index: 3;
    min-width: 22px; height: 22px; padding: 0 5px;
    border: 1.5px solid #000; border-radius: 11px;
    background: #fff; color: #000;
    font-size: 11.5px; font-weight: 700; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  .p86-report-photo-sidedesc { min-width: 0; padding-top: 2px; }
  .p86-report-photo-sidedesc-text { font-size: 14.5px; font-weight: 600; margin-bottom: 8px; white-space: pre-wrap; }
  .p86-report-photo-meta { font-size: 12px; color: #666; }
  .p86-report-photo-meta-row { display: flex; gap: 6px; }

  .p86-report-preview-files { display: flex; flex-direction: column; gap: 6px; }
  .p86-report-preview-file-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; }
  .p86-report-preview-file-ext { font-size: 10px; font-weight: 700; letter-spacing: .5px; color: #fff; background: #7a828e; padding: 2px 6px; border-radius: 3px; }
  .p86-report-preview-file-name { font-size: 13.5px; }

  .p86-report-preview-map img { display: block; width: 100%; max-width: 680px; border-radius: 6px; }
  .p86-report-map-unavailable { padding: 14px 16px; border: 1px dashed var(--rule); border-radius: 8px; color: #888; font-size: 13px; }

  /* ── States ───────────────────────────────────────────────────── */
  .rs-card {
    max-width: 460px; margin: 12vh auto; background: #fff; padding: 30px 32px;
    border: 1px solid var(--rule); border-radius: 12px; text-align: center;
  }
  .rs-card h1 { font-size: 19px; margin: 0 0 8px; }
  .rs-card p { color: var(--ink-soft); margin: 0; font-size: 14px; }
  .rs-card.bad h1 { color: var(--bad); }

  .rs-foot { max-width: 839px; margin: 20px auto 0; color: var(--ink-soft); font-size: 12px; text-align: center; }

  /* ── Lightbox ─────────────────────────────────────────────────── */
  .rs-lb { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; }
  .rs-lb.open { display: flex; }
  .rs-lb img { max-width: 94vw; max-height: 92vh; object-fit: contain; }
  .rs-lb-close { position: absolute; top: 14px; right: 16px; font-size: 26px; line-height: 1; color: #fff; background: none; border: 0; cursor: pointer; padding: 8px; }

  @media (max-width: 640px) {
    .p86-report-preview-paper { padding: 26px 18px; }
    .p86-report-preview-photo.has-sidedesc { grid-template-columns: 1fr; }
    .p86-report-preview-section-grid.size-small,
    .p86-report-preview-section-grid.size-medium,
    .p86-report-preview-section-grid.size-large { grid-template-columns: 1fr; }
  }


/* ── Report location map: three layers, one winner ──────────────────
   .p86-report-map-live      interactive (added by wire() when Leaflet loads)
   .p86-report-map-static    the server-baked image — also what PRINTS
   .p86-report-map-fallback  the photo grid, when there is neither
   Each layer hides the ones beneath it, so no combination yields an empty box. */
.p86-report-map-wrap { position: relative; }
.p86-report-map-live { height: 420px; border-radius: 6px; overflow: hidden; }
.p86-report-map-static { display: block; width: 100%; max-width: 680px; border-radius: 6px; }
.p86-report-map-fallback { display: grid; gap: 12px; }

/* A baked image beats the grid; a live map beats both (on screen). */
.p86-report-map-wrap.has-static .p86-report-map-fallback { display: none; }
.p86-report-map-wrap.has-live-map .p86-report-map-fallback { display: none; }
.p86-report-map-wrap.has-live-map .p86-report-map-static { display: none; }

.p86-report-map-pin {
  width: 26px; height: 26px; border-radius: 50%;
  background: #2f6feb; color: #fff; border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.p86-report-map-pop img { width: 190px; display: block; border-radius: 4px; margin-bottom: 6px; }
.p86-report-map-pop-n { color: #777; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.p86-report-map-pop-cap { font-weight: 600; font-size: 13.5px; }

@media print {
  /* A live map would print whatever the reader last panned to, so print the
     BAKED image instead — it is the view that was published. With no baked
     image the photo grid comes back, which still carries the information. */
  .p86-report-map-live { display: none !important; }
  .p86-report-map-wrap.has-live-map .p86-report-map-static { display: block !important; }
  .p86-report-map-wrap.has-live-map:not(.has-static) .p86-report-map-fallback { display: grid !important; }
}

  /* ── Comments (added by this page, not the renderer) ─────────── */
  .rs-c-block { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--rule); }
  .rs-c-head { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #8a8f98; margin-bottom: 8px; }
  .rs-c-empty { font-size: 13px; color: #9aa0a8; font-style: italic; }
  .rs-c-item { padding: 8px 10px; background: #f6f4f0; border-radius: 7px; margin-bottom: 6px; }
  .rs-c-meta { font-size: 11.5px; color: #7a808a; margin-bottom: 3px; }
  .rs-c-body { font-size: 14px; white-space: pre-wrap; }
  .rs-c-form { margin-top: 8px; }
  .rs-c-text, .rs-c-name {
    width: 100%; font: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid var(--rule); border-radius: 7px; background: #fff; color: var(--ink);
  }
  .rs-c-actions { display: flex; gap: 8px; margin-top: 6px; }
  .rs-c-actions .rs-c-name { flex: 1 1 auto; }
  .rs-c-note { font-size: 12px; color: #7a808a; margin-top: 5px; min-height: 1em; }

  @media print {
    @page { size: letter portrait; margin: 0.4in; }
    .rs-bar, .rs-foot, .rs-lb, .rs-c-block { display: none !important; }
    body { background: #fff; }
    .rs-wrap { padding: 0; }
    .p86-report-preview-paper { width: 100%; margin: 0; padding: 0; box-shadow: none; }
    .p86-report-preview-photo { break-inside: avoid; page-break-inside: avoid; }
    .p86-report-preview-photo-img-wrap img { max-height: 3in; width: auto; max-width: 100%; }
  }
</style>
</head>
<body>

<div id="rsRoot">
  <div class="rs-card"><h1>Loading…</h1><p>Fetching the report.</p></div>
</div>

<div class="rs-lb" id="rsLightbox" role="dialog" aria-label="Photo">
  <button class="rs-lb-close" type="button" aria-label="Close">&times;</button>
  <img alt="" />
</div>

<!-- Vendored, not a CDN: a client's copy of a report must not depend on a
     third party staying up. Loaded BEFORE the renderer, which upgrades a map
     section only when window.L is already present. -->
<script src="/js/vendor/leaflet.js"></script>
<script src="/js/report-document.js?v=2"></script>
<script>
(function () {
  'use strict';

  var root = document.getElementById('rsRoot');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function card(title, body, bad) {
    root.innerHTML = '<div class="rs-card' + (bad ? ' bad' : '') + '">' +
      '<h1>' + esc(title) + '</h1><p>' + esc(body) + '</p></div>';
  }

  // The token is read from THIS page's own path and shape-gated here as well as
  // on the server. A malformed link should cost the server nothing.
  var m = location.pathname.match(/^\/r\/([a-f0-9]{64})\/?$/);
  if (!m) {
    card('Invalid link', 'This link does not look right. Check that you copied the whole address.', true);
    return;
  }
  var token = m[1];

  function fmtExpiry(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    try { return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); }
    catch (e) { return iso.slice(0, 10); }
  }

  fetch('/api/report-share/' + encodeURIComponent(token), {
    headers: { 'Accept': 'application/json' },
    credentials: 'omit'          // nothing here is session-based
  })
    .then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; })
        .catch(function () { return { status: r.status, body: {} }; });
    })
    .then(function (res) {
      if (res.status !== 200) {
        // The server's wording IS the message — it distinguishes turned-off
        // from expired from never-valid without revealing whether a token
        // existed.
        var msg = (res.body && res.body.error) || 'This link is not available.';
        var hint = res.status === 410
          ? 'Ask whoever sent it for a new link.'
          : 'Check the address, or ask the sender for a new link.';
        card(msg, hint, true);
        return;
      }

      var doc = res.body.document || {};
      var share = res.body.share || {};

      root.innerHTML =
        '<div class="rs-bar">' +
          '<div>' +
            '<div class="rs-bar-org">' + esc(doc.org_name || 'Shared report') + '</div>' +
            '<div class="rs-bar-sub">' + esc(doc.project_name || '') + '</div>' +
          '</div>' +
          '<div class="rs-bar-spacer"></div>' +
          '<button class="rs-btn" type="button" id="rsPrint">Print / Save PDF</button>' +
        '</div>' +
        '<div class="rs-wrap"><div id="rsDoc"></div>' +
          '<div class="rs-foot">' +
            (share.expires_at ? 'This link expires on ' + esc(fmtExpiry(share.expires_at)) + '.' : '') +
          '</div>' +
        '</div>';

      // ONE renderer — the same module the app's preview and printed page use.
      window.p86ReportDocument.mount(document.getElementById('rsDoc'), doc);

      document.getElementById('rsPrint').addEventListener('click', function () { window.print(); });

      // ── Comments ──────────────────────────────────────────────────
      // Attached by THIS PAGE, after the document is mounted — never by the
      // renderer, which is contractually forbidden from emitting inputs (a
      // guest must not be handed a control that posts nowhere, and the same
      // renderer draws the printed page). The server refuses a comment on a
      // view-only link regardless of what this page draws; hiding the box is
      // courtesy, not the control.
      var canComment = (share.scope === 'comment');

      function renderThread(list, comments) {
        if (!comments.length) {
          list.innerHTML = '<div class="rs-c-empty">No comments yet.</div>';
          return;
        }
        list.innerHTML = comments.map(function (c) {
          var when = '';
          try { when = new Date(c.created_at).toLocaleString(); } catch (e) {}
          return '<div class="rs-c-item">' +
            '<div class="rs-c-meta">' + esc(c.author_name || 'Someone') +
              (when ? ' · ' + esc(when) : '') + '</div>' +
            '<div class="rs-c-body">' + esc(c.body) + '</div>' +
          '</div>';
        }).join('');
      }

      function loadComments() {
        return fetch('/api/report-share/' + encodeURIComponent(token) + '/comments', {
          headers: { 'Accept': 'application/json' }, credentials: 'omit'
        }).then(function (r) { return r.json(); })
          .then(function (j) { return (j && j.comments) || []; })
          .catch(function () { return []; });
      }

      function mountComments(all) {
        var sections = Array.prototype.slice.call(
          document.querySelectorAll('#rsDoc .p86-report-preview-section'));

        sections.forEach(function (secEl) {
          var sid = secEl.getAttribute('data-section-id') || '';
          var mine = all.filter(function (c) { return (c.section_id || '') === sid; });
          if (!mine.length && !canComment) return;   // nothing to show, nothing to offer

          var box = document.createElement('div');
          box.className = 'rs-c-block';
          box.innerHTML =
            '<div class="rs-c-head">' + (canComment ? 'Comments' : 'Comments') + '</div>' +
            '<div class="rs-c-list"></div>' +
            (canComment
              ? '<div class="rs-c-form">' +
                  '<textarea class="rs-c-text" rows="2" placeholder="Add a comment about this section…"></textarea>' +
                  '<div class="rs-c-actions">' +
                    '<input class="rs-c-name" type="text" placeholder="Your name (optional)" />' +
                    '<button type="button" class="rs-btn rs-c-send">Send</button>' +
                  '</div>' +
                  '<div class="rs-c-note"></div>' +
                '</div>'
              : '');
          secEl.appendChild(box);
          renderThread(box.querySelector('.rs-c-list'), mine);

          if (!canComment) return;
          var ta = box.querySelector('.rs-c-text');
          var nameEl = box.querySelector('.rs-c-name');
          var send = box.querySelector('.rs-c-send');
          var note = box.querySelector('.rs-c-note');

          send.addEventListener('click', function () {
            var body = (ta.value || '').trim();
            if (!body) { note.textContent = 'Write something first.'; return; }
            send.disabled = true;
            send.textContent = 'Sending…';
            note.textContent = '';
            fetch('/api/report-share/' + encodeURIComponent(token) + '/comments', {
              method: 'POST',
              headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
              credentials: 'omit',
              body: JSON.stringify({
                body: body,
                author_name: (nameEl.value || '').trim(),
                section_id: sid
              })
            }).then(function (r) {
              return r.json().then(function (j) { return { status: r.status, body: j }; });
            }).then(function (res) {
              send.disabled = false;
              send.textContent = 'Send';
              if (res.status !== 200) {
                note.textContent = (res.body && res.body.error) || 'Could not send that.';
                return;
              }
              ta.value = '';
              note.textContent = 'Sent.';
              return loadComments().then(function (fresh) {
                renderThread(box.querySelector('.rs-c-list'),
                  fresh.filter(function (c) { return (c.section_id || '') === sid; }));
              });
            }).catch(function () {
              send.disabled = false;
              send.textContent = 'Send';
              note.textContent = 'Could not send that. Check your connection.';
            });
          });
        });
      }

      loadComments().then(mountComments);

      // Click a photo to see it full size. Delegated, so it covers photos the
      // renderer produced without the renderer needing to know about it.
      var lb = document.getElementById('rsLightbox');
      var lbImg = lb.querySelector('img');
      document.getElementById('rsDoc').addEventListener('click', function (e) {
        var img = e.target && e.target.closest ? e.target.closest('.p86-report-preview-photo-img-wrap img') : null;
        if (!img) return;
        lbImg.src = img.src;
        lb.classList.add('open');
      });
      function closeLb() { lb.classList.remove('open'); lbImg.removeAttribute('src'); }
      lb.addEventListener('click', function (e) { if (e.target === lb || e.target.classList.contains('rs-lb-close')) closeLb(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
    })
    .catch(function () {
      card('Could not load the report', 'Check your connection and try again.', true);
    });
})();
</script>
</body>
</html>
