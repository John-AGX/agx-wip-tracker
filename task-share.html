<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Task</title>
<style>
  :root { --bg:#f5f6f8; --card:#ffffff; --line:#e5e7eb; --ink:#111827; --dim:#6b7280; --accent:#2563eb; --green:#16a34a; --radius:14px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 14px 40px; }
  .brand { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-bottom:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
  h1 { font-size:19px; line-height:1.3; margin:0 0 8px; font-weight:650; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:3px 10px; border-radius:20px; background:#eef2ff; color:#3730a3; }
  .chip.status { background:#e0edff; color:#1d4ed8; }
  .chip.done { background:#dcfce7; color:#15803d; }
  .sec-h { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); margin:0 0 8px; }
  .muted { color:var(--dim); font-size:13px; }
  .prog { height:6px; border-radius:6px; background:var(--line); overflow:hidden; margin:8px 0 12px; }
  .prog > i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
  .item { display:flex; gap:11px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); font-size:15px; }
  .item:first-child { border-top:0; }
  .item input { width:22px; height:22px; margin-top:1px; flex:none; accent-color:var(--accent); }
  .item.done label { color:var(--dim); text-decoration:line-through; }
  .note { font-size:14px; line-height:1.55; white-space:pre-wrap; color:#374151; }
  input[type=text], textarea { width:100%; font:inherit; font-size:15px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  textarea { min-height:70px; resize:vertical; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; font:inherit; font-size:15px; font-weight:600; padding:12px 16px; border-radius:11px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.go { background:var(--green); border-color:var(--green); color:#fff; width:100%; padding:15px; font-size:16px; }
  .btn:active { transform:scale(.99); }
  .btn[disabled] { opacity:.55; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; }
  .tiles a { display:block; aspect-ratio:1; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#eef1f5; }
  .tiles img { width:100%; height:100%; object-fit:cover; }
  .row { display:flex; gap:8px; }
  .row .btn { flex:1; }
  .center { text-align:center; padding:44px 16px; }
  .center .big { font-size:20px; font-weight:650; margin-bottom:6px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#111827; color:#fff; font-size:13px; padding:9px 14px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
  .toast.on { opacity:1; }
</style>
</head>
<body>
  <div class="wrap" id="app"><div class="center muted">Loading…</div></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="camIn" accept="image/*" capture="environment" style="display:none" />
  <input type="file" id="libIn" accept="image/*" style="display:none" />
<script>
(function () {
  var token = (location.pathname.split('/').filter(Boolean).pop() || '');
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var state = { task: null, photos: [], share: null, org: 'This company', name: '', busy: false };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('on'); setTimeout(function(){toastEl.classList.remove('on');},1800); }
  function api(method, body){
    var opts={ method:method, headers:{}, cache:'no-store' };
    if(body){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
    return fetch('/api/task-share/'+encodeURIComponent(token), opts).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j&&j.error||'Something went wrong'); return j; }); });
  }
  function fatal(msg){ app.innerHTML='<div class="center"><div class="big">'+esc(msg)+'</div><div class="muted">You can close this page.</div></div>'; }

  function load(){
    fetch('/api/task-share/'+encodeURIComponent(token), { cache:'no-store' }).then(function(r){
      return r.json().then(function(j){ return { ok:r.ok, status:r.status, j:j }; });
    }).then(function(res){
      if(!res.ok){ fatal(res.j&&res.j.error || 'This link is no longer valid.'); return; }
      state.task=res.j.task||{}; state.photos=res.j.photos||[]; state.share=res.j.share||{};
      state.org=res.j.org_name||'This company';
      state.name=state.share.recipient_name||'';
      render();
    }).catch(function(){ fatal('Could not load this task. Check your connection and try again.'); });
  }

  function render(){
    var t=state.task, sh=state.share;
    var cl=Array.isArray(t.checklist)?t.checklist:[];
    var done=cl.filter(function(c){return c.done;}).length;
    var completed=!!sh.completed;
    var h='';
    h+='<div class="brand">'+esc(state.org)+' · Task</div>';

    h+='<div class="card">';
    h+='<h1>'+esc(t.title||'Task')+'</h1>';
    h+='<div class="chips">';
    h+='<span class="chip status">'+esc((t.status||'open').replace('_',' '))+'</span>';
    if(t.priority) h+='<span class="chip">'+esc(t.priority)+'</span>';
    if(completed) h+='<span class="chip done">Completed</span>';
    h+='</div>';
    if(t.due_date) h+='<div class="muted" style="margin-top:8px;">Due '+esc(String(t.due_date).slice(0,10))+'</div>';
    h+='</div>';

    if(completed){
      h+='<div class="card" style="text-align:center;background:#f0fdf4;border-color:#bbf7d0;"><div style="font-size:16px;font-weight:650;color:#15803d;">Thanks — this task is marked complete.</div><div class="muted" style="margin-top:4px;">No further action needed.</div></div>';
    }

    if(t.notes){ h+='<div class="card"><div class="sec-h">Notes</div><div class="note">'+esc(t.notes)+'</div></div>'; }

    if(cl.length){
      h+='<div class="card"><div class="sec-h">Punch list · '+done+' of '+cl.length+' done</div>';
      h+='<div class="prog"><i style="width:'+(cl.length?Math.round(done/cl.length*100):0)+'%"></i></div>';
      h+=cl.map(function(c,i){ return '<div class="item'+(c.done?' done':'')+'"><input type="checkbox" data-i="'+i+'"'+(c.done?' checked':'')+(completed?' disabled':'')+'><label>'+esc(c.text||'')+'</label></div>'; }).join('');
      h+='</div>';
    }

    var loc = locLabel(t);
    if(loc.label || loc.href){
      h+='<div class="card"><div class="sec-h">Location</div>';
      if(loc.label) h+='<div style="font-size:15px;margin-bottom:'+(t.directions?'4px':'10px')+';">'+esc(loc.label)+'</div>';
      if(t.directions) h+='<div class="muted" style="margin-bottom:10px;">'+esc(t.directions)+'</div>';
      if(loc.href) h+='<a class="btn" href="'+esc(loc.href)+'" target="_blank" rel="noopener">Get directions</a>';
      h+='</div>';
    }

    h+='<div class="card"><div class="sec-h">Photos</div>';
    h+='<div class="tiles" id="tiles">'+photoTiles()+'</div>';
    if(!completed){ h+='<div class="row" style="margin-top:10px;"><button class="btn" id="bCam">Take photo</button><button class="btn" id="bLib">Upload</button></div>'; }
    h+='</div>';

    if(!completed){
      h+='<div class="card"><div class="sec-h">Add a note (optional)</div>';
      h+='<textarea id="noteIn" placeholder="Anything the office should know…"></textarea>';
      h+='<button class="btn" id="bNote" style="margin-top:8px;">Send note</button></div>';

      h+='<div class="card"><div class="sec-h">Your name</div>';
      h+='<input type="text" id="nameIn" placeholder="First and last name" value="'+esc(state.name)+'" />';
      h+='<div class="muted" style="margin-top:6px;">So the office knows who completed it.</div></div>';

      h+='<button class="btn go" id="bDone">Mark this task complete</button>';
    }

    app.innerHTML=h;
    wire();
  }

  function photoTiles(){
    if(!state.photos.length) return '<div class="muted" style="grid-column:1/-1;">No photos yet.</div>';
    return state.photos.map(function(p){ var u=p.thumb_url||p.web_url||p.original_url||''; return '<a href="'+esc(p.web_url||p.original_url||u)+'" target="_blank" rel="noopener">'+(u?'<img src="'+esc(u)+'" alt="">':'')+'</a>'; }).join('');
  }
  function locLabel(t){
    var lat=Number(t.lat), lng=Number(t.lng), has=isFinite(lat)&&isFinite(lng)&&!(lat===0&&lng===0);
    if(!has) return { label:'', href:'' };
    return { label:lat.toFixed(5)+', '+lng.toFixed(5), href:'https://www.google.com/maps/search/?api=1&query='+lat+','+lng };
  }
  function nameNow(){ var el=document.getElementById('nameIn'); if(el){ state.name=el.value.trim(); } return state.name; }

  function wire(){
    Array.prototype.forEach.call(document.querySelectorAll('.item input[data-i]'), function(el){
      el.addEventListener('change', function(){ toggleItem(+el.getAttribute('data-i'), el.checked, el); });
    });
    var bCam=document.getElementById('bCam'), bLib=document.getElementById('bLib');
    if(bCam) bCam.addEventListener('click', function(){ document.getElementById('camIn').click(); });
    if(bLib) bLib.addEventListener('click', function(){ document.getElementById('libIn').click(); });
    var bNote=document.getElementById('bNote'); if(bNote) bNote.addEventListener('click', sendNote);
    var bDone=document.getElementById('bDone'); if(bDone) bDone.addEventListener('click', markDone);
  }

  function toggleItem(i, checked, el){
    var cl=state.task.checklist.slice(); cl[i]={ text:cl[i].text, done:checked };
    if(el) el.disabled=true;
    api('PATCH', { checklist:cl, name:nameNow()||undefined }).then(function(res){
      state.task=res.task; if(el) el.disabled=false; render();
    }).catch(function(e){ if(el){ el.checked=!checked; el.disabled=false; } toast(e.message||'Could not save'); });
  }
  function sendNote(){
    var el=document.getElementById('noteIn'), v=(el&&el.value||'').trim(); if(!v){ toast('Type a note first'); return; }
    var b=document.getElementById('bNote'); b.disabled=true; b.textContent='Sending…';
    api('PATCH', { note:v, name:nameNow()||undefined }).then(function(res){
      state.task=res.task; toast('Note sent'); render();
    }).catch(function(e){ b.disabled=false; b.textContent='Send note'; toast(e.message||'Could not send'); });
  }
  function markDone(){
    var b=document.getElementById('bDone'); b.disabled=true; b.textContent='Saving…';
    api('PATCH', { status:'done', name:nameNow()||undefined }).then(function(res){
      state.task=res.task; state.share.completed=true; render(); window.scrollTo(0,0);
    }).catch(function(e){ b.disabled=false; b.textContent='Mark this task complete'; toast(e.message||'Could not save'); });
  }

  function uploadPhoto(file){
    if(!file) return;
    toast('Uploading photo…');
    var fd=new FormData(); fd.append('file', file);
    fetch('/api/task-share/'+encodeURIComponent(token)+'/photo', { method:'POST', body:fd }).then(function(r){
      return r.json().then(function(j){ if(!r.ok) throw new Error(j&&j.error||'Upload failed'); return j; });
    }).then(function(j){ if(j.attachment) state.photos.push(j.attachment); var tiles=document.getElementById('tiles'); if(tiles) tiles.innerHTML=photoTiles(); toast('Photo added'); })
      .catch(function(e){ toast(e.message||'Upload failed'); });
  }
  document.getElementById('camIn').addEventListener('change', function(){ if(this.files&&this.files[0]) uploadPhoto(this.files[0]); this.value=''; });
  document.getElementById('libIn').addEventListener('change', function(){ if(this.files&&this.files[0]) uploadPhoto(this.files[0]); this.value=''; });

  if(!/^[a-f0-9]{64}$/.test(token)){ fatal('This link is not valid.'); } else { load(); }
})();
</script>
</body>
</html>
