<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Live session</title>
<!--
  Live Rooms phase 02 — the guest page.

  THIS IS STILL NOT THE APP, and that is the point. index.html carries 124
  script tags, and js/app.js loadData() opens with eight ORG-WIDE GETs in one
  Promise.all — every job, every estimate, every QB cost line, the whole sub
  directory, every PO, CO, bill and AR invoice. A guest shell that booted the
  SPA would download the company before it rendered anything. So this page loads
  exactly two of the app's files: js/live-rooms.js for the session core (whose
  boot() refuses to run here — see isGuestPage there) and js/live-view.js for
  the typed renderer.

  What it renders IS the app's real surfaces, built server-side under the room's
  own policy: the app's tables and type, not a video of them, and a few KB per
  navigation rather than a video stream.

  The token in the path IS the credential. It lives in JS memory only — never
  localStorage, never a cookie — so a reload is a rejoin and nothing survives
  the meeting. This page sets no cookie, provisions no user, and talks to
  exactly six endpoints: status, join, stream, view, beat, leave.

  ── THE HOST'S POINTER IS NOT DRAWN HERE, AND THAT IS PERMANENT ────────────
  Phase 01 normalises a cursor to 0..10000 of the DOCUMENT it was measured
  against — except it does not: the only sampler passes raw pageX/pageY, and the
  host's own container is height:100vh;overflow:hidden with the scrolling done
  by an inner <main>, so the coordinate is blind to the pane that actually
  scrolls. It is a viewport overlay wearing document-overlay code, and it is
  only accurate host-to-host at matching scroll offset and window size.

  The answer is not a better arrow. It is that the two ends are now THE SAME
  DOCUMENT: the guest's WIP rows carry the app's own labels in the app's own
  order, so "look at As Sold Gross Profit" lands on both screens with no
  coordinate, over the phone, on a 375px display. That is what the cursor was
  for. The guest no longer receives cursor frames at all — it was being sent
  roughly 3.6 KB a minute of pointer samples it had no way to draw.
-->
<!-- Inter, Project 86's UI typeface. "The app's own type" was half the fidelity
     complaint. index.html loads six weights; a guest needs two, and display=swap
     keeps the page readable if the CDN is slow on a truck's connection. The
     fallback stack is css/styles.css:104's, character for character. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" />
<link rel="stylesheet" href="/css/live-surface.css?v=1" />
<link rel="stylesheet" href="/css/live-view.css?v=2" />
<link rel="stylesheet" href="/css/live-mirror.css?v=1" />
<style>
  /* LAYOUT ONLY. Tokens and component appearance belong to live-surface.css
     (the app's own, extracted) and layout to live-view.css. Nothing here may
     redefine a selector either of them owns — `.card` used to live in this
     block and, being later in source order at equal specificity, it silently
     beat the app's card the moment the extract landed. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--lv-bg); color: var(--lv-ink);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px calc(var(--lv-bar) + 24px); }
  .brand { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--lv-dim); margin-bottom: 10px; }
  h1 { font-size: 19px; line-height: 1.3; margin: 0 0 6px; font-weight: 650; overflow-wrap: anywhere; }
  .sub { font-size: 13px; color: var(--lv-dim); }
  .sec-h { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--lv-dim); margin: 0 0 9px; }

  /* A caveat is dimmed. "We can't tell" is NOT dimmed — it is a plain
     statement, and dimming it would read as decoration rather than as the
     surface admitting it does not know. */
  .roster.is-dim { opacity: .55; }
  .note { font-size: 13px; color: var(--lv-dim); font-style: italic; margin: 8px 0 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--lv-line); font-size: 14px; }
  .row:first-child { border-top: 0; }
  .row.is-stale { opacity: .5; }
  .who { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .flag { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--lv-dim);
          border: 1px solid var(--lv-line); border-radius: 4px; padding: 1px 5px; }

  label { display: block; font-size: 13px; color: var(--lv-dim); margin-bottom: 6px; }
  input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1px solid var(--lv-line);
                     border-radius: 10px; background: var(--lv-bg); color: var(--lv-ink); }
  .btn { display: inline-flex; align-items: center; justify-content: center; font: inherit; font-size: 16px;
         font-weight: 600; padding: 13px 16px; border-radius: 11px; border: 1px solid var(--lv-accent);
         background: var(--lv-accent); color: #06101f; cursor: pointer; width: 100%; margin-top: 10px; }
  .btn[disabled] { opacity: .55; }
  .ended { text-align: center; padding: 26px 16px; }
  .ended h2 { font-size: 17px; margin: 0 0 6px; }
  details.roster-fold summary { cursor: pointer; list-style: none; }
  details.roster-fold summary::-webkit-details-marker { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Project 86 &middot; live session</div>

  <div id="gate" class="card">
    <h1>Join this live session</h1>
    <p class="sub" id="gate-sub">Checking the link&hellip;</p>
    <div id="gate-form" style="display:none">
      <label for="nm">Your name (everyone in the session sees this)</label>
      <input type="text" id="nm" maxlength="40" autocomplete="name" placeholder="e.g. Dave &ndash; framing" />
      <button type="button" class="btn" id="go">Join</button>
    </div>
  </div>

  <div id="live" style="display:none">
    <div class="lv-tabs" id="tabs"></div>
    <p class="lv-stamp" id="stamp" style="display:none"></p>
    <!-- The mirror stage. A same-origin iframe with sandbox="allow-same-origin"
         and nothing else — no allow-scripts, no allow-forms, no
         allow-top-navigation — so the app's real stylesheets can apply to the
         mirrored pane at full fidelity without reaching this shell, and a
         <script> the serializer somehow missed still cannot run. Empty and
         display:none until a frame arrives; cleared on every terminal state. -->
    <div id="stage-wrap" class="lm-wrap" style="display:none"></div>
    <p class="note" id="stage-note" style="display:none"></p>
    <!-- p86-surface is the scope the extracted `table`/`th`/`td` rules are
         written under. Bare element selectors from the app would otherwise
         reach the shell's own chrome; scoping them is what lets the guest use
         the app's real table treatment without inheriting a workspace. -->
    <div id="surface" class="p86-surface"></div>

    <details class="card roster-fold" id="roster-card">
      <summary class="sec-h" id="roster-summary">In this session</summary>
      <div class="roster" id="roster"></div>
      <div class="note" id="roster-note"></div>
    </details>
  </div>

  <div id="dead" class="card ended" style="display:none">
    <h2 id="dead-h">This session has ended.</h2>
    <p class="sub" id="dead-sub"></p>
  </div>
</div>

<!-- The guest bar. Whose screen this is, that it is read-only, when the link
     stops working, and whether we are actually following. Always visible,
     always at most a few lines, and it never claims more than it knows. -->
<div class="lv-bar" id="bar" data-kind="following" style="display:none">
  <div class="lv-bar-main">
    <div class="lv-bar-who"><span class="lv-dot"></span><span id="bar-claim">Connecting&hellip;</span></div>
    <div class="lv-bar-sub" id="bar-sub">Read-only</div>
  </div>
  <button type="button" class="lv-follow" id="follow" aria-pressed="true">Following</button>
  <!-- Fit-to-width. The mirrored pane is the HOST's layout at the HOST's width;
       reflowing it at the guest's width would produce a layout the host has
       never seen and cannot describe, which breaks the one thing the mirror is
       for. So the default is 1:1 with pan, and this is the orientation view. -->
  <button type="button" class="lv-follow" id="fitbtn" aria-pressed="false" style="display:none">Fit</button>
  <!-- The mirror's accessibility and copy fallback. The stage is
       pointer-events:none because a guest observes — which also costs text
       selection, and reading a number off a screen and copying it is
       legitimate. This switches the same surface to the structured document:
       selectable, typed, semantic, already built. -->
  <button type="button" class="lv-follow" id="readable" style="display:none">Text</button>
  <button type="button" class="is-primary" id="back" style="display:none">Back</button>
  <div class="lv-bar-note" id="bar-note" style="display:none"></div>
</div>

<script src="/js/live-rooms.js?v=5"></script>
<script src="/js/live-view.js?v=2"></script>
<script src="/js/live-mirror-guest.js?v=1"></script>
<script>
(function () {
  'use strict';
  var Core = window.p86LiveCore;
  var View = window.p86LiveView;
  var Stage = window.p86LiveMirrorGuest;
  var token = (location.pathname.split('/')[2] || '').trim();
  var session = null;

  // ── Phase 03 ────────────────────────────────────────────────────────────
  // Which arrangement this guest is on, and whether the CURRENT screen is
  // actually being mirrored — two different facts, and conflating them is how a
  // bar ends up claiming pixels while the structured document is on screen.
  // `stageOn` is only true while a real frame is mounted.
  var stageOn = false;
  var stagePulling = false;
  // Deliberately preferred OFF for a mirrored surface: the stage is the point.
  // The reader flips to the structured document for the same surface, which is
  // what pays for the stage being pointer-events:none.
  var preferText = false;
  // The server's own refusal for the screen the host is on, held until a frame
  // arrives. Without it a screen the mirror declines for a reason the room does
  // not know about — a frame too large to send, say — would leave the bar
  // saying "waiting for John's screen" forever, which is the surface claiming
  // something is coming that never is.
  var mirrorRefusal = null;
  // What the guest is told for each. The host is told the same fact in his own
  // terms by the strip; these are the third-person twins.
  var REFUSAL_NOTE = {
    ledger: "This screen isn't mirrored — it carries other people's contracts and internal notes. You're seeing the structured version.",
    no_root: "This screen isn't mirrored — you're seeing the structured version.",
    not_mirrorable: "This screen isn't mirrored — you're seeing the structured version.",
    too_big: "This screen is too big to mirror — you're seeing the structured version.",
    canvas: "That screen is a drawing, and drawings aren't shared."
  };

  // Guest state. NONE of it is persisted: a credential in localStorage on a
  // guest's phone outlives the meeting, and "must not persist beyond the
  // session" is the standard.
  var following = true;
  var mySurface = null;
  var lastDoc = null;
  var lastFetchAt = null;
  // A request counter rather than an in-flight LOCK. A lock drops the host's
  // next navigation whenever one is already in the air — which is exactly when
  // he is moving fast and the mirror matters most. A counter lets the newest
  // request always win and simply discards a stale answer.
  var reqSeq = 0;
  // Signatures, so a 1Hz repaint does not rewrite innerHTML every second:
  // that would fight text selection, reset scroll inside a table, and blow away
  // focus on the tab strip.
  var docSig = null;
  var rosterSig = null;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function hostName() {
    var ps = (session && session.participants) || [];
    for (var i = 0; i < ps.length; i++) if (ps[i].role === 'host') return ps[i].name;
    return 'the host';
  }

  function surfaceLabel(key) {
    var list = (session && session.surfaces) || [];
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i].label;
    return key || '';
  }

  // A dead link says so BEFORE a name box is offered, and a terminal state
  // CLEARS the document. "Don't blank a stale mirror" and "the link is dead"
  // are different rules and this is where they meet: a revoked link that left
  // the WIP table on screen would be persisting past a kick.
  function showDead(reason) {
    $('gate').style.display = 'none';
    $('live').style.display = 'none';
    $('bar').style.display = 'none';
    $('dead').style.display = '';
    $('surface').innerHTML = '';
    // THE MIRRORED DOM GOES WITH IT. It is the most sensitive thing this
    // feature has ever put in a guest browser, and "a revoked link that left
    // the WIP table on screen would be persisting past a kick" applies to the
    // host's raw pane far more than it applied to the projection.
    dropStage();
    lastDoc = null;
    docSig = null;
    $('dead-h').textContent = Core.endReasonText(reason);
    $('dead-sub').textContent = 'You can close this page.';
  }

  fetch('/api/live/' + encodeURIComponent(token) + '/status', { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 404) { showDead('not_found'); return null; }
      if (!r.ok) { $('gate-sub').textContent = "Couldn't reach the server. Retrying is safe — reload this page."; return null; }
      return r.json();
    })
    .then(function (j) {
      if (!j) return;
      if (!j.usable) { showDead(j.reason || j.state); return; }
      $('gate-sub').textContent = 'Enter a name so the host knows who is watching.';
      $('gate-form').style.display = '';
      $('nm').focus();
    })
    .catch(function () { $('gate-sub').textContent = "Couldn't reach the server. Reload to try again."; });

  $('go').addEventListener('click', function () {
    var name = $('nm').value.trim();
    if (!name) { $('nm').focus(); return; }
    $('go').disabled = true;
    // Asks for VIEWER explicitly. The host role is decided from the cookie, and
    // the cookie rides this same-origin request — so without this, the host
    // opening the link he just copied (the first thing anyone does after
    // pressing Present) joined his own room AS HOST from this read-only page,
    // took the room's one host row, and terminated the tab he was presenting
    // from. The server treats `as` as a downgrade only.
    session = new window.p86Live.Session({
      token: token, displayName: name, asViewer: true,
      onChange: onChange, onMirror: onMirror
    });
    $('gate').style.display = 'none';
    $('live').style.display = '';
    $('bar').style.display = '';
    session.start();
  });

  // ── The document ───────────────────────────────────────────────────────
  // One fetch per surface change, from the ONE door that serves a guest a
  // document. There is no parameter here that could name a record: the server
  // reads the entity from the room row.
  function loadSurface(surface, force) {
    if (!session || !session.roomId || !session.streamKey || !surface) return;
    if (!force && surface === mySurface && lastDoc) { paint(); return; }
    var mine = ++reqSeq;
    var url = '/api/live/' + encodeURIComponent(session.roomId) + '/view/' +
              encodeURIComponent(session.streamKey) + '/' + encodeURIComponent(surface);
    fetch(url, { cache: 'no-store', credentials: 'omit' })
      .then(function (r) {
        if (r.status === 404 || r.status === 410) {
          // The credential died under us (rejoined, kicked, room over). The
          // session's own recovery is the authority on which; do not guess.
          return null;
        }
        if (!r.ok) return null;
        return r.json();
      })
      .then(function (j) {
        if (mine !== reqSeq) return;   // a newer navigation already won
        if (!j) { paint(); return; }
        mySurface = j.surface;
        lastDoc = j.view;
        lastFetchAt = j.at;
        paint();
      })
      .catch(function () { if (mine === reqSeq) paint(); });
  }

  function followHost(force) {
    var hv = (session && session.hostView) || {};
    if (!hv.surface) { paint(); return; }
    loadSurface(hv.surface, force);
  }

  // ── The stage ──────────────────────────────────────────────────────────
  // A mirror frame is PULLED, never pushed: the pointer arrives on the stream
  // and the bytes come over an ordinary GET, which compresses (the SSE stream
  // sets no-transform and cannot) and which this phone fetches at its own pace
  // rather than being one of twenty-five copies queued in a synchronous loop.
  function dropStage() {
    stageOn = false;
    if (Stage) { try { Stage.teardown(); } catch (e) {} }
    var w = $('stage-wrap');
    if (w) { w.style.display = 'none'; w.innerHTML = ''; }
    // The structured document has to be allowed to repaint underneath. Without
    // this, docSig still matches the document that was suppressed while the
    // stage was up and the guest is left with an empty surface.
    docSig = null;
  }

  // Is the screen the host is on one this room can mirror? Answered from the
  // server's own list (shipped on `hello`), not from whether pixels happen to
  // have arrived — the difference is what lets the bar say "this screen isn't
  // mirrored, here's the structured version" instead of "loading…" forever.
  function mirrorableHere() {
    if (!session || session.mode !== 'mirror') return false;
    var hv = session.hostView || {};
    var list = session.mirrorSurfaces || [];
    return !!hv.surface && list.indexOf(hv.surface) >= 0;
  }

  function pullFrame() {
    if (!Stage || !session || !session.roomId || !session.streamKey) return;
    if (stagePulling) return;
    stagePulling = true;
    var url = '/api/live/' + encodeURIComponent(session.roomId) + '/mirror/' +
              encodeURIComponent(session.streamKey) + '/snapshot';
    fetch(url, { cache: 'no-store', credentials: 'omit' })
      .then(function (r) {
        stagePulling = false;
        // 404 NO_SNAPSHOT is "I have nothing yet", not "there is nothing".
        // 409 is a mode change or a surface that moved. Neither is a terminal
        // state and neither is guessed at: the session's own recovery decides.
        if (!r.ok) return null;
        return r.json();
      })
      .then(function (j) {
        if (!j || !j.frame) { paint(); return; }
        var wrap = $('stage-wrap');
        wrap.style.display = '';
        var ok = Stage.applySnapshot(wrap, {
          root: j.frame.root, meta: j.frame.meta,
          snapSeq: j.snapSeq, surface: j.surface
        });
        stageOn = !!ok;
        if (ok) {
          // The stage is showing, so the structured document must not be
          // underneath it claiming to be the same thing.
          $('surface').innerHTML = '';
          docSig = null;
          lastFetchAt = j.at;
          mySurface = j.surface;
        } else {
          wrap.style.display = 'none';
        }
        paint();
      })
      .catch(function () { stagePulling = false; });
  }

  // Every mirror event, from the session. The session holds the POINTER; this
  // holds the document.
  function onMirror(kind, data) {
    if (!Stage) return;
    if (kind === 'mode') {
      // Mode changed under us. DISCARD and rebuild — never patch across an
      // arrangement change, the same rule `policy` has always followed.
      dropStage();
      preferText = false;
      if (mySurface) loadSurface(mySurface, true);
      paint();
      return;
    }
    if (kind === 'off') {
      // The host stepped somewhere the mirror does not follow. Drop the pixels
      // rather than leave a stale screen presented as live; the structured
      // document for wherever he actually is takes over if there is one.
      dropStage();
      mirrorRefusal = (data && data.reason) || null;
      var hv = (session && session.hostView) || {};
      if (following && hv.surface) loadSurface(hv.surface, true);
      paint();
      return;
    }
    if (kind === 'snap') {
      mirrorRefusal = null;
      if (preferText) { paint(); return; }
      if (!data || !data.snapSeq) return;
      if (Stage.have() && Stage.snapSeq() === data.snapSeq && Stage.surface() === data.surface) return;
      pullFrame();
      return;
    }
    if (kind === 'ops') {
      if (preferText || !Stage.have()) return;
      if (Stage.surface() !== data.surface) { pullFrame(); return; }
      // A batch cut against a base we are not holding is DROPPED and a fresh
      // frame pulled. A patch applied to the wrong document is worse than a
      // missing patch, because it looks like data.
      if (!Stage.applyOps(data.ops, data.snapSeq)) pullFrame();
      lastFetchAt = new Date().toISOString();
    }
  }

  $('fitbtn').addEventListener('click', function () {
    if (!Stage) return;
    Stage.setFit(!Stage.fit());
    $('fitbtn').setAttribute('aria-pressed', Stage.fit() ? 'true' : 'false');
    $('fitbtn').textContent = Stage.fit() ? 'Actual size' : 'Fit';
  });

  $('readable').addEventListener('click', function () {
    preferText = !preferText;
    if (preferText) { dropStage(); if (mySurface) loadSurface(mySurface, true); }
    else if (session && session.mirror && session.mirror.snapSeq) pullFrame();
    paint();
  });

  // ── Reacting to the session ────────────────────────────────────────────
  var lastPolicyMoney = null;
  var lastHostSurface = null;

  function onChange() {
    if (!session) return;
    if (session.terminal) { showDead(session.terminalReason); return; }

    // The arrangement changed. DISCARD and refetch — never patch. Flipping the
    // toggle off must not be a client-side unhide of data the client does not
    // have, and flipping it on must not leave live numbers in memory.
    var money = !!(session.policy && session.policy.money);
    if (lastPolicyMoney !== null && lastPolicyMoney !== money) {
      lastDoc = null;
      $('surface').innerHTML = '';
      if (mySurface) loadSurface(mySurface, true);
    }
    lastPolicyMoney = money;

    var hv = session.hostView || {};
    if (hv.surface !== lastHostSurface) {
      lastHostSurface = hv.surface;
      if (following) followHost(true);
    }
    // First document, once the stream has told us where he is.
    if (!lastDoc && following && hv.surface) followHost(false);

    // First FRAME, once the stream has told us there is one. `hello` carries
    // the current pointer for exactly this: without it a mid-session joiner
    // would stare at the structured document until the host's next wholesale
    // repaint, which on the WIP pane can be minutes.
    if (!preferText && mirrorableHere() && session.mirror && session.mirror.snapSeq &&
        (!Stage.have() || Stage.snapSeq() !== session.mirror.snapSeq)) {
      pullFrame();
    }
    // Mode went back to structured while a frame was up.
    if (session.mode !== 'mirror' && stageOn) dropStage();
    paint();
  }

  // ── Painting ───────────────────────────────────────────────────────────
  function paint() {
    if (!session) return;
    var st = session.state();
    if (st.kind === 'ended') { showDead(session.terminalReason); return; }

    paintTabs();
    paintBar(st);
    paintRoster(st);
    // Only when the DOCUMENT changed. A 1Hz innerHTML rewrite would fight text
    // selection and reset the horizontal scroll inside a wide table on every
    // tick — on the one device this feature is for.
    //
    // And never while the stage is up: the structured document underneath a
    // mirrored pane would be a second, differently-shaped copy of the same
    // screen, and a viewer who scrolled past the stage would find it.
    if (lastDoc && !stageOn) {
      var sig = lastFetchAt + '|' + lastDoc.surface;
      if (sig !== docSig) { docSig = sig; View.render($('surface'), lastDoc); }
    }
  }

  function paintTabs() {
    var list = (session && session.surfaces) || [];
    var el = $('tabs');
    var html = '';
    for (var i = 0; i < list.length; i++) {
      html += '<button type="button" class="lv-tab' + (list[i].key === mySurface ? ' is-active' : '') +
              '" data-surface="' + esc(list[i].key) + '">' + esc(list[i].label) + '</button>';
    }
    if (el.getAttribute('data-sig') !== html) { el.innerHTML = html; el.setAttribute('data-sig', html); }
  }

  // The guest's own tab strip is what makes Following a TOGGLE rather than a
  // jail. An unfollowed guest may move among the SAME allow-listed surfaces of
  // the SAME room — so breaking off reaches nothing a following guest could
  // not. The toggle changes WHEN they fetch, never WHAT they may fetch.
  $('tabs').addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('[data-surface]') : null;
    if (!b) return;
    var s = b.getAttribute('data-surface');
    var hv = (session && session.hostView) || {};
    if (s !== hv.surface) setFollowing(false);
    // Breaking off in mirror mode means leaving the pixels behind: the stage
    // shows the host's pane and only the host's pane, so a guest reading a
    // different surface must get that surface's structured document rather than
    // tapping a tab and watching nothing happen underneath a mirrored screen.
    if (stageOn && s !== Stage.surface()) dropStage();
    loadSurface(s, true);
  });

  function setFollowing(on) {
    following = !!on;
    $('follow').setAttribute('aria-pressed', following ? 'true' : 'false');
    $('follow').textContent = following ? 'Following' : 'Follow';
    if (following) {
      // Coming back to the host means coming back to his PIXELS where there are
      // any. Without this, "Back to John's view" would land the guest on the
      // structured document of a screen that is being mirrored — a quieter
      // version of the same confusion the mode chip exists to prevent.
      if (!preferText && mirrorableHere()) pullFrame();
      followHost(true);
    } else paint();
  }
  $('follow').addEventListener('click', function () { setFollowing(!following); });
  $('back').addEventListener('click', function () { setFollowing(true); });

  function paintBar(rosterSt) {
    var hv = (session && session.hostView) || {};
    var who = hostName();
    var m = View.mirrorState({
      terminal: session.terminal,
      multiInstance: session.multiInstance,
      msSinceFrame: session.lastFrameAt ? (Date.now() - session.lastFrameAt) : null,
      attempts: session.attempts,
      following: following,
      hostSurface: hv.surface,
      hostReason: hv.reason,
      hostSurfaceLabel: surfaceLabel(hv.surface),
      mySurface: mySurface,
      hostName: who
    });

    var bar = $('bar');
    bar.setAttribute('data-kind', m.kind);
    $('bar-claim').textContent = m.claim || (who + "'s screen");

    // ── WHICH ARRANGEMENT, said out loud, on every paint ──────────────────
    // "A viewer who believes they are seeing a filtered view while receiving a
    // raw one is the bad outcome." So the mode is never inferred from what
    // arrived: it is stated, per surface, and the two cases are worded
    // differently enough that nobody can mistake one for the other.
    var mirroring = session.mode === 'mirror';
    var arrangement;
    if (stageOn) arrangement = who + "'s actual screen, live";
    else if (mirroring && mirrorRefusal) arrangement = "this screen isn't mirrored — structured version";
    else if (mirroring && mirrorableHere()) arrangement = 'waiting for ' + who + "'s screen";
    else if (mirroring) arrangement = "this screen isn't mirrored — structured version";
    else arrangement = 'structured view, built by the server';

    // Whose screen · read-only · which arrangement · when the link dies.
    var bits = [who + "'s screen", 'read-only', arrangement];
    if (session.room && session.room.expires_at) {
      var exp = View.expiryText(session.room.expires_at);
      if (exp) bits.push(exp);
    }
    $('bar-sub').textContent = bits.join(' · ');

    // On the everything-is-working branch the bar now says NOTHING extra. It
    // used to apologise here — "you see his screens, not their pointer" — which
    // was true, and was an apology for an absent feature phrased as a
    // deficiency, on the one branch where nothing is wrong. What replaced it is
    // a positive statement in the sub-line, and it is now literally accurate:
    // same document, same rows, same labels, reflowed.
    //
    // Every NON-following note is untouched. broken / unconfirmed / not_shared
    // are the honest core of this feature and the one thing the bar must never
    // do is stop admitting it cannot verify.
    var note = m.note || '';
    // The mirror's own honesty notes, which are about a DIFFERENT fact than the
    // room's: the host can be on a perfectly shared screen while the mirror
    // declines to send pixels for it, and in that case the viewer is getting
    // the structured document and must be told so rather than left to assume.
    if (!note && mirroring && !stageOn) {
      if (mirrorRefusal) {
        note = REFUSAL_NOTE[mirrorRefusal] ||
               "This screen isn't mirrored — you're seeing the structured version, built by the server.";
      } else if (mirrorableHere()) {
        note = 'Waiting for the first frame of ' + who + "'s screen.";
      } else {
        note = "This screen isn't mirrored — you're seeing the structured version, built by the server.";
      }
    }
    if (!note && stageOn && preferText) note = '';
    $('bar-note').textContent = note;
    $('bar-note').style.display = note ? '' : 'none';

    // The stage's own two controls appear only while there are pixels to
    // control, and the reader stays reachable while it is ON so it is a toggle
    // rather than a trapdoor.
    $('fitbtn').style.display = stageOn ? '' : 'none';
    $('readable').style.display = (stageOn || (mirroring && preferText && mirrorableHere())) ? '' : 'none';
    $('readable').textContent = preferText ? 'Screen' : 'Text';
    $('readable').setAttribute('aria-pressed', preferText ? 'true' : 'false');

    $('back').style.display = m.showBack ? '' : 'none';
    if (m.showBack) $('back').textContent = m.backLabel;

    // A stale document keeps its numbers — they were real when fetched — but
    // it stops claiming to be current, and says WHEN it was true.
    var stampEl = $('stamp');
    if (m.stamp && lastFetchAt) {
      stampEl.textContent = View.stampText(lastFetchAt);
      stampEl.style.display = '';
    } else {
      stampEl.style.display = 'none';
    }

    if (rosterSt) { /* roster health is painted separately */ }
  }

  function paintRoster(st) {
    var list = Core.visibleParticipants(session.participants, st);
    var r = $('roster');
    r.className = 'roster' + (st.dim ? ' is-dim' : '');
    $('roster-summary').textContent = st.showRoster
      ? ('In this session (' + list.length + ')')
      : 'In this session';
    var out = '';
    if (!st.showRoster) {
      // NOT a stale roster with an apology attached: if we cannot verify who is
      // watching, we must not draw their faces. Phase 01's rule, unchanged.
      out = '';
    } else if (!list.length) {
      out = '<div class="row"><span class="who">Just you so far.</span></div>';
    } else {
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        out += '<div class="row' + (p.presence === 'stale' ? ' is-stale' : '') + '">' +
               '<span class="who">' + esc(p.name) + (p.id === session.participantId ? ' (you)' : '') + '</span>' +
               (p.presence === 'stale' ? '<span class="flag">not responding</span>' : '') +
               (p.role === 'host' ? '<span class="flag">host</span>' : '') +
               '</div>';
      }
    }
    if (out !== rosterSig) { rosterSig = out; r.innerHTML = out; }
    $('roster-note').textContent = st.message || '';
  }

  // Coming back from another app is the most common mobile interaction there
  // is, and the host has moved while we were gone. Refetch rather than trust a
  // stale document — without this, "check a text, come back" shows a
  // confidently wrong page.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (!session || session.terminal) return;
    // A mirrored frame is far more likely to be stale after a trip to another
    // app than a structured document is — the host has been moving the whole
    // time and mutations are not replayed. Pull a whole frame rather than trust
    // a patch chain we were not awake for.
    if (!preferText && mirrorableHere()) pullFrame();
    if (following) followHost(true);
    else if (mySurface) loadSurface(mySurface, true);
  });

  // The stage is sized to the HOST's pane width and scaled to fit this screen,
  // so a rotation changes what "fit" means. Re-laid out rather than re-pulled.
  window.addEventListener('resize', function () { if (Stage && stageOn) Stage.relayout(); });

  // The repaint that lets "we can't tell" arrive on its own — it is a state
  // reached by the ABSENCE of news, so no event fires to announce it.
  setInterval(function () { try { if (session) paint(); } catch (e) {} }, 1000);

  window.addEventListener('pagehide', function () { if (session) session.stop('pagehide'); });
})();
</script>
</body>
</html>
